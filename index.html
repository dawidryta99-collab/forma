async function login(e){e.preventDefault();try{const r=await sb.auth.signInWithPassword({email:v('email'),password:v('password')});check(r);await initSession()}catch(e){message(e.message,true)}}async function logout(){await sb.auth.signOut();user=null;showLogin()}async function initSession(){const {data:{user:u}}=await sb.auth.getUser();user=u;if(!u){showLogin();return}try{me=check(await sb.from('profiles').select('*').eq('id',u.id).single());await load()}catch(e){document.body.classList.add('authMode');$('title').textContent='Brak dostępu';$('tabs').innerHTML='';$('app').innerHTML=card(`<p>Nie znaleziono profilu lub brak uprawnień.</p><p class="error">${esc(e.message)}</p>${btn('Wyloguj się','logout()')}`)}}

const mainTrainer=[['start','Start','home'],['clients','Podopieczne','users'],['calendar','Kalendarz','calendar'],['exercises','Biblioteka ćwiczeń','dumbbell'],['recipes','Biblioteka przepisów','book']];
const clientSections=[['profile','Profil','user'],['plan','Plan treningowy','dumbbell'],['diary','Dziennik treningowy','list'],['progress','Dziennik progresu','chart'],['nutrition','Plan odżywiania','heart'],['home','Plan domowy','home']];

function switchTab(next){if(next!=='plan')trainingDraft=null;tab=next;render();window.scrollTo({top:0,behavior:'smooth'})}

function render(){if(!me)return;document.body.classList.remove('authMode');if(trainer()&&clientSections.some(x=>x[0]===tab)&&!selected)tab='clients';const valid=trainer()?[...mainTrainer.map(x=>x[0]),...clientSections.map(x=>x[0]),'addclient','survey','more']:[...mainClient.map(x=>x[0]),'survey','more'];if(!valid.includes(tab))tab='start';const names={...Object.fromEntries([...mainClient,...mainTrainer].map(x=>[x[0],x[1]])),diary:'Dziennik treningowy',profile:'Profil podopiecznej',more:'Więcej',addclient:'Nowa podopieczna',survey:'Preferencje'};$('title').textContent=names[tab]||'FORMA';$('tabs').innerHTML='';renderMenus();
const handlers={start:()=>start(),clients:()=>clientsPage(),calendar:()=>calendarPage(),exercises:()=>exercisesPage(),recipes:()=>recipesPage(),profile:()=>profilePage(),plan:()=>plan(),diary:()=>diaryPage(),progress:()=>progress(),nutrition:()=>plannedFeature('Plan odżywiania','Wprowadzanie zaleceń kalorycznych, białka i suplementacji uruchomimy w etapie 5.'),home:()=>plannedFeature('Plan domowy','Treningi domowe i cel kroków uruchomimy w etapie 5.'),addclient:()=>plannedFeature('Dodanie podopiecznej','Zapraszanie klientek e-mailem wymaga bezpiecznego procesu serwerowego. Zostanie wdrożone w etapie 2; nie trzeba ręcznie wpisywać UUID.'),survey:()=>survey(),more:()=>morePage()};

function start(){if(trainer()){const name=esc(me.full_name?.split(' ')[0]||'Zuzia');const d=new Date().toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});return `<div class="dashboardIntro"><div class="eyebrow">${esc(d)}</div><h2 style="font-size:24px;margin:8px 0 6px">Dzień dobry, ${name}.</h2><p class="hint">Twoje centrum zarządzania treningami i podopiecznymi.</p></div><div class="dashboardGrid"><div class="stack">${card(`<div class="sectionHeading"><h2>Dzisiejsze treningi</h2><button class="ghost" onclick="switchTab('calendar')">Kalendarz →</button></div>${bookings.filter(b=>b.status==='approved'&&new Date(b.starts_at).toDateString()===new Date().toDateString()).map(b=>`<div class="flatRow"><b>${esc(new Date(b.starts_at).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'}))}</b><span>${esc(clients.find(c=>c.id===b.client_id)?.full_name||'Podopieczna')}</span></div>`).join('')||'<div class="emptyState">Brak treningów na dzisiaj.</div>'}`)}${card(`<div class="sectionHeading"><h2>Oczekujące prośby</h2><span class="statusPill">Etap 3</span></div><div class="emptyState">Prośby o rezerwację i zmiany terminów będą widoczne tutaj.</div>`)}</div>${card(`<div class="sectionHeading"><h2>Powiadomienia</h2>${ico('bell')}</div><p class="hint">Nowe zmiany wprowadzone przez podopieczne będą oznaczane kropką i poprowadzą do konkretnego wpisu.</p><div class="emptyState">System powiadomień włączymy w etapie 6. Nie wyświetlamy fikcyjnych alertów.</div>`)}</div><div style="margin-top:21px">${clientBrowser()}</div>`}
const c=me;const weights=measurements.filter(m=>m.weight_kg!=null);const last=weights[weights.length-1];const first=weights[0];return `<div class="softBanner"><div class="eyebrow">Twoja przestrzeń FORMA</div><h2>Cześć, ${esc(c.full_name?.split(' ')[0]||'')}!</h2><p class="hint">Twój plan, treningi i postępy w jednym miejscu.</p></div>${card(`<div class="sectionHeading"><h2>Najbliższy trening</h2><span class="statusPill">Zatwierdzony termin</span></div><p class="hint">${(()=>{const next=bookings.filter(b=>b.client_id===me.id&&b.status==='approved'&&new Date(b.starts_at)>=new Date()).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at))[0];return next?esc(bookingLabel(next)+' · '+(next.title||'Trening bez planu')):'Brak nadchodzących treningów.'})()}</p><button class="pillLink" onclick="switchTab('plan')">Zobacz swój plan →</button>`)}<div class="metricGrid"><div class="metric"><div class="miniLabel">Ostatnia masa ciała</div><div class="metricValue">${last?esc(last.weight_kg)+' kg':'—'}</div><div class="muted">${last?displayDate(last.measured_on):'Brak pomiarów'}</div></div><div class="metric"><div class="miniLabel">Masa początkowa</div><div class="metricValue">${first?esc(first.weight_kg)+' kg':'—'}</div><div class="muted">Pierwszy zapis</div></div><div class="metric"><div class="miniLabel">Zapisane sesje</div><div class="metricValue">${sessions.length}</div><div class="muted">W obecnym dzienniku</div></div></div><div class="featureGrid" style="margin-top:16px">${card(`<h2>Plan treningowy</h2><p>Sprawdź zapisane ćwiczenia i serie.</p><button class="ghost" onclick="switchTab('plan')">Otwórz plan →</button>`)}${card(`<h2>Plan domowy</h2><p>Ćwiczenia mobilizacyjne i cel kroków uruchomimy w kolejnym etapie.</p><button class="ghost" onclick="switchTab('home')">Zobacz sekcję →</button>`)}</div>`}

function diaryPage(){const existing=card(`<h2>Dziennik treningowy</h2><p class="hint">Historia zapisanych serii. Rozbudowane porównania i komentarze wdrożymy w kolejnym kroku.</p>${sessions.map(s=>{const ss=sets.filter(x=>x.session_id===s.id);return `<details class="exercise"><summary style="cursor:pointer"><strong>${displayDate(s.started_at)}</strong> · ${ss.length} zapisanych serii</summary><div style="padding:9px 0 0">${ss.length?ss.map(x=>`<div class="flatRow"><span>${esc(exercises.find(e=>e.id===x.exercise_id)?.name||'Ćwiczenie')}</span><b>${esc(x.weight_kg??'—')} kg × ${esc(x.reps??'—')}</b></div>`).join(''):'<p class="hint">Brak zapisanych serii</p>'}</div></details>`}).join('')||'<div class="emptyState">Brak zapisanych wyników. Dodaj pierwszą serię poniżej.</div>'}`);

function morePage(){const menu=trainer()?[...mainTrainer.slice(3),['survey','Ankiety','list'],['addclient','Dodaj podopieczną','users']]:[['profile','Profil','user'],['progress','Dziennik progresu','chart'],['nutrition','Plan odżywiania','heart'],['home','Plan domowy','home'],['exercises','Biblioteka ćwiczeń','dumbbell'],['recipes','Biblioteka przepisów','book'],['survey','Preferencje ćwiczeń','list']];return card(`<h2>Pozostałe funkcje</h2>${menu.map(x=>`<div class="flatRow"><button class="navItem" onclick="switchTab('${x[0]}')">${ico(x[2])}<span>${esc(x[1])}</span></button></div>`).join('')}`)}

function addclient(){return card(`<h2>Nowa podopieczna</h2><p class="muted">Utwórz konto w Supabase Authentication → Users → Add user, a następnie profil tutaj, używając UUID utworzonego konta. Nie wpisuj hasła klientki w tym formularzu.</p><div class="formgrid">${input('UUID użytkowniczki z Authentication *','cid')}${input('Imię i nazwisko *','cname')}${input('E-mail *','cemail','email')}${input('Telefon','cphone')}<div><label>Cel treningowy</label><select id="cgoal"><option>Redukcja tkanki tłuszczowej</option><option>Budowa masy mięśniowej</option><option>Zwiększenie siły</option><option>Sprawność i zdrowie</option></select></div><div><label>Treningi tygodniowo</label><select id="cfreq"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></div>${input('Data rozpoczęcia','cstart','date',today())}</div><label>Prywatne notatki trenerki</label><textarea id="cnotes"></textarea><div style="margin-top:14px">${btn('Zapisz profil','createClient()')}</div>`)}async function createClient(){try{if(!/^[0-9a-f-]{36}$/i.test(v('cid'))||!v('cname')||!v('cemail').includes('@'))throw Error('Uzupełnij UUID, imię i poprawny e-mail.');check(await sb.from('profiles').insert({id:v('cid'),full_name:v('cname'),email:v('cemail'),phone:v('cphone')||null,role:'client',goal:v('cgoal'),weekly_sessions:number('cfreq'),start_date:v('cstart')||null,trainer_notes:v('cnotes')||null}));await load();tab='clients';render();message('Profil podopiecznej został zapisany.')}catch(e){message(e.message,true)}}
function survey(){if(trainer())return card(`<h2>Ankiety zgłoszeniowe</h2><p class="muted">Ankiety zebrane w bazie danych. Formularz publiczny przed założeniem konta wymaga osobnego, zabezpieczonego punktu API — nie otwieramy anonimowego zapisu do tabeli.</p>${questionnaires.map(q=>`<div class="row"><div><b>${esc(q.contact_name)}</b><div class="small muted">${esc(q.contact_email)} · ${esc(q.status)}</div><details><summary>Zobacz odpowiedzi</summary><pre style="white-space:pre-wrap;max-width:450px">${esc(JSON.stringify(q.answers,null,2))}</pre></details></div>`).join('')||'<p class="muted">Brak ankiet.</p>'}`);return card(`<h2>Preferencje ćwiczeń</h2><p class="muted">Zaznacz, które ćwiczenia lubisz. Odpowiedzi są zapisywane na Twoim koncie.</p>${Object.entries(groups).map(([group,names])=>`<h3 style="margin-top:20px">${group}</h3>${names.map(name=>{const ex=exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!ex)return `<div class="row"><span>${esc(name)}</span><span class="small muted">Jeszcze nie dodano do biblioteki</span></div>`;const cur=preferences.find(p=>p.exercise_id===ex.id)?.preference;return `<div class="exercise"><b>${esc(name)}</b><div class="choice">${['Lubię','Neutralne','Nie lubię','Nie znam'].map(p=>`<button class="${cur===p?'on':''}" onclick="setPref('${ex.id}','${p}')">${p}</button>`).join('')}</div></div>`}).join('')}`).join('')}`)}async function setPref(id,p){try{check(await sb.from('exercise_preferences').upsert({client_id:me.id,exercise_id:id,preference:p},{onConflict:'client_id,exercise_id'}));await loadClient();render()}catch(e){message(e.message,true)}}
/* Plan pojedynczego treningu: tworzenie, zapisywanie atomowe i późniejsza edycja. */
function bookingDate(b){return new Date(b.starts_at).toLocaleString('pl-PL',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function bookingLabel(b){const d1=new Date(b.starts_at),d2=new Date(b.ends_at);return bookingDate(b)+'–'+d2.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}
function futureBookingsForClient(){return bookings.filter(b=>b.client_id===clientId()&&b.status==='approved')}
function unplannedBookings(){return futureBookingsForClient().filter(b=>!plans.some(p=>p.booking_id===b.id))}
function startTraining(){if(!trainer())return;const available=unplannedBookings();if(!available.length){message('Najpierw dodaj zatwierdzony termin w Kalendarzu lub edytuj wcześniej zapisany trening.',true);return}trainingDraft={mode:'new',booking_id:available[0].id,name:'',notes:'',items:[]};render()}
function editTraining(id){if(!trainer())return;const p=plans.find(x=>x.id===id);if(!p||!p.booking_id){message('Ten starszy plan nie jest powiązany z kalendarzem. Można go przeglądać, ale nie edytować w nowym formularzu.',true);return}
trainingDraft={mode:'edit',booking_id:p.booking_id,name:p.name||'',notes:p.description||'',items:planExercises.filter(e=>e.plan_id===p.id).map(e=>({exercise_id:e.exercise_id,sets_target:e.sets_target??3,reps_target:e.reps_target||'',weight_target_kg:e.weight_target_kg??0,notes:e.notes||''}))};render()}
function captureTrainingDraft(){if(!trainingDraft)return;trainingDraft.booking_id=v('trainingBooking')||trainingDraft.booking_id;trainingDraft.name=v('trainingName');trainingDraft.notes=v('trainingNotes');trainingDraft.items.forEach((x,i)=>{x.exercise_id=v('trainingExercise-'+i)||x.exercise_id;x.sets_target=v('trainingSets-'+i);x.reps_target=v('trainingReps-'+i);x.weight_target_kg=v('trainingWeight-'+i);x.notes=v('trainingExNotes-'+i)})}
function addTrainingExercise(){captureTrainingDraft();if(!exercises.length){message('Najpierw dodaj ćwiczenie do Biblioteki ćwiczeń.',true);return}trainingDraft.items.push({exercise_id:exercises[0].id,sets_target:3,reps_target:'10',weight_target_kg:0,notes:''});render()}
function removeTrainingExercise(i){captureTrainingDraft();trainingDraft.items.splice(i,1);render()}
function moveTrainingExercise(i,d){captureTrainingDraft();const j=i+d;if(j<0||j>=trainingDraft.items.length)return;[trainingDraft.items[i],trainingDraft.items[j]]=[trainingDraft.items[j],trainingDraft.items[i]];render()}
function cancelTrainingEdit(){trainingDraft=null;render()}
function trainingExerciseFields(x,i){return `<div class="trainingExc"><div class="trainingExcName"><label for="trainingExercise-${i}">Ćwiczenie ${i+1}</label><select id="trainingExercise-${i}">${exercises.map(e=>`<option value="${esc(e.id)}" ${x.exercise_id===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div><div><label for="trainingSets-${i}">Serie</label><input id="trainingSets-${i}" type="number" min="1" max="30" step="1" value="${esc(x.sets_target)}"></div><div><label for="trainingReps-${i}">Powtórzenia</label><input id="trainingReps-${i}" maxlength="40" value="${esc(x.reps_target)}"></div><div><label for="trainingWeight-${i}">Ciężar (kg)</label><input id="trainingWeight-${i}" type="number" min="0" max="9999" step="0.25" value="${esc(x.weight_target_kg)}"></div><div class="trainingExcButtons"><button type="button" title="Przesuń wyżej" aria-label="Przesuń ćwiczenie wyżej" ${i===0?'disabled':''} onclick="moveTrainingExercise(${i},-1)">↑</button><button type="button" title="Przesuń niżej" aria-label="Przesuń ćwiczenie niżej" ${i===trainingDraft.items.length-1?'disabled':''} onclick="moveTrainingExercise(${i},1)">↓</button><button type="button" title="Usuń ćwiczenie" aria-label="Usuń ćwiczenie" onclick="removeTrainingExercise(${i})">✕</button></div><div class="trainingExcNotes"><label for="trainingExNotes-${i}">Uwagi do ćwiczenia (opcjonalnie)</label><input id="trainingExNotes-${i}" value="${esc(x.notes||'')}" placeholder="Np. tempo, zakres ruchu, wskazówki"></div></div>`}
function trainingEditForm(){if(!trainingDraft)return '';const d=trainingDraft;const available=d.mode==='edit'?futureBookingsForClient().filter(b=>b.id===d.booking_id):unplannedBookings();return `<div class="trainingForm"><div class="trainingHead"><h3 style="margin:0">${d.mode==='edit'?'Edytuj trening':'Nowy trening'}</h3><span class="statusPill">Zapis do Supabase</span></div><p class="hint">Wybierz zatwierdzony termin z kalendarza, uzupełnij plan i zapisz wszystkie ćwiczenia jednym przyciskiem.</p><div class="formgrid"><div><label for="trainingBooking">Wybierz trening z kalendarza *</label><select id="trainingBooking" ${d.mode==='edit'?'disabled':''}>${available.map(b=>`<option value="${esc(b.id)}" ${b.id===d.booking_id?'selected':''}>${esc(bookingLabel(b))}</option>`).join('')}</select></div>${input('Nazwa treningu *','trainingName','text',d.name)}</div><h3>Ćwiczenia</h3>${d.items.length?d.items.map(trainingExerciseFields).join(''):'<div class="emptyState">Nie dodano ćwiczeń. Kliknij „+ Dodaj ćwiczenie”.</div>'}<button type="button" class="ghost" style="margin-top:10px" onclick="addTrainingExercise()">＋ Dodaj ćwiczenie</button><label for="trainingNotes" style="margin-top:18px">Komentarz do treningu (opcjonalnie)</label><textarea id="trainingNotes" placeholder="Opcjonalne uwagi do planu…">${esc(d.notes)}</textarea><div class="trainingActions"><button type="button" class="ghost" onclick="cancelTrainingEdit()">Anuluj</button><button type="button" id="saveTrainingButton" class="primary trainingSave" onclick="saveTrainingDraft()">✓ Zapisz trening</button></div></div>`}
function storedPlanCard(p){const b=bookings.find(x=>x.id===p.booking_id),ex=planExercises.filter(x=>x.plan_id===p.id);const label=b?displayDate(b.starts_at):'Bez przypisanego terminu';return `<details class="trainingSaved"><summary><div class="trainingSavedIntro"><strong>${esc(label)} · ${esc(p.name)}</strong><span class="trainingDate">${ex.length} ćwiczeń</span></div>${trainer()&&p.booking_id?`<button type="button" class="ghost trainingSavedEdit" onclick="event.preventDefault();event.stopPropagation();editTraining('${esc(p.id)}')">✎ Edytuj</button>`:''}</summary><div class="trainingSavedContent">${p.description?`<p class="hint">${esc(p.description)}</p>`:''}${ex.map(x=>`<div class="flatRow"><div><b>${esc(exercises.find(e=>e.id===x.exercise_id)?.name||'Ćwiczenie')}</b>${x.notes?`<div class="hint">${esc(x.notes)}</div>`:''}</div><span class="small">${esc(x.sets_target??'—')} serii × ${esc(x.reps_target??'—')} · ${x.weight_target_kg===null||x.weight_target_kg===undefined?'—':esc(x.weight_target_kg)} kg</span></div>`).join('')||'<div class="hint">Brak zaplanowanych ćwiczeń</div>'}</div></details>`}
function currentWeekRange(){const start=new Date();start.setHours(0,0,0,0);const day=(start.getDay()+6)%7;start.setDate(start.getDate()-day);const end=new Date(start);end.setDate(end.getDate()+7);return [start,end]}
function plan(){const isT=trainer();if(!clientId())return card('<h2>Plan treningowy</h2><div class="emptyState">Wybierz podopieczną.</div>');const c=clients.find(x=>x.id===clientId()),all=plans.filter(p=>p.booking_id&&bookings.some(b=>b.id===p.booking_id&&b.status==='approved'));const legacy=plans.filter(p=>!p.booking_id);let visible=all;
if(!isT){const [a,b]=currentWeekRange();visible=all.filter(p=>{const d=bookings.find(x=>x.id===p.booking_id);return d&&new Date(d.starts_at)>=a&&new Date(d.starts_at)<b})}
const ordered=visible.slice().sort((a,b)=>new Date(bookings.find(x=>x.id===a.booking_id)?.starts_at||0)-new Date(bookings.find(x=>x.id===b.booking_id)?.starts_at||0));const pending=isT?unplannedBookings():bookings.filter(b=>b.client_id===clientId()&&b.status==='approved'&&!plans.some(p=>p.booking_id===b.id));
return `${card(`<div class="trainingToolbar"><div><h2>${isT?'Plan treningowy':'Mój plan treningowy'}</h2><p class="hint">${isT?`Podopieczna: ${esc(c?.full_name||'—')}. Każdy plan przypisujemy do zatwierdzonego terminu.`:'Treningi w bieżącym tygodniu — zaplanowane ćwiczenia.'}</p></div>${isT?`<button type="button" class="primary" onclick="startTraining()" ${!pending.length?'disabled':''}>＋ Utwórz trening</button>`:''}</div>${!bookingsReady?`<div class="calendarSetup">Najpierw uruchom dostarczony skrypt SQL w Supabase, aby włączyć kalendarz i zapis planów.</div>`:''}${isT&&!pending.length&&!trainingDraft?`<p class="hint">${futureBookingsForClient().length?'Wszystkie zatwierdzone terminy mają już plan. Możesz edytować zapisane treningi.':'Nie ma zatwierdzonych terminów dla tej podopiecznej. Dodaj termin w Kalendarzu.'}</p><button type="button" class="ghost" onclick="switchTab('calendar')">Otwórz kalendarz →</button>`:''}${isT?trainingEditForm():''}`)}${card(`<div class="sectionHeading"><h2>${isT?'Zapisane treningi':'Treningi w tym tygodniu'}</h2><span class="statusPill">${ordered.length}</span></div>${ordered.map(storedPlanCard).join('')||'<div class="emptyState">Brak zapisanych planów w tym widoku.</div>'}${!isT&&pending.length?`<h3 style="margin-top:18px">Zaplanowane terminy bez planu</h3>${pending.filter(b=>{const [a,z]=currentWeekRange();const d=new Date(b.starts_at);return d>=a&&d<z}).map(b=>`<div class="flatRow"><b>${esc(bookingLabel(b))}</b><span class="statusPill">Trening — oczekuje na plan</span></div>`).join('')}`:''}`)}${legacy.length?card(`<h2>Wcześniejsze plany (bez powiązania z kalendarzem)</h2><p class="hint">Zachowaliśmy poprzednie dane. Te plany nie są automatycznie przypisane do rezerwacji.</p>${legacy.map(storedPlanCard).join('')}`):''}`}
async function saveTrainingDraft(){if(!trainer()||!trainingDraft)return;captureTrainingDraft();const d=trainingDraft;if(!d.booking_id) return message('Wybierz termin z kalendarza.',true);if(d.name.trim().length<2)return message('Podaj nazwę treningu (minimum 2 znaki).',true);if(!d.items.length)return message('Dodaj przynajmniej jedno ćwiczenie.',true);const good=d.items.every(x=>exercises.some(e=>e.id===x.exercise_id)&&Number.isInteger(Number(x.sets_target))&&Number(x.sets_target)>=1&&Number(x.sets_target)<=30&&x.reps_target.trim()&&x.weight_target_kg!==''&&Number.isFinite(Number(x.weight_target_kg))&&Number(x.weight_target_kg)>=0);if(!good)return message('Uzupełnij poprawnie ćwiczenia: serię, powtórzenia i ciężar (0 kg dozwolone).',true);
const button=$('saveTrainingButton');if(button)button.disabled=true;
try{check(await sb.rpc('forma_save_training_plan',{p_booking_id:d.booking_id,p_name:d.name.trim(),p_notes:d.notes,p_exercises:d.items.map(x=>({exercise_id:x.exercise_id,sets_target:Number(x.sets_target),reps_target:x.reps_target.trim(),weight_target_kg:Number(x.weight_target_kg),notes:x.notes||''}))}));trainingDraft=null;await loadBookings();await loadClient();render();message('Trening zapisany. Znajdziesz go poniżej na liście i możesz go później edytować.')}catch(e){message('Nie udało się zapisać treningu: '+e.message,true)}finally{if(button)button.disabled=false}}
/* Minimalna obsługa zatwierdzonych terminów do testowania planów; pełny kalendarz później. */
let calendarFormOpen=false;
function calendarPage(){const t=trainer();const list=bookings.filter(b=>b.status==='approved'&&(t||b.client_id===me.id));return `${card(`<div class="trainingToolbar"><div><h2>Kalendarz treningów</h2><p class="hint">${t?'Dodaj zatwierdzony termin, a następnie przypisz do niego plan treningowy.':'Twoje zatwierdzone terminy.'}</p></div>${t?`<button type="button" class="primary" onclick="calendarFormOpen=!calendarFormOpen;render()">＋ Dodaj termin</button>`:''}</div>${!bookingsReady?`<div class="calendarSetup">Kalendarz wymaga wykonania skryptu SQL dołączonego do aktualizacji.</div>`:''}${t&&calendarFormOpen&&bookingsReady?`<form onsubmit="saveCalendarBooking(event)" class="trainingForm"><h3 style="margin-top:0">Nowy zatwierdzony trening</h3><div class="formgrid"><div><label for="calendarClient">Podopieczna</label><select id="calendarClient" required>${clients.map(c=>`<option value="${esc(c.id)}" ${c.id===selected?'selected':''}>${esc(c.full_name)}</option>`).join('')}</select></div>${input('Data i godzina rozpoczęcia','calendarStart','datetime-local',localDateTime(new Date(Date.now()+86400000)))}<div><label for="calendarDuration">Czas trwania</label><select id="calendarDuration"><option value="60">60 minut</option><option value="75">75 minut</option><option value="90">90 minut</option></select></div></div><div class="trainingActions"><button class="ghost" type="button" onclick="calendarFormOpen=false;render()">Anuluj</button><button class="primary" type="submit">Zatwierdź termin</button></div></form>`:''}<div class="flatList">${list.length?list.map(b=>{const c=clients.find(c=>c.id===b.client_id),p=plans.find(p=>p.booking_id===b.id);return `<div class="calendarEntry"><div><strong>${esc(bookingLabel(b))}</strong><div class="hint">${t?esc(c?.full_name||'Podopieczna')+' · ':''}${p?esc(p.name):'Trening — bez planu'}</div></div>${t?`<button type="button" class="ghost" onclick="selected='${esc(b.client_id)}';loadClient().then(()=>{tab='plan';const saved=plans.find(x=>x.booking_id==='${esc(b.id)}');if(saved)editTraining(saved.id);else startTrainingForBooking('${esc(b.id)}')}).catch(e=>message(e.message,true))">${p?'Edytuj plan':'Ułóż plan'}</button>`:''}</div>`}).join(''):'<div class="emptyState">Brak zatwierdzonych terminów treningów.</div>'}</div><p class="hint" style="margin-top:14px">To podstawowa lista terminów do testowania planów. Pełny kalendarz tygodniowy/miesięczny, prośby klientek i przesuwanie treningów wdrożymy osobno.</p>`)}`}
function localDateTime(date){const d=new Date(date.getTime()-date.getTimezoneOffset()*60000);return d.toISOString().slice(0,16)}
async function saveCalendarBooking(e){e.preventDefault();if(!trainer())return;const start=new Date(v('calendarStart')),duration=Number(v('calendarDuration'));if(isNaN(start)||!clientId()||!v('calendarClient'))return message('Wybierz podopieczną i poprawną datę.',true);if(start<=new Date())return message('Nowy termin musi być w przyszłości.',true);try{check(await sb.from('forma_bookings').insert({client_id:v('calendarClient'),starts_at:start.toISOString(),ends_at:new Date(start.getTime()+duration*60000).toISOString(),status:'approved'}));calendarFormOpen=false;await loadBookings();render();message('Termin zatwierdzony. Teraz możesz utworzyć dla niego plan treningowy.')}catch(err){message(err.code==='23P01'?'Na ten termin przypada już inny zatwierdzony trening.':err.message,true)}}
function startTrainingForBooking(id){const b=bookings.find(x=>x.id===id);if(!b||b.client_id!==clientId())return message('Nie znaleziono terminu.',true);trainingDraft={mode:'new',booking_id:id,name:'',notes:'',items:[]};render()}
function openSet(exid,planid){if(!exid)return;const e=exercises.find(x=>x.id===exid);$('flash').innerHTML=card(`<h3>Zapisz serię — ${esc(e?.name)}</h3><div class="formgrid">${input('Ciężar (kg)','skg','number')}${input('Powtórzenia','sreps','number')}</div><div style="margin-top:12px">${btn('Zapisz serię',`saveSet('${exid}','${planid}')`)}</div>`);window.scrollTo({top:0,behavior:'smooth'})}async function saveSet(exid,planid){try{if(v('skg')===''||number('skg')<0||number('sreps')<1)throw Error('Podaj ciężar i powtórzenia');let session=sessions.find(x=>x.plan_id===planid&&!x.finished_at&&x.started_at.slice(0,10)===today());if(!session){session=check(await sb.from('workout_sessions').insert({client_id:me.id,plan_id:planid}).select().single())}const n=sets.filter(x=>x.session_id===session.id&&x.exercise_id===exid).length+1;check(await sb.from('workout_sets').insert({session_id:session.id,exercise_id:exid,set_number:n,weight_kg:number('skg'),reps:number('sreps'),completed:true}));await loadClient();render();message('Seria zapisana')}catch(e){message(e.message,true)}}
function chart(rows,key,date='measured_on'){let d=rows.filter(x=>x[key]!=null).slice(-8),max=Math.max(1,...d.map(x=>Number(x[key])));return d.length?`<div class="chart">${d.map(x=>`<div class="bar" style="height:${Math.max(8,Number(x[key])/max*110)}px"><span>${esc(x[key])}</span><em>${esc((x[date]||'').slice(5,10))}</em></div>`).join('')}</div>`:'<p class="muted">Brak danych do wykresu.</p>'}function progress(){const strength=sets.map(s=>({...s,date:sessions.find(x=>x.id===s.session_id)?.started_at?.slice(0,10)||''}));const unique=[...new Set(strength.map(s=>s.exercise_id))];return `${card(`<h2>Progres masy ciała</h2>${chart(measurements,'weight_kg')}<div class="formgrid">${input('Data','wdate','date',today())}${input('Waga (kg)','wvalue','number')}</div><div style="margin-top:12px">${btn('Dodaj pomiar','saveWeight()')}</div>`)}${card(`<h2>Progres siłowy</h2><label>Ćwiczenie</label><select id="strengthEx" onchange="strengthChart()">${unique.map(id=>`<option value="${id}">${esc(exercises.find(e=>e.id===id)?.name||'Ćwiczenie')}</option>`).join('')}</select><div id="strengthGraph">${chart(strength.filter(s=>s.exercise_id===unique[0]),'weight_kg','date')}</div>`)}${card(`<h2>Pomiary obwodów (cm)</h2>${measurements.slice(-5).reverse().map(m=>`<div class="row"><span>${esc(m.measured_on)}</span><span class="small">Talia ${m.waist_cm??'—'} · Biodra ${m.hips_cm??'—'} · Ramię ${m.arm_cm??'—'} · Udo ${m.thigh_cm??'—'}</span></div>`).join('')}<div class="formgrid">${input('Data','mdate','date',today())}${input('Talia (cm)','mwaist','number')}${input('Biodra (cm)','mhips','number')}${input('Ramię (cm)','marm','number')}${input('Udo (cm)','mthigh','number')}</div><div style="margin-top:12px">${btn('Zapisz pomiary','saveMeasurements()')}</div>`)}${card(`<h2>Zdjęcia sylwetki</h2><p class="muted">Metadane w bazie: ${photos.length} zdjęć. Przesyłanie zdjęć uruchomimy dopiero po skonfigurowaniu prywatnego Storage i polityk dostępu.</p>`)}`}
function strengthChart(){const id=v('strengthEx'),rows=sets.map(s=>({...s,date:sessions.find(x=>x.id===s.session_id)?.started_at?.slice(0,10)||''}));$('strengthGraph').innerHTML=chart(rows.filter(s=>s.exercise_id===id),'weight_kg','date')}async function saveWeight(){try{if(number('wvalue')<=0)throw Error('Podaj prawidłową wagę');check(await sb.from('body_measurements').insert({client_id:clientId(),measured_on:v('wdate')||today(),weight_kg:number('wvalue')}));await loadClient();render();message('Waga zapisana')}catch(e){message(e.message,true)}}async function saveMeasurements(){try{const fields={waist_cm:v('mwaist'),hips_cm:v('mhips'),arm_cm:v('marm'),thigh_cm:v('mthigh')};if(Object.values(fields).every(x=>!x))throw Error('Wpisz przynajmniej jeden pomiar');const record={client_id:clientId(),measured_on:v('mdate')||today()};for(const [k,x] of Object.entries(fields)){if(x){if(Number(x)<=0)throw Error('Pomiary muszą być dodatnie');record[k]=Number(x)}}check(await sb.from('body_measurements').insert(record));await loadClient();render();message('Pomiary zapisane')}catch(e){message(e.message,true)}}
function recipesPage(){return `<div class="two">${recipes.map(r=>card(`<div class="recipe"><span class="tag">${esc(r.description||'Przepis')}</span><h2 style="margin:12px 0 6px">${esc(r.title)}</h2><b>${r.calories??'—'} kcal · ${r.protein_g??'—'} g białka</b></div><h3 style="margin-top:18px">Składniki</h3><p style="white-space:pre-line">${esc(Array.isArray(r.ingredients)?r.ingredients.map(i=>typeof i==='string'?i:JSON.stringify(i)).join('\n'):JSON.stringify(r.ingredients||''))}</p><h3>Przygotowanie</h3><p style="white-space:pre-line">${esc(r.instructions)}</p>`)).join('')}</div>${trainer()?card(`<h2>Dodaj przepis</h2><div class="formgrid">${input('Nazwa','rtitle')}${input('Kategoria','rtype')}${input('Kalorie na porcję','rkcal','number')}${input('Białko (g)','rprotein','number')}</div><label>Składniki (jeden w wierszu)</label><textarea id="ringredients"></textarea><label>Przygotowanie</label><textarea id="rsteps"></textarea><div style="margin-top:12px">${btn('Zapisz przepis','addRecipe()')}</div>`):''}`}async function addRecipe(){try{if(!v('rtitle')||!v('ringredients')||!v('rsteps'))throw Error('Wypełnij nazwę, składniki i przygotowanie');check(await sb.from('recipes').insert({title:v('rtitle'),description:v('rtype'),calories:number('rkcal')||null,protein_g:number('rprotein')||null,ingredients:v('ringredients').split('\n').map(x=>x.trim()).filter(Boolean),instructions:v('rsteps'),portions:1}));await load();message('Przepis zapisany')}catch(e){message(e.message,true)}}async function addExercise(){try{if(!v('ename'))throw Error('Podaj nazwę ćwiczenia');check(await sb.from('exercises').insert({name:v('ename'),muscle_group:v('egroup')}));await load();message('Ćwiczenie dodane')}catch(e){message(e.message,true)}}
(async()=>{try{if(!window.supabase)throw Error('Nie udało się załadować biblioteki Supabase');const r=await fetch('/api/config',{cache:'no-store'});if(!r.ok)throw Error('Brak konfiguracji Supabase. Sprawdź zmienne Vercel i ponowne wdrożenie.');const {url,key}=await r.json();sb=window.supabase.createClient(url,key);let recovering=false;sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recovering=true;setTimeout(showNewPassword,0)}});const hash=new URLSearchParams(window.location.hash.slice(1));const query=new URLSearchParams(window.location.search);if(hash.get('type')==='recovery'||query.get('type')==='recovery'){recovering=true;showNewPassword()}else{await initSession();if(recovering)showNewPassword()}}catch(e){$('title').textContent='Konfiguracja';$('app').innerHTML=card(`<h2>Nie udało się uruchomić FORMA</h2><p class="error">${esc(e.message)}</p><p>Sprawdź wdrożenie pliku <code>api/config.js</code> na Vercel.</p>`)}})();
</script><script>if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('/sw.js').catch(()=>{});</script></body></html>
