<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMA — by Zuzia Fiks</title><style>
:root{--bg:#f7f7f4;--ink:#242723;--muted:#747a72;--line:#e6e8e1;--accent:#657b65;--pale:#e8eee6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}header{background:white;border-bottom:1px solid var(--line);padding:16px max(20px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:25px;font-weight:800;letter-spacing:.13em}.sub{font-size:11px;letter-spacing:.04em;color:var(--muted)}.shell{max-width:1120px;margin:auto;padding:30px 20px 90px}.top{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}h1{font-size:32px;letter-spacing:-.04em;margin:0}h2{font-size:21px;letter-spacing:-.03em;margin:0 0 14px}h3{font-size:16px;margin:0 0 8px}p{margin:6px 0 14px}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.tabs button,.ghost{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 15px;border-radius:12px}.tabs button.active{background:var(--ink);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 6px 20px #25342506}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.stat{font-size:29px;font-weight:750;letter-spacing:-.05em}.tag{display:inline-block;padding:5px 10px;border-radius:99px;background:var(--pale);color:#49614a;font-size:12px}.primary{border:0;border-radius:12px;background:var(--accent);color:white;padding:11px 17px;font-weight:650}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}label{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid #dce0d8;border-radius:11px;padding:11px;background:#fff;color:var(--ink)}textarea{min-height:80px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice button{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:white;font-size:12px}.choice button.on{background:var(--pale);border-color:var(--accent);color:#3d5b3d}.exercise{border-top:1px solid var(--line);padding:12px 0}.small{font-size:12px}.chart{display:flex;align-items:end;gap:9px;height:155px;padding:12px 0 0;border-bottom:1px solid var(--line)}.bar{flex:1;background:#a9bba4;border-radius:7px 7px 0 0;min-height:6px;position:relative}.bar span{position:absolute;bottom:100%;left:0;font-size:11px;white-space:nowrap}.bar em{position:absolute;top:100%;left:0;font-style:normal;font-size:10px;color:var(--muted)}.recipe{background:#f2f4ee;border-radius:14px;padding:20px}.notice{background:#fff7e7;border:1px solid #f0dfbd;padding:12px 16px;border-radius:12px;font-size:13px;margin:15px 0}.error{color:#a34242}.hidden{display:none!important}footer{color:var(--muted);font-size:12px;margin-top:30px}@media(max-width:720px){.grid,.two,.formgrid{grid-template-columns:1fr}.shell{padding:20px 14px 90px}.card{padding:17px}h1{font-size:27px}.tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:5px}.tabs button{white-space:nowrap}header{padding:12px 16px}}
</style></head><body><header><div><div class="logo">FORMA<span style="color:#809581">.</span></div><div class="sub">by Zuzia Fiks</div></div><div id="identity" class="small muted">Łączenie…</div></header><main class="shell"><div class="top"><div><div class="muted small">TWÓJ TRENING. TWOJE TEMPO.</div><h1 id="title">FORMA</h1></div><span class="tag">● Online</span></div><div id="flash"></div><nav class="tabs" id="tabs"></nav><div id="app">Ładowanie…</div><footer>FORMA • Prywatne konto i dane zapisane w Supabase.</footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toLocaleDateString('en-CA'),card=x=>`<section class="card">${x}</section>`,btn=(text,fn)=>`<button class="primary" onclick="${fn}">${text}</button>`,input=(label,id,type='text',value='')=>`<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${type==='number'?'step="any"':''}></div>`,v=id=>$(id)?.value?.trim()||'',number=id=>Number(v(id)),groups={'Pośladki':['Hip thrust','Glute bridge','Kickback na wyciągu','Odwodzenie na maszynie','Bułgarskie przysiady'],'Nogi':['Suwnica','Przysiady','Wykroki','Prostowanie nóg','Uginanie nóg'],'Plecy':['Ściąganie drążka','Wiosłowanie siedząc','Podciąganie'],'Klatka piersiowa':['Wyciskanie hantli','Wyciskanie na maszynie','Rozpiętki'],'Barki':['Wyciskanie nad głowę','Unoszenie bokiem'],'Ramiona':['Uginanie z hantlami','Prostowanie na wyciągu'],'Brzuch':['Plank','Dead bug','Spięcia brzucha']};
let sb,user,me,tab='start',clients=[],selected='',measurements=[],plans=[],planExercises=[],exercises=[],sets=[],sessions=[],recipes=[],questionnaires=[],preferences=[],photos=[];const trainer=()=>me?.role==='trainer',clientId=()=>trainer()?selected:me?.id;
function message(t,error=false){$('flash').innerHTML=`<div class="notice ${error?'error':''}">${esc(t)}</div>`;window.scrollTo({top:0,behavior:'smooth'})}function check(result){if(result.error)throw result.error;return result.data}async function load(){if(!me)return;const base=[sb.from('recipes').select('*').order('created_at',{ascending:false}),sb.from('exercises').select('*').order('name')];if(trainer())base.push(sb.from('profiles').select('*').eq('role','client').order('full_name'),sb.from('questionnaires').select('*').order('created_at',{ascending:false}));const all=await Promise.all(base);recipes=check(all[0]);exercises=check(all[1]);if(trainer()){clients=check(all[2]);questionnaires=check(all[3]);if(!clients.some(c=>c.id===selected))selected=clients[0]?.id||''}else{clients=[me];selected=me.id}await loadClient();render()}
async function loadClient(){measurements=[];plans=[];planExercises=[];sets=[];sessions=[];preferences=[];photos=[];if(!clientId())return;const id=clientId();const res=await Promise.all([sb.from('body_measurements').select('*').eq('client_id',id).order('measured_on'),sb.from('training_plans').select('*').eq('client_id',id).order('created_at',{ascending:false}),sb.from('workout_sessions').select('*').eq('client_id',id).order('started_at',{ascending:false}),sb.from('exercise_preferences').select('*').eq('client_id',id),sb.from('progress_photos').select('*').eq('client_id',id).order('taken_on',{ascending:false})]);[measurements,plans,sessions,preferences,photos]=res.map(check);if(plans.length){planExercises=check(await sb.from('plan_exercises').select('*').in('plan_id',plans.map(x=>x.id)).order('sort_order'))}if(sessions.length){sets=check(await sb.from('workout_sets').select('*').in('session_id',sessions.map(x=>x.id)))} }
function showLogin(){me=null;$('title').textContent='Logowanie';$('identity').textContent='';$('tabs').innerHTML='';$('app').innerHTML=card(`<h2>Witaj w FORMA</h2><p class="muted">Zaloguj się na konto utworzone przez trenerkę.</p><form onsubmit="login(event)">${input('E-mail','email','email')}${input('Hasło','password','password')}<div style="margin-top:16px"><button class="primary" type="submit">Zaloguj się</button></div></form><p class="small muted"><button class="ghost" type="button" onclick="showRecoveryRequest()">Nie pamiętasz hasła? Ustaw nowe</button></p>`)}
function showRecoveryRequest(){$('title').textContent='Odzyskiwanie hasła';$('identity').textContent='';$('tabs').innerHTML='';$('app').innerHTML=card(`<h2>Ustaw nowe hasło</h2><p class="muted">Wyślemy link na adres e-mail przypisany do konta.</p><form onsubmit="sendRecovery(event)">${input('E-mail','recoveryEmail','email')}<div style="margin-top:16px"><button class="primary" type="submit">Wyślij link</button> <button class="ghost" type="button" onclick="showLogin()">Wróć do logowania</button></div></form>`)}
async function sendRecovery(e){e.preventDefault();try{const email=v('recoveryEmail');if(!email)throw Error('Podaj adres e-mail');check(await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname}));message('Jeśli konto istnieje, wiadomość z linkiem została wysłana. Sprawdź także folder spam.')}catch(e){message(e.message,true)}}
function showNewPassword(){$('title').textContent='Nowe hasło';$('identity').textContent='';$('tabs').innerHTML='';$('app').innerHTML=card(`<h2>Ustaw nowe hasło</h2><form onsubmit="saveNewPassword(event)">${input('Nowe hasło (minimum 8 znaków)','newPassword','password')}${input('Powtórz hasło','confirmPassword','password')}<div style="margin-top:16px"><button class="primary" type="submit">Zapisz hasło</button></div></form>`)}
async function saveNewPassword(e){e.preventDefault();try{const password=v('newPassword');if(password.length<8)throw Error('Hasło musi mieć minimum 8 znaków');if(password!==v('confirmPassword'))throw Error('Hasła muszą być identyczne');check(await sb.auth.updateUser({password}));await sb.auth.signOut();user=null;showLogin();message('Hasło zapisane. Zaloguj się nowym hasłem.')}catch(e){message(e.message,true)}}
async function login(e){e.preventDefault();try{const r=await sb.auth.signInWithPassword({email:v('email'),password:v('password')});check(r);await initSession()}catch(e){message(e.message,true)}}async function logout(){await sb.auth.signOut();user=null;showLogin()}async function initSession(){const {data:{user:u}}=await sb.auth.getUser();user=u;if(!u){showLogin();return}try{me=check(await sb.from('profiles').select('*').eq('id',u.id).single());await load()}catch(e){$('title').textContent='Brak dostępu';$('tabs').innerHTML='';$('app').innerHTML=card(`<p>Nie znaleziono profilu lub brak uprawnień.</p><p class="error">${esc(e.message)}</p>${btn('Wyloguj się','logout()')}`)}}
function render(){if(!me)return;const isT=trainer(),tabs=isT?[['start','Pulpit'],['clients','Podopieczne'],['addclient','Dodaj podopieczną'],['survey','Ankiety'],['plan','Plany treningowe'],['progress','Progres'],['recipes','Przepisy']]:[['start','Pulpit'],['plan','Mój trening'],['progress','Mój progres'],['recipes','Przepisy'],['survey','Preferencje']];if(!tabs.some(x=>x[0]===tab))tab='start';$('title').textContent=isT?'Panel trenerki':'Panel podopiecznej';$('identity').innerHTML=`${esc(me.full_name)} · <button class="ghost" onclick="logout()">Wyloguj</button>`;$('tabs').innerHTML=tabs.map(([id,t])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';render()">${t}</button>`).join('');$('app').innerHTML=(isT&&['plan','progress'].includes(tab)?picker():'')+({start:()=>start(),clients:()=>clientsPage(),addclient:()=>addclient(),survey:()=>survey(),plan:()=>plan(),progress:()=>progress(),recipes:()=>recipesPage()})[tab]();}
function picker(){return card(`<label>Wybrana podopieczna</label><select onchange="chooseClient(this.value)">${clients.map(c=>`<option value="${esc(c.id)}" ${c.id===selected?'selected':''}>${esc(c.full_name)} — ${esc(c.goal)}</option>`).join('')}</select>`)}async function chooseClient(id){selected=id;try{await loadClient();render()}catch(e){message(e.message,true)}}function go(t){tab=t;render()}
function start(){const c=trainer()?clients.find(x=>x.id===selected):me;return `<div class="grid">${card(`<div class="muted">${trainer()?'Podopieczne':'Moje plany'}</div><div class="stat">${trainer()?clients.length:plans.length}</div>`)}${card(`<div class="muted">${trainer()?'Nowe ankiety':'Zapisane treningi'}</div><div class="stat">${trainer()?questionnaires.filter(x=>x.status==='new').length:sessions.length}</div>`)}${card(`<div class="muted">Ćwiczenia w planach</div><div class="stat">${planExercises.length}</div>`)}</div>${card(`<h2>${trainer()?'Dzień dobry, Zuzia 👋':`Cześć, ${esc(me.full_name?.split(' ')[0])} 👋`}</h2><p class="muted">${trainer()?'Zarządzaj podopiecznymi, planami i postępami w jednym miejscu.':'Sprawdź plan, zapisz trening i obserwuj swoje postępy.'}</p>${btn('Otwórz trening',"go('plan')")}`)}${card(`<h2>Ostatnie pomiary ${c?'— '+esc(c.full_name):''}</h2>${measurements.slice(-3).reverse().map(x=>`<div class="row"><span>${esc(x.measured_on)}</span><b>${x.weight_kg??'—'} kg</b></div>`).join('')||'<p class="muted">Brak pomiarów.</p>'}`)}`}
function clientsPage(){return card(`<h2>Podopieczne</h2><div style="margin:14px 0">${btn('＋ Dodaj podopieczną',"go('addclient')")}</div>${clients.map(c=>`<div class="row"><div><b>${esc(c.full_name)}</b><div class="small muted">${esc(c.goal)} · ${esc(c.email)}</div></div><button class="ghost" onclick="selected='${c.id}';chooseAndGo('progress')">Zobacz profil →</button></div>`).join('')||'<p class="muted">Brak podopiecznych.</p>'}<h3 style="margin-top:24px">Ankiety oczekujące (${questionnaires.filter(x=>x.status==='new').length})</h3>${questionnaires.filter(x=>x.status==='new').map(q=>`<div class="row"><div><b>${esc(q.contact_name)}</b><div class="small muted">${esc(q.contact_email)}</div></div><button class="ghost" onclick="go('survey')">Otwórz</button></div>`).join('')||'<p class="muted">Brak nowych ankiet.</p>'}`)}async function chooseAndGo(t){await loadClient();tab=t;render()}
function addclient(){return card(`<h2>Nowa podopieczna</h2><p class="muted">Utwórz konto w Supabase Authentication → Users → Add user, a następnie profil tutaj, używając UUID utworzonego konta. Nie wpisuj hasła klientki w tym formularzu.</p><div class="formgrid">${input('UUID użytkowniczki z Authentication *','cid')}${input('Imię i nazwisko *','cname')}${input('E-mail *','cemail','email')}${input('Telefon','cphone')}<div><label>Cel treningowy</label><select id="cgoal"><option>Redukcja tkanki tłuszczowej</option><option>Budowa masy mięśniowej</option><option>Zwiększenie siły</option><option>Sprawność i zdrowie</option></select></div><div><label>Treningi tygodniowo</label><select id="cfreq"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></div>${input('Data rozpoczęcia','cstart','date',today())}</div><label>Prywatne notatki trenerki</label><textarea id="cnotes"></textarea><div style="margin-top:14px">${btn('Zapisz profil','createClient()')}</div>`)}async function createClient(){try{if(!/^[0-9a-f-]{36}$/i.test(v('cid'))||!v('cname')||!v('cemail').includes('@'))throw Error('Uzupełnij UUID, imię i poprawny e-mail.');check(await sb.from('profiles').insert({id:v('cid'),full_name:v('cname'),email:v('cemail'),phone:v('cphone')||null,role:'client',goal:v('cgoal'),weekly_sessions:number('cfreq'),start_date:v('cstart')||null,trainer_notes:v('cnotes')||null}));await load();tab='clients';render();message('Profil podopiecznej został zapisany.')}catch(e){message(e.message,true)}}
function survey(){if(trainer())return card(`<h2>Ankiety zgłoszeniowe</h2><p class="muted">Ankiety zebrane w bazie danych. Formularz publiczny przed założeniem konta wymaga osobnego, zabezpieczonego punktu API — nie otwieramy anonimowego zapisu do tabeli.</p>${questionnaires.map(q=>`<div class="row"><div><b>${esc(q.contact_name)}</b><div class="small muted">${esc(q.contact_email)} · ${esc(q.status)}</div><details><summary>Zobacz odpowiedzi</summary><pre style="white-space:pre-wrap;max-width:450px">${esc(JSON.stringify(q.answers,null,2))}</pre></details></div>`).join('')||'<p class="muted">Brak ankiet.</p>'}`);return card(`<h2>Preferencje ćwiczeń</h2><p class="muted">Zaznacz, które ćwiczenia lubisz. Odpowiedzi są zapisywane na Twoim koncie.</p>${Object.entries(groups).map(([group,names])=>`<h3 style="margin-top:20px">${group}</h3>${names.map(name=>{const ex=exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!ex)return `<div class="row"><span>${esc(name)}</span><span class="small muted">Jeszcze nie dodano do biblioteki</span></div>`;const cur=preferences.find(p=>p.exercise_id===ex.id)?.preference;return `<div class="exercise"><b>${esc(name)}</b><div class="choice">${['Lubię','Neutralne','Nie lubię','Nie znam'].map(p=>`<button class="${cur===p?'on':''}" onclick="setPref('${ex.id}','${p}')">${p}</button>`).join('')}</div></div>`}).join('')}`).join('')}`)}async function setPref(id,p){try{check(await sb.from('exercise_preferences').upsert({client_id:me.id,exercise_id:id,preference:p},{onConflict:'client_id,exercise_id'}));await loadClient();render()}catch(e){message(e.message,true)}}
function plan(){return `${card(`<h2>${trainer()?'Plany treningowe — edycja':'Mój plan treningowy'}</h2>${plans.map(p=>`<div class="exercise"><h3>${esc(p.name)} ${p.active?'●':''}</h3><p class="muted small">${esc(p.description)}</p>${planExercises.filter(x=>x.plan_id===p.id).map(x=>{const ex=exercises.find(e=>e.id===x.exercise_id);return `<div class="row"><div><b>${esc(ex?.name||'Ćwiczenie')}</b><div class="small muted">${esc(x.day_label||'Trening')} · ${x.sets_target} serie × ${esc(x.reps_target)} · przerwa ${x.rest_seconds??'—'} s</div></div>${!trainer()?`<button class="ghost" onclick="openSet('${ex?.id||''}','${p.id}')">Zapisz serię</button>`:''}</div>`}).join('')}${trainer()?`<div class="formgrid"><div><label>Ćwiczenie</label><select id="ex-${p.id}">${exercises.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div>${input('Dzień (np. A)','day-'+p.id,'text','A')}${input('Serie','sets-'+p.id,'number','3')}${input('Powtórzenia','reps-'+p.id,'text','8–12')}</div>${btn('Dodaj ćwiczenie',`addPlanExercise('${p.id}')`)}`:''}</div>`).join('')||'<p class="muted">Brak planów.</p>'}${trainer()&&clientId()?`<h3>Nowy plan</h3>${input('Nazwa planu','pname')}${input('Opis','pdesc')}<div style="margin-top:12px">${btn('Utwórz plan','createPlan()')}</div>`:''}`)}${card(`<h2>Historia zapisanych serii</h2>${sets.slice(-15).reverse().map(s=>`<div class="row"><span>${esc(exercises.find(e=>e.id===s.exercise_id)?.name||'Ćwiczenie')}</span><b>${s.weight_kg} kg × ${s.reps}</b></div>`).join('')||'<p class="muted">Brak zapisanych serii.</p>'}`)}`}
async function createPlan(){try{if(!v('pname'))throw Error('Podaj nazwę planu');check(await sb.from('training_plans').insert({client_id:clientId(),name:v('pname'),description:v('pdesc'),active:true}));await loadClient();render();message('Plan zapisany')}catch(e){message(e.message,true)}}async function addPlanExercise(id){try{if(!v('ex-'+id))throw Error('Najpierw dodaj ćwiczenia do biblioteki');check(await sb.from('plan_exercises').insert({plan_id:id,exercise_id:v('ex-'+id),day_label:v('day-'+id),sets_target:number('sets-'+id),reps_target:v('reps-'+id),sort_order:planExercises.filter(x=>x.plan_id===id).length+1}));await loadClient();render()}catch(e){message(e.message,true)}}function openSet(exid,planid){if(!exid)return;const e=exercises.find(x=>x.id===exid);$('flash').innerHTML=card(`<h3>Zapisz serię — ${esc(e?.name)}</h3><div class="formgrid">${input('Ciężar (kg)','skg','number')}${input('Powtórzenia','sreps','number')}</div><div style="margin-top:12px">${btn('Zapisz serię',`saveSet('${exid}','${planid}')`)}</div>`);window.scrollTo({top:0,behavior:'smooth'})}async function saveSet(exid,planid){try{if(v('skg')===''||number('skg')<0||number('sreps')<1)throw Error('Podaj ciężar i powtórzenia');let session=sessions.find(x=>x.plan_id===planid&&!x.finished_at&&x.started_at.slice(0,10)===today());if(!session){session=check(await sb.from('workout_sessions').insert({client_id:me.id,plan_id:planid}).select().single())}const n=sets.filter(x=>x.session_id===session.id&&x.exercise_id===exid).length+1;check(await sb.from('workout_sets').insert({session_id:session.id,exercise_id:exid,set_number:n,weight_kg:number('skg'),reps:number('sreps'),completed:true}));await loadClient();render();message('Seria zapisana')}catch(e){message(e.message,true)}}
function chart(rows,key,date='measured_on'){let d=rows.filter(x=>x[key]!=null).slice(-8),max=Math.max(1,...d.map(x=>Number(x[key])));return d.length?`<div class="chart">${d.map(x=>`<div class="bar" style="height:${Math.max(8,Number(x[key])/max*110)}px"><span>${esc(x[key])}</span><em>${esc((x[date]||'').slice(5,10))}</em></div>`).join('')}</div>`:'<p class="muted">Brak danych do wykresu.</p>'}function progress(){const strength=sets.map(s=>({...s,date:sessions.find(x=>x.id===s.session_id)?.started_at?.slice(0,10)||''}));const unique=[...new Set(strength.map(s=>s.exercise_id))];return `${card(`<h2>Progres masy ciała</h2>${chart(measurements,'weight_kg')}<div class="formgrid">${input('Data','wdate','date',today())}${input('Waga (kg)','wvalue','number')}</div><div style="margin-top:12px">${btn('Dodaj pomiar','saveWeight()')}</div>`)}${card(`<h2>Progres siłowy</h2><label>Ćwiczenie</label><select id="strengthEx" onchange="strengthChart()">${unique.map(id=>`<option value="${id}">${esc(exercises.find(e=>e.id===id)?.name||'Ćwiczenie')}</option>`).join('')}</select><div id="strengthGraph">${chart(strength.filter(s=>s.exercise_id===unique[0]),'weight_kg','date')}</div>`)}${card(`<h2>Pomiary obwodów (cm)</h2>${measurements.slice(-5).reverse().map(m=>`<div class="row"><span>${esc(m.measured_on)}</span><span class="small">Talia ${m.waist_cm??'—'} · Biodra ${m.hips_cm??'—'} · Ramię ${m.arm_cm??'—'} · Udo ${m.thigh_cm??'—'}</span></div>`).join('')}<div class="formgrid">${input('Data','mdate','date',today())}${input('Talia (cm)','mwaist','number')}${input('Biodra (cm)','mhips','number')}${input('Ramię (cm)','marm','number')}${input('Udo (cm)','mthigh','number')}</div><div style="margin-top:12px">${btn('Zapisz pomiary','saveMeasurements()')}</div>`)}${card(`<h2>Zdjęcia sylwetki</h2><p class="muted">Metadane w bazie: ${photos.length} zdjęć. Przesyłanie zdjęć uruchomimy dopiero po skonfigurowaniu prywatnego Storage i polityk dostępu.</p>`)}`}
function strengthChart(){const id=v('strengthEx'),rows=sets.map(s=>({...s,date:sessions.find(x=>x.id===s.session_id)?.started_at?.slice(0,10)||''}));$('strengthGraph').innerHTML=chart(rows.filter(s=>s.exercise_id===id),'weight_kg','date')}async function saveWeight(){try{if(number('wvalue')<=0)throw Error('Podaj prawidłową wagę');check(await sb.from('body_measurements').insert({client_id:clientId(),measured_on:v('wdate')||today(),weight_kg:number('wvalue')}));await loadClient();render();message('Waga zapisana')}catch(e){message(e.message,true)}}async function saveMeasurements(){try{const fields={waist_cm:v('mwaist'),hips_cm:v('mhips'),arm_cm:v('marm'),thigh_cm:v('mthigh')};if(Object.values(fields).every(x=>!x))throw Error('Wpisz przynajmniej jeden pomiar');const record={client_id:clientId(),measured_on:v('mdate')||today()};for(const [k,x] of Object.entries(fields)){if(x){if(Number(x)<=0)throw Error('Pomiary muszą być dodatnie');record[k]=Number(x)}}check(await sb.from('body_measurements').insert(record));await loadClient();render();message('Pomiary zapisane')}catch(e){message(e.message,true)}}
function recipesPage(){return `<div class="two">${recipes.map(r=>card(`<div class="recipe"><span class="tag">${esc(r.description||'Przepis')}</span><h2 style="margin:12px 0 6px">${esc(r.title)}</h2><b>${r.calories??'—'} kcal · ${r.protein_g??'—'} g białka</b></div><h3 style="margin-top:18px">Składniki</h3><p style="white-space:pre-line">${esc(Array.isArray(r.ingredients)?r.ingredients.map(i=>typeof i==='string'?i:JSON.stringify(i)).join('\n'):JSON.stringify(r.ingredients||''))}</p><h3>Przygotowanie</h3><p style="white-space:pre-line">${esc(r.instructions)}</p>`)).join('')}</div>${trainer()?card(`<h2>Dodaj przepis</h2><div class="formgrid">${input('Nazwa','rtitle')}${input('Kategoria','rtype')}${input('Kalorie na porcję','rkcal','number')}${input('Białko (g)','rprotein','number')}</div><label>Składniki (jeden w wierszu)</label><textarea id="ringredients"></textarea><label>Przygotowanie</label><textarea id="rsteps"></textarea><div style="margin-top:12px">${btn('Zapisz przepis','addRecipe()')}</div>`):''}${trainer()?card(`<h2>Biblioteka ćwiczeń</h2><p class="muted">Dodaj ćwiczenia, aby były dostępne w planach i preferencjach.</p><div class="formgrid">${input('Nazwa ćwiczenia','ename')}<div><label>Partia mięśniowa</label><select id="egroup">${Object.keys(groups).map(g=>`<option>${g}</option>`).join('')}</select></div></div>${btn('Dodaj ćwiczenie','addExercise()')}`):''}`}
async function addRecipe(){try{if(!v('rtitle')||!v('ringredients')||!v('rsteps'))throw Error('Wypełnij nazwę, składniki i przygotowanie');check(await sb.from('recipes').insert({title:v('rtitle'),description:v('rtype'),calories:number('rkcal')||null,protein_g:number('rprotein')||null,ingredients:v('ringredients').split('\n').map(x=>x.trim()).filter(Boolean),instructions:v('rsteps'),portions:1}));await load();message('Przepis zapisany')}catch(e){message(e.message,true)}}async function addExercise(){try{if(!v('ename'))throw Error('Podaj nazwę ćwiczenia');check(await sb.from('exercises').insert({name:v('ename'),muscle_group:v('egroup')}));await load();message('Ćwiczenie dodane')}catch(e){message(e.message,true)}}
(async()=>{try{if(!window.supabase)throw Error('Nie udało się załadować biblioteki Supabase');const r=await fetch('/api/config',{cache:'no-store'});if(!r.ok)throw Error('Brak konfiguracji Supabase. Sprawdź zmienne Vercel i ponowne wdrożenie.');const {url,key}=await r.json();sb=window.supabase.createClient(url,key);let recovering=false;sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recovering=true;setTimeout(showNewPassword,0)}});const hash=new URLSearchParams(window.location.hash.slice(1));const query=new URLSearchParams(window.location.search);if(hash.get('type')==='recovery'||query.get('type')==='recovery'){recovering=true;showNewPassword()}else{await initSession();if(recovering)showNewPassword()}}catch(e){$('title').textContent='Konfiguracja';$('app').innerHTML=card(`<h2>Nie udało się uruchomić FORMA</h2><p class="error">${esc(e.message)}</p><p>Sprawdź wdrożenie pliku <code>api/config.js</code> na Vercel.</p>`)}})();
</script></body></html>
