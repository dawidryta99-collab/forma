function bookingDate(b){return new Date(b.starts_at).toLocaleString('pl-PL',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function bookingLabel(b){const d1=new Date(b.starts_at),d2=new Date(b.ends_at);return bookingDate(b)+'–'+d2.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}
function futureBookingsForClient(){return bookings.filter(b=>b.client_id===clientId()&&b.status==='approved')}
function unplannedBookings(){return futureBookingsForClient().filter(b=>!plans.some(p=>p.booking_id===b.id))}

function editTraining(id){if(!trainer())return;const p=plans.find(x=>x.id===id);if(!p||!p.booking_id){message('Ten starszy plan nie jest powiązany z kalendarzem. Można go przeglądać, ale nie edytować w nowym formularzu.',true);return}

function captureTrainingDraft(){if(!trainingDraft)return;trainingDraft.booking_id=v('trainingBooking')||trainingDraft.booking_id;trainingDraft.name=v('trainingName');trainingDraft.notes=v('trainingNotes');trainingDraft.items.forEach((x,i)=>{x.exercise_id=v('trainingExercise-'+i)||x.exercise_id;x.sets_target=v('trainingSets-'+i);x.reps_target=v('trainingReps-'+i);x.weight_target_kg=v('trainingWeight-'+i);x.notes=v('trainingExNotes-'+i)})}
function addTrainingExercise(){captureTrainingDraft();if(!exercises.length){message('Najpierw dodaj ćwiczenie do Biblioteki ćwiczeń.',true);return}trainingDraft.items.push({exercise_id:exercises[0].id,sets_target:3,reps_target:'10',weight_target_kg:0,notes:''});render()}
function removeTrainingExercise(i){captureTrainingDraft();trainingDraft.items.splice(i,1);render()}
function moveTrainingExercise(i,d){captureTrainingDraft();const j=i+d;if(j<0||j>=trainingDraft.items.length)return;[trainingDraft.items[i],trainingDraft.items[j]]=[trainingDraft.items[j],trainingDraft.items[i]];render()}

function trainingEditForm(){if(!trainingDraft)return '';const d=trainingDraft;const available=d.mode==='edit'?futureBookingsForClient().filter(b=>b.id===d.booking_id):unplannedBookings();return `<div class="trainingForm"><div class="trainingHead"><h3 style="margin:0">${d.mode==='edit'?'Edytuj trening':'Nowy trening'}</h3><span class="statusPill">Zapis do Supabase</span></div><p class="hint">Wybierz zatwierdzony termin z kalendarza, uzupełnij plan i zapisz wszystkie ćwiczenia jednym przyciskiem.</p><div class="formgrid"><div><label for="trainingBooking">Wybierz trening z kalendarza *</label><select id="trainingBooking" ${d.mode==='edit'?'disabled':''}>${available.map(b=>`<option value="${esc(b.id)}" ${b.id===d.booking_id?'selected':''}>${esc(bookingLabel(b))}</option>`).join('')}</select></div>${input('Nazwa treningu *','trainingName','text',d.name)}</div><h3>Ćwiczenia</h3>${d.items.length?d.items.map(trainingExerciseFields).join(''):'<div class="emptyState">Nie dodano ćwiczeń. Kliknij „+ Dodaj ćwiczenie”.</div>'}<button type="button" class="ghost" style="margin-top:10px" onclick="addTrainingExercise()">＋ Dodaj ćwiczenie</button><label for="trainingNotes" style="margin-top:18px">Komentarz do treningu (opcjonalnie)</label><textarea id="trainingNotes" placeholder="Opcjonalne uwagi do planu…">${esc(d.notes)}</textarea><div class="trainingActions"><button type="button" class="ghost" onclick="cancelTrainingEdit()">Anuluj</button><button type="button" id="saveTrainingButton" class="primary trainingSave" onclick="saveTrainingDraft()">✓ Zapisz trening</button></div></div>`}

function currentWeekRange(){const start=new Date();start.setHours(0,0,0,0);const day=(start.getDay()+6)%7;start.setDate(start.getDate()-day);const end=new Date(start);end.setDate(end.getDate()+7);return [start,end]}
function plan(){const isT=trainer();if(!clientId())return card('<h2>Plan treningowy</h2><div class="emptyState">Wybierz podopieczną.</div>');const c=clients.find(x=>x.id===clientId()),all=plans.filter(p=>p.booking_id&&bookings.some(b=>b.id===p.booking_id&&b.status==='approved'));const legacy=plans.filter(p=>!p.booking_id);let visible=all;
if(!isT){const [a,b]=currentWeekRange();visible=all.filter(p=>{const d=bookings.find(x=>x.id===p.booking_id);return d&&new Date(d.starts_at)>=a&&new Date(d.starts_at)<b});if(calendarSelectedBookingId){const chosen=all.find(p=>p.booking_id===calendarSelectedBookingId);if(chosen&&!visible.includes(chosen))visible=[chosen]}}

async function saveTrainingDraft(){if(!trainer()||!trainingDraft)return;captureTrainingDraft();const d=trainingDraft;if(!d.booking_id) return message('Wybierz termin z kalendarza.',true);if(d.name.trim().length<2)return message('Podaj nazwę treningu (minimum 2 znaki).',true);if(!d.items.length)return message('Dodaj przynajmniej jedno ćwiczenie.',true);const good=d.items.every(x=>exercises.some(e=>e.id===x.exercise_id)&&Number.isInteger(Number(x.sets_target))&&Number(x.sets_target)>=1&&Number(x.sets_target)<=30&&x.reps_target.trim()&&x.weight_target_kg!==''&&Number.isFinite(Number(x.weight_target_kg))&&Number(x.weight_target_kg)>=0);if(!good)return message('Uzupełnij poprawnie ćwiczenia: serię, powtórzenia i ciężar (0 kg dozwolone).',true);

try{check(await sb.rpc('forma_save_training_plan',{p_booking_id:d.booking_id,p_name:d.name.trim(),p_notes:d.notes,p_exercises:d.items.map(x=>({plan_exercise_id:x.id||null,exercise_id:x.exercise_id,sets_target:Number(x.sets_target),reps_target:x.reps_target.trim(),weight_target_kg:Number(x.weight_target_kg),notes:x.notes||''}))}));trainingDraft=null;await loadBookings();await loadClient();render();message('Trening zapisany. Znajdziesz go poniżej na liście i możesz go później edytować.')}catch(e){message('Nie udało się zapisać treningu: '+e.message,true)}finally{if(button)button.disabled=false}}

on></div></form>`:''}<div class="formaCalendar" id="formaCalendar" aria-label="Interaktywny kalendarz treningów"></div><div class="calendarHelp"><span class="calendarLegend"></span><span>Zatwierdzony trening</span>${t?'<span>· Przeciągnij trening, aby zmienić termin (z potwierdzeniem).</span>':''}</div>`).replace('<section class="card">','<section class="card formaCalendarCard">')}`}
function mountFormaCalendar(){const el=$('formaCalendar');if(!el||!bookingsReady)return;if(!window.FullCalendar?.Calendar){el.innerHTML='<div class="calendarEmpty">Nie udało się załadować widoku kalendarza. Sprawdź połączenie internetowe i odśwież stronę.</div>'+calendarDisplayedBookings().map(b=>`<div class="flatRow"><button class="ghost" type="button" onclick="openCalendarTraining('${esc(b.id)}')">${esc(bookingLabel(b))} · ${esc(b.title||'Trening')} →</button></div>`).join('');return}

async function openCalendarTraining(id){const b=bookings.find(x=>x.id===id&&x.status==='approved');if(!b)return message('Nie znaleziono treningu.',true);calendarSelectedBookingId=id;trainingDraft=null;
 try{if(trainer()&&selected!==b.client_id){selected=b.client_id;await loadClient()}tab='plan';const p=plans.find(x=>x.booking_id===id);if(trainer()&&!p){trainingDraft={mode:'new',booking_id:id,name:'',notes:'',items:[]}}render();const opened=document.querySelector('.trainingSaved[open]');if(opened)opened.scrollIntoView({block:'center',behavior:'smooth'});else window.scrollTo({top:0,behavior:'smooth'})}
 catch(e){message('Nie udało się otworzyć treningu: '+e.message,true)}

function confirmCalendarReschedule(info,heading){if(!trainer()){info.revert();return}const event=info.event;const newStart=event.start,newEnd=event.end;
 if(!newStart||!newEnd||newStart.getTime()>=newEnd.getTime()){info.revert();return}
 const oldStart=info.oldEvent.start,oldEnd=info.oldEvent.end;const format=d=>d.toLocaleString('pl-PL',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
 const backdrop=document.createElement('div');backdrop.className='calModalBackdrop';backdrop.innerHTML=`<div class="calModal" role="dialog" aria-modal="true" aria-labelledby="calendarConfirmHeading"><h3 id="calendarConfirmHeading">${esc(heading)}</h3><p class="muted">${esc(event.title)}</p><div class="flatRow"><div><div class="miniLabel">Dotychczas</div><strong>${esc(format(oldStart))}–${esc(oldEnd.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'}))}</strong></div></div><div class="flatRow"><div><div class="miniLabel">Nowy termin</div><strong>${esc(format(newStart))}–${esc(newEnd.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'}))}</strong></div></div><div class="calModalActions"><button type="button" class="ghost" id="calCancelMove">Anuluj</button><button type="button" class="primary" id="calConfirmMove">Potwierdź</button></div></div>`;
 document.body.appendChild(backdrop);const cancel=backdrop.querySelector('#calCancelMove'),confirm=backdrop.querySelector('#calConfirmMove');let decided=false;
 const keydown=e=>{if(e.key==='Escape'&&!decided){e.preventDefault();cancel.click()}};
 const close=()=>{document.removeEventListener('keydown',keydown);backdrop.remove()};
 document.addEventListener('keydown',keydown);cancel.addEventListener('click',()=>{if(decided)return;decided=true;info.revert();close()});
 confirm.addEventListener('click',async()=>{if(decided)return;decided=true;confirm.disabled=true;cancel.disabled=true;
  try{check(await sb.from('forma_bookings').update({starts_at:newStart.toISOString(),ends_at:newEnd.toISOString()}).eq('id',event.id).eq('status','approved').select('id').single());await loadBookings();close();render();message('Termin treningu został zmieniony i zapisany.')}
  catch(e){info.revert();close();message(e.code==='23P01'?'W wybranym terminie jest już inny zatwierdzony trening.':'Nie udało się zmienić terminu: '+e.message,true)}});
 cancel.focus();
}

async function saveCalendarBooking(e){e.preventDefault();if(!trainer())return;const start=new Date(v('calendarStart')),duration=Number(v('calendarDuration'));if(isNaN(start)||!v('calendarClient'))return message('Wybierz podopieczną i poprawną datę.',true);if(start<=new Date())return message('Nowy termin musi być w przyszłości.',true);try{check(await sb.from('forma_bookings').insert({client_id:v('calendarClient'),starts_at:start.toISOString(),ends_at:new Date(start.getTime()+duration*60000).toISOString(),status:'approved'}));calendarFormOpen=false;calendarDatePrefill='';await loadBookings();render();message('Termin zatwierdzony. Teraz możesz utworzyć dla niego plan treningowy.')}catch(err){message(err.code==='23P01'?'Na ten termin przypada już inny zatwierdzony trening.':err.message,true)}}

function openSet(exid,planid){if(!exid)return;const e=exercises.find(x=>x.id===exid);$('flash').innerHTML=card(`<h3>Zapisz serię — ${esc(e?.name)}</h3><div class="formgrid">${input('Ciężar (kg)','skg','number')}${input('Powtórzenia','sreps','number')}</div><div style="margin-top:12px">${btn('Zapisz serię',`saveSet('${exid}','${planid}')`)}</div>`);window.scrollTo({top:0,behavior:'smooth'})}async function saveSet(exid,planid){try{if(v('skg')===''||number('skg')<0||number('sreps')<1)throw Error('Podaj ciężar i powtórzenia');let session=sessions.find(x=>x.plan_id===planid&&!x.finished_at&&x.started_at.slice(0,10)===today());if(!session){session=check(await sb.from('workout_sessions').insert({client_id:me.id,plan_id:planid}).select().single())}const n=sets.filter(x=>x.session_id===session.id&&x.exercise_id===exid).length+1;check(await sb.from('workout_sets').insert({session_id:session.id,exercise_id:exid,set_number:n,weight_kg:number('skg'),reps:number('sreps'),completed:true}));await loadClient();render();message('Seria zapisana')}catch(e){message(e.message,true)}}
function chart(rows,key,date='measured_on'){let d=rows.filter(x=>x[key]!=null).slice(-8),max=Math.max(1,...d.map(x=>Number(x[key])));return d.length?`<div class="chart">${d.map(x=>`<div class="bar" style="height:${Math.max(8,Number(x[key])/max*110)}px"><span>${esc(x[key])}</span><em>${esc((x[date]||'').slice(5,10))}</em></div>`).join('')}</div>`:'<p class="muted">Brak danych do wykresu.</p>'}function progress(){return `${card(`<h2>Masa ciała</h2>${chart(measurements,'weight_kg')}<div class="formgrid">${input('Data','wdate','date',today())}${input('Waga (kg)','wvalue','number')}</div><div style="margin-top:12px">${btn('Dodaj pomiar','saveWeight()')}</div>`)}${card(`<h2>Pomiary obwodów (cm)</h2>${measurements.slice(-5).reverse().map(m=>`<div class="row"><span>${esc(m.measured_on)}</span><span class="small">Talia ${m.waist_cm??'—'} · Biodra ${m.hips_cm??'—'} · Ramię ${m.arm_cm??'—'} · Udo ${m.thigh_cm??'—'}</span></div>`).join('')}<div class="formgrid">${input('Data','mdate','date',today())}${input('Talia (cm)','mwaist','number')}${input('Biodra (cm)','mhips','number')}${input('Ramię (cm)','marm','number')}${input('Udo (cm)','mthigh','number')}</div><div style="margin-top:12px">${btn('Zapisz pomiary','saveMeasurements()')}</div>`)}${card(`<h2>Zdjęcia sylwetki</h2><p class="muted">Metadane w bazie: ${photos.length} zdjęć. Przesyłanie zdjęć uruchomimy dopiero po skonfigurowaniu prywatnego Storage i polityk dostępu.</p>`)}`}
async function saveWeight(){try{if(number('wvalue')<=0)throw Error('Podaj prawidłową wagę');check(await sb.from('body_measurements').insert({client_id:clientId(),measured_on:v('wdate')||today(),weight_kg:number('wvalue')}));await loadClient();render();message('Waga zapisana')}catch(e){message(e.message,true)}}async function saveMeasurements(){try{const fields={waist_cm:v('mwaist'),hips_cm:v('mhips'),arm_cm:v('marm'),thigh_cm:v('mthigh')};if(Object.values(fields).every(x=>!x))throw Error('Wpisz przynajmniej jeden pomiar');const record={client_id:clientId(),measured_on:v('mdate')||today()};for(const [k,x] of Object.entries(fields)){if(x){if(Number(x)<=0)throw Error('Pomiary muszą być dodatnie');record[k]=Number(x)}}check(await sb.from('body_measurements').insert(record));await loadClient();render();message('Pomiary zapisane')}catch(e){message(e.message,true)}}
function recipesPage(){return `<div class="two">${recipes.map(r=>card(`<div class="recipe"><span class="tag">${esc(r.description||'Przepis')}</span><h2 style="margin:12px 0 6px">${esc(r.title)}</h2><b>${r.calories??'—'} kcal · ${r.protein_g??'—'} g białka</b></div><h3 style="margin-top:18px">Składniki</h3><p style="white-space:pre-line">${esc(Array.isArray(r.ingredients)?r.ingredients.map(i=>typeof i==='string'?i:JSON.stringify(i)).join('\n'):JSON.stringify(r.ingredients||''))}</p><h3>Przygotowanie</h3><p style="white-space:pre-line">${esc(r.instructions)}</p>`)).join('')}</div>${trainer()?card(`<h2>Dodaj przepis</h2><div class="formgrid">${input('Nazwa','rtitle')}${input('Kategoria','rtype')}${input('Kalorie na porcję','rkcal','number')}${input('Białko (g)','rprotein','number')}</div><label>Składniki (jeden w wierszu)</label><textarea id="ringredients"></textarea><label>Przygotowanie</label><textarea id="rsteps"></textarea><div style="margin-top:12px">${btn('Zapisz przepis','addRecipe()')}</div>`):''}`}async function addRecipe(){try{if(!v('rtitle')||!v('ringredients')||!v('rsteps'))throw Error('Wypełnij nazwę, składniki i przygotowanie');check(await sb.from('recipes').insert({title:v('rtitle'),description:v('rtype'),calories:number('rkcal')||null,protein_g:number('rprotein')||null,ingredients:v('ringredients').split('\n').map(x=>x.trim()).filter(Boolean),instructions:v('rsteps'),portions:1}));await load();message('Przepis zapisany')}catch(e){message(e.message,true)}}async function addExercise(){try{if(!v('ename'))throw Error('Podaj nazwę ćwiczenia');check(await sb.from('exercises').insert({name:v('ename'),muscle_group:v('egroup')}));await load();message('Ćwiczenie dodane')}catch(e){message(e.message,true)}}

let profileHealthEdit=false, exerciseEditingId='', clientPrivateNote='', clientAvatarUrl='',
 diaryEntries=[], trainingWeekMonday=weekStart(new Date()), trainingHistoryOlderOpen=false;

function weekStart(x){const d=new Date(x);d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d}
function weekBounds(){const a=new Date(trainingWeekMonday);a.setHours(0,0,0,0);const b=new Date(a);b.setDate(b.getDate()+7);return [a,b]}
function inWeek(date){const [a,b]=weekBounds();const d=new Date(date);return d>=a&&d<b}
function fmtShortDate(d){return new Date(d).toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'})}
function fmtTime(d){return new Date(d).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}
function exerciseDisplayName(x){return x.exercise_name_snapshot || exercises.find(e=>e.id===x.exercise_id)?.name || 'Ćwiczenie'}
function validExerciseRows(){return exercises.filter(e=>!e.archived_at)}
function bookingPlans(){return plans.filter(p=>p.booking_id&&bookings.some(b=>b.id===p.booking_id&&b.status==='approved'))}
function diaryEntryFor(id){return diaryEntries.find(x=>x.booking_id===id)}
function diaryActualFor(entry,x){const item=entry?.actual?.[x.id];if(item&&item.exercise_id===x.exercise_id)return item;
 return {exercise_id:x.exercise_id,sets:x.sets_target||0,reps:x.reps_target||'',weight:x.weight_target_kg??0,skipped:false,comment:''}}

async function loadClient(){
 measurements=[];plans=[];planExercises=[];sets=[];sessions=[];preferences=[];photos=[];diaryEntries=[];
 clientPrivateNote='';clientAvatarUrl='';if(!clientId())return;
 const id=clientId();const res=await Promise.all([
  sb.from('body_measurements').select('*').eq('client_id',id).order('measured_on'),
  sb.from('training_plans').select('*').eq('client_id',id).order('created_at',{ascending:false}),
  sb.from('workout_sessions').select('*').eq('client_id',id).order('started_at',{ascending:false}),
  sb.from('exercise_preferences').select('*').eq('client_id',id),
  sb.from('progress_photos').select('*').eq('client_id',id).order('taken_on',{ascending:false}),
  sb.from('forma_diary_entries').select('*').eq('client_id',id)
 ]);
 [measurements,plans,sessions,preferences,photos,diaryEntries]=res.map(check);
 if(plans.length)planExercises=check(await sb.from('plan_exercises').select('*').in('plan_id',plans.map(x=>x.id)).order('sort_order'));
 if(sessions.length)sets=check(await sb.from('workout_sets').select('*').in('session_id',sessions.map(x=>x.id)));
 if(trainer()){
   const r=await sb.from('forma_trainer_notes').select('notes').eq('client_id',id).maybeSingle();
   clientPrivateNote=check(r)?.notes||'';
 }
 const c=trainer()?clients.find(x=>x.id===id):me;
 if(c?.avatar_path){const r=await sb.storage.from('forma-avatars').createSignedUrl(c.avatar_path,3600);
   if(!r.error)clientAvatarUrl=r.data.signedUrl;
 }
}

 else list.sort((a,b)=>String(a.full_name||'').localeCompare(String(b.full_name||''),'pl'));
 return list.map(clientTile).join('')||'<div class="emptyState">Brak pasujących podopiecznych.</div>'}

async function uploadProfileAvatar(inputEl){if(!trainer()||!inputEl.files?.length)return;const file=inputEl.files[0];
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>3*1024*1024)return message('Wybierz zdjęcie JPG, PNG lub WebP do 3 MB.',true);
 const id=clientId(),c=clients.find(x=>x.id===id);if(!c)return;
 const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'})[file.type];
 const path=`${id}/avatar_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
 try{check(await sb.storage.from('forma-avatars').upload(path,file,{contentType:file.type,upsert:false}));
  try{check(await sb.from('profiles').update({avatar_path:path}).eq('id',id))}
  catch(e){await sb.storage.from('forma-avatars').remove([path]);throw e}
  const old=c.avatar_path;c.avatar_path=path;if(old)await sb.storage.from('forma-avatars').remove([old]);
  const signed=check(await sb.storage.from('forma-avatars').createSignedUrl(path,3600));clientAvatarUrl=signed.signedUrl;
  render();message('Zdjęcie profilowe zapisane.')}
 catch(e){message('Nie udało się dodać zdjęcia: '+e.message,true)}}

  await sb.storage.from('forma-avatars').remove([c.avatar_path]);c.avatar_path=null;clientAvatarUrl='';render();message('Zdjęcie usunięte.')}

function startTraining(){if(!trainer())return;const avail=unplannedBookings();if(!avail.length){message('Wszystkie zatwierdzone terminy mają plan. Wybierz „Edytuj” przy istniejącym treningu.',true);return}
 const first=avail.find(b=>inWeek(b.starts_at));trainingDraft={mode:'new',booking_id:first?.id||'',name:'',notes:'',items:[]};render()}
function startTrainingForBooking(id){const b=bookings.find(x=>x.id===id);if(!b||b.client_id!==clientId())return message('Nie znaleziono terminu.',true);
 trainingWeekMonday=weekStart(b.starts_at);trainingDraft={mode:'new',booking_id:id,name:'',notes:'',items:[]};render()}
function editTraining(id){if(!trainer())return;const p=plans.find(x=>x.id===id);if(!p?.booking_id)return message('Ten plan nie ma terminu w kalendarzu.',true);
 const b=bookings.find(x=>x.id===p.booking_id);if(b)trainingWeekMonday=weekStart(b.starts_at);
 trainingDraft={mode:'edit',booking_id:p.booking_id,name:p.name||'',notes:p.description||'',
  items:planExercises.filter(e=>e.plan_id===p.id).map(e=>({id:e.id,exercise_id:e.exercise_id,sets_target:e.sets_target??3,reps_target:e.reps_target||'',weight_target_kg:e.weight_target_kg??0,notes:e.notes||''}))};
 render()}
function captureTrainingDraft(){if(!trainingDraft)return;
 trainingDraft.name=v('trainingName');trainingDraft.notes=v('trainingNotes');
 trainingDraft.items.forEach((x,i)=>{x.exercise_id=v('trainingExercise-'+i)||x.exercise_id;x.sets_target=v('trainingSets-'+i);x.reps_target=v('trainingReps-'+i);x.weight_target_kg=v('trainingWeight-'+i);x.notes=v('trainingExNotes-'+i)})}
function changeTrainingWeek(n){if(trainingDraft)captureTrainingDraft();trainingWeekMonday.setDate(trainingWeekMonday.getDate()+7*n);
 if(trainingDraft?.mode==='new'&&trainingDraft.booking_id&&!inWeek(bookings.find(b=>b.id===trainingDraft.booking_id)?.starts_at)){
   trainingDraft.booking_id=unplannedBookings().find(b=>inWeek(b.starts_at))?.id||'';
 }render()}
function resetTrainingWeek(){if(trainingDraft)captureTrainingDraft();trainingWeekMonday=weekStart(new Date());
 if(trainingDraft?.mode==='new')trainingDraft.booking_id=unplannedBookings().find(b=>inWeek(b.starts_at))?.id||'';
 render()}

/* FORMA 1.4 — analityka z wykonanych treningów, bez nowych tabel. */
let diarySection='history', strengthMetric='weight', strengthRange='3m';
let strengthSearch='', strengthMuscle='all', strengthExerciseId='';
let diaryFocusedBookingId='', diaryFocusedExerciseId='';
const strengthMetricOptions={weight:{title:'Maksymalny ciężar',unit:'kg',explanation:'Najwyższy ciężar zapisany dla ćwiczenia podczas danego treningu.'},reps:{title:'Liczba powtórzeń',unit:'powt.',explanation:'Liczba powtórzeń w serii. Analizujemy wyłącznie wpisy z jednoznaczną liczbą, np. 10.'},volume:{title:'Objętość treningowa',unit:'kg',explanation:'Suma serie × powtórzenia × ciężar. Obliczana tylko przy liczbowej wartości powtórzeń i jednakowych parametrach serii.'}};
function strengthNumber(x){const n=Number(x);return x!==null&&x!==undefined&&String(x).trim()!==''&&Number.isFinite(n)?n:null}
function strengthRepsCount(x){const value=String(x??'').trim();return /^\d+$/.test(value)?Number(value):null}
function strengthHistoryRows(){
 const now=Date.now(),raw=[];
 for(const b of bookings){
  if(b.client_id!==clientId()||b.status!=='approved'||new Date(b.ends_at).getTime()>now)continue;
  const p=plans.find(p=>p.booking_id===b.id);if(!p)continue;
  const diary=diaryEntryFor(b.id);if(diary?.status==='missed')continue;
  for(const x of planExercises.filter(x=>x.plan_id===p.id)){
   const actual=diaryActualFor(diary,x),setsCount=strengthNumber(actual.sets),weight=strengthNumber(actual.weight);
   if(actual.skipped||setsCount===null||setsCount<=0||weight===null||weight<0)continue;
   const reps=strengthRepsCount(actual.reps);
   raw.push({bookingId:b.id,planExerciseId:x.id,exerciseId:x.exercise_id,
    name:exerciseDisplayName(x),muscle:exercises.find(e=>e.id===x.exercise_id)?.muscle_group||'Inne',
    timestamp:new Date(b.starts_at).getTime(),date:fmtShortDate(b.starts_at),sets:setsCount,
    reps,repsText:String(actual.reps??''),weight,
    volume:reps===null?null:setsCount*reps*weight,
    saved:!!diary});
  }
 }
 // Jedno zestawienie na trening i ćwiczenie; powtórzone ćwiczenia sumują serie/objętość.
 const grouped=new Map();
 for(const r of raw){
  const key=r.bookingId+'|'+r.exerciseId;
  if(!grouped.has(key)){grouped.set(key,{...r,repsTexts:[r.repsText],repsDefined:r.reps!==null,volumeDefined:r.volume!==null});continue}
  const g=grouped.get(key);g.sets+=r.sets;g.weight=Math.max(g.weight,r.weight);
  if(r.reps!==null)g.reps=g.reps===null?r.reps:Math.max(g.reps,r.reps);
  else g.repsDefined=false;
  g.repsTexts.push(r.repsText);
  if(r.volume===null)g.volumeDefined=false;
  else if(g.volumeDefined)g.volume+=r.volume;
 }
 return [...grouped.values()].map(r=>({...r,reps:r.repsDefined?r.reps:null,
  volume:r.volumeDefined?r.volume:null,repsText:[...new Set(r.repsTexts)].join(' / ')})).sort((a,b)=>a.timestamp-b.timestamp);
}
function strengthExerciseOptions(rows){const map=new Map();for(const r of rows)if(!map.has(r.exerciseId))map.set(r.exerciseId,{id:r.exerciseId,name:r.name,muscle:r.muscle});return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'pl'))}
function filteredStrengthExercises(){const query=strengthSearch.trim().toLocaleLowerCase('pl');return strengthExerciseOptions(strengthHistoryRows()).filter(e=>(strengthMuscle==='all'||e.muscle===strengthMuscle)&&e.name.toLocaleLowerCase('pl').includes(query))}
function strengthRangeDate(){if(strengthRange==='all')return -Infinity;const d=new Date();d.setHours(0,0,0,0);const months={'1m':1,'3m':3,'6m':6}[strengthRange]||3;d.setMonth(d.getMonth()-months);return d.getTime()}
function formatStrength(v,max=2){if(v===null||!Number.isFinite(v))return '—';return new Intl.NumberFormat('pl-PL',{maximumFractionDigits:max}).format(v)}
function strengthMetricValue(r){return r[strengthMetric]}
function strengthChartSvg(rows){
 const pts=rows.filter(r=>strengthMetricValue(r)!==null);if(!pts.length)return '<div class="emptyState">Brak liczbowych danych do tego wykresu w wybranym okresie. Sprawdź wpisane powtórzenia lub wybierz inny zakres.</div>';
 const width=860,height=284,left=74,right=22,top=23,bottom=55,plotW=width-left-right,plotH=height-top-bottom;
 const max=Math.max(1,...pts.map(strengthMetricValue)),maxY=max*1.12;
 const minT=pts[0].timestamp,maxT=pts[pts.length-1].timestamp;
 const x=(r,i)=>minT===maxT?left+plotW/2:left+(r.timestamp-minT)/(maxT-minT)*plotW;
 const y=r=>top+plotH-(strengthMetricValue(r)/maxY)*plotH;
 const grid=[0,1,2,3,4].map(i=>{const yy=top+i*plotH/4;return `<line x1="${left}" y1="${yy}" x2="${width-right}" y2="${yy}" stroke="#e9e3db" stroke-dasharray="4 4"/><text x="${left-12}" y="${yy+4}" text-anchor="end" font-size="12" fill="#847b70">${esc(formatStrength(maxY*(1-i/4),1))}</text>`}).join('');
 const line=pts.map((r,i)=>`${x(r,i).toFixed(1)},${y(r).toFixed(1)}`).join(' ');
 const labels=pts.filter((r,i)=>i===0||i===pts.length-1||i%Math.max(1,Math.ceil(pts.length/6))===0).map(r=>`<text x="${x(r).toFixed(1)}" y="${height-24}" font-size="11" text-anchor="middle" fill="#847b70">${esc(new Date(r.timestamp).toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'}))}</text>`).join('');
 const dots=pts.map((r,i)=>`<circle cx="${x(r,i).toFixed(1)}" cy="${y(r).toFixed(1)}" r="6" fill="#a69076" stroke="white" stroke-width="2" tabindex="0" role="button" style="cursor:pointer" aria-label="${esc(r.date+' — '+formatStrength(strengthMetricValue(r))+' '+strengthMetricOptions[strengthMetric].unit+'; otwórz trening')}" onclick="openStrengthDiaryBooking('${esc(r.bookingId)}','${esc(r.planExerciseId)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openStrengthDiaryBooking('${esc(r.bookingId)}','${esc(r.planExerciseId)}')}"><title>${esc(r.date+' · '+formatStrength(strengthMetricValue(r))+' '+strengthMetricOptions[strengthMetric].unit)}</title></circle>`).join('');
 return `<div class="strengthChartWrap"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Wykres: ${esc(strengthMetricOptions[strengthMetric].title)}"><g>${grid}</g><polyline points="${line}" fill="none" stroke="#a69076" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}</svg></div>`;
}
function strengthAnalysisHTML(){
 const options=filteredStrengthExercises();if(!options.length)return '<div class="emptyState">Brak ćwiczeń pasujących do wyszukiwania i filtra.</div>';
 if(!options.some(x=>x.id===strengthExerciseId))strengthExerciseId=options[0].id;
 const ex=options.find(x=>x.id===strengthExerciseId),all=strengthHistoryRows().filter(r=>r.exerciseId===strengthExerciseId),rows=all.filter(r=>r.timestamp>=strengthRangeDate());
 const meta=strengthMetricOptions[strengthMetric],valid=rows.filter(r=>strengthMetricValue(r)!==null);
 const topStat=(label,value)=>`<div class="strengthStat"><div class="miniLabel">${label}</div><strong>${esc(value)}</strong></div>`;
 const stat=v=>v===null?'—':formatStrength(v)+(meta.unit?' '+meta.unit:'');
 const stats=valid.length?[topStat('Pierwszy wynik',stat(strengthMetricValue(valid[0]))),topStat('Ostatni wynik',stat(strengthMetricValue(valid[valid.length-1]))),topStat('Najlepszy wynik',stat(Math.max(...valid.map(strengthMetricValue))))].join(''):[topStat('Pierwszy wynik','—'),topStat('Ostatni wynik','—'),topStat('Najlepszy wynik','—')].join('');
 const tabs=(items,active,handler,extra='')=>`<div class="strengthTabs ${extra}">${items.map(([id,label])=>`<button type="button" class="${active===id?'active':''} ${extra==='strengthRangeTabs'?'rangeBtn':''}" aria-pressed="${active===id}" onclick="${handler}('${id}')">${label}</button>`).join('')}</div>`;
 const history=rows.slice().reverse().map(r=>`<tr data-booking="${esc(r.bookingId)}" tabindex="0" role="button" aria-label="Otwórz trening ${esc(r.date)}" onclick="openStrengthDiaryBooking('${esc(r.bookingId)}','${esc(r.planExerciseId)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openStrengthDiaryBooking('${esc(r.bookingId)}','${esc(r.planExerciseId)}')}"><td><span class="resultLink">${esc(r.date)} ↗</span></td><td>${esc(formatStrength(r.sets,0))}</td><td>${esc(r.repsText||'—')}</td><td>${esc(formatStrength(r.weight))} kg</td><td>${r.volume===null?'—':esc(formatStrength(r.volume))+' kg'}</td><td>${r.saved?'Zapis dziennika':'Według planu'}</td></tr>`).join('');
 return `<div class="strengthAnalysis"><div class="sectionHeading" style="margin-top:18px"><div><h3 style="margin:0">${esc(ex.name)} — analiza wyników</h3><p class="hint" style="margin:4px 0 0">${esc(ex.muscle)} · ${all.length} treningów w historii</p></div></div>
 <div class="miniLabel">Rodzaj wykresu</div>${tabs([['weight','Ciężar'],['reps','Powtórzenia'],['volume','Objętość']],strengthMetric,'strengthMetricChanged')}
 <div class="miniLabel">Zakres czasu</div>${tabs([['1m','1 mies.'],['3m','3 mies.'],['6m','6 mies.'],['all','Całość']],strengthRange,'strengthRangeChanged','strengthRangeTabs')}
 <h3 style="margin:19px 0 4px">${meta.title}</h3><p class="strengthSummaryNote">${meta.explanation}</p>
 <div class="strengthStats">${stats}</div>${strengthChartSvg(rows)}
 <h3 style="margin-top:23px">Historia wyników</h3><p class="hint">Kliknij datę lub wiersz, aby otworzyć ten trening i edytować rzeczywiście wykonane wartości.</p>
 <div class="strengthTableWrap"><table class="strengthTable"><thead><tr><th>Data</th><th>Serie</th><th>Powtórzenia</th><th>Ciężar</th><th>Objętość</th><th>Źródło</th></tr></thead><tbody>${history||'<tr><td colspan="6">Brak wyników w tym okresie.</td></tr>'}</tbody></table></div>
 <p class="strengthSummaryNote">Wyniki oznaczone „Według planu” są domyślnie uznane za wykonane, dopóki nie zmienisz ich w Dzienniku treningowym. Dla zakresów typu „8–12” nie wyliczamy powtórzeń ani objętości, aby nie zgadywać.</p></div>`;
}

function strengthFilterChanged(){strengthSearch=$('strengthSearch')?.value||'';strengthMuscle=v('strengthMuscle')||'all';strengthExerciseId=filteredStrengthExercises().some(e=>e.id===strengthExerciseId)?strengthExerciseId:(filteredStrengthExercises()[0]?.id||'');const sel=$('strengthExerciseSelect');if(sel){sel.innerHTML=strengthPickerOptions();sel.disabled=!filteredStrengthExercises().length}renderStrengthAnalysis()}

function strengthOverview(){
 const list=strengthExerciseOptions(strengthHistoryRows());if(!list.length)return card('<h2>Progres siłowy</h2><div class="emptyState">Nie ma jeszcze zakończonych treningów z zapisanymi ćwiczeniami. Wyniki pojawią się automatycznie po zakończeniu pierwszego treningu.</div>');
 const muscles=[...new Set(list.map(e=>e.muscle))].sort((a,b)=>a.localeCompare(b,'pl'));const filtered=filteredStrengthExercises();
 if(!filtered.some(e=>e.id===strengthExerciseId))strengthExerciseId=filtered[0]?.id||'';

function progressMeasurementsPage(){const rows=progressFieldRows(),metric=progressFields.find(([k])=>k===progressMeasureMetric)||progressFields[0],chartRows=progressRangeRows(rows.filter(m=>progressHas(m[metric[0]])&&Number(m[metric[0]])>0));
 const edit=measurements.find(m=>m.id===progressMeasurementsEditing),history=rows.slice().reverse();
 const columns=progressFields.map(([k,title])=>`<th>${esc(title)}</th>`).join('');
 return `${card(`<div class="sectionHeading"><h2>Pomiary ciała</h2><span class="statusPill">${rows.length} zestawów</span></div><div class="progressToolbar"><div style="flex:1;max-width:370px"><label for="progressMeasurementMetric">Obwód na wykresie</label><select id="progressMeasurementMetric" onchange="progressMeasureMetric=this.value;render()">${progressFields.map(([k,title])=>`<option value="${k}" ${progressMeasureMetric===k?'selected':''}>${esc(title)}</option>`).join('')}</select></div>${progressRangeSelect()}</div>${progressStats(rows.filter(m=>progressHas(m[metric[0]])&&Number(m[metric[0]])>0),metric[0],'cm')}${progressChartSvg(chartRows,metric[0],'cm')}`)}
 ${card(`<div class="progressEntryForm" id="progressMeasurementsForm"><h3>${edit?'Edytuj pomiary':'Dodaj pomiary obwodów'}</h3><form onsubmit="progressSaveMeasurements(event)"><div class="formgrid"><div><label for="progressMeasurementsDate">Data pomiaru</label><input type="date" id="progressMeasurementsDate" required value="${esc(edit?.measured_on||today())}"></div>${progressFields.map(([k,title])=>`<div><label for="progress-${k}">${esc(title)} (cm)</label><input id="progress-${k}" type="number" min="0.1" max="500" step="0.1" inputmode="decimal" placeholder="cm" value="${esc(edit?.[k]??'')}"></div>`).join('')}</div><label for="progressMeasurementsNotes">Notatka (opcjonalnie)</label><textarea id="progressMeasurementsNotes" rows="2" maxlength="1000" placeholder="Np. pomiar rano, na czczo">${esc(edit?.notes||'')}</textarea><div class="progressFormButtons"><button class="primary" type="submit">${edit?'Zapisz zmiany':'Zapisz pomiary'}</button>${edit?'<button class="ghost" type="button" onclick="progressMeasurementsEditing=\'\';render()">Anuluj</button>':''}</div></form></div><h3>Historia pomiarów</h3>${history.length?`<div class="progressHistory"><table><thead><tr><th>Data</th>${columns}<th></th></tr></thead><tbody>${history.map(m=>`<tr><td>${progressDateLabel(m.measured_on)}</td>${progressFields.map(([k])=>`<td>${progressHas(m[k])?progressNum(m[k])+' cm':'—'}</td>`).join('')}<td class="progressHistoryActions"><button type="button" onclick="progressEditMeasurements('${esc(m.id)}')">Edytuj</button><button class="delete" type="button" onclick="progressDeleteMeasurements('${esc(m.id)}')">Usuń</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="progressEmpty">Nie ma jeszcze pomiarów obwodów. Wystarczy wprowadzić jeden obwód.</div>'}`)}`;
}
function progressEditMeasurements(id){progressMeasurementsEditing=id;render();$('progressMeasurementsForm')?.scrollIntoView({behavior:'smooth',block:'center'})}
async function progressSaveMeasurements(event){event.preventDefault();try{
 const date=v('progressMeasurementsDate'),record={measured_on:date,notes:v('progressMeasurementsNotes')};if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('Wybierz datę pomiaru.');
 let present=0;for(const [key] of progressFields){const raw=v('progress-'+key);if(raw){const n=progressValue('progress-'+key);if(n>500)throw Error('Pomiary obwodów muszą być mniejsze niż 500 cm.');record[key]=n;present++}else record[key]=null}
 if(!present)throw Error('Wpisz przynajmniej jeden obwód.');
 const editing=measurements.find(x=>x.id===progressMeasurementsEditing);
 if(editing)check(await sb.from('body_measurements').update(record).eq('id',editing.id).eq('client_id',clientId()));
 else check(await sb.from('body_measurements').insert({...record,client_id:clientId()}));
 progressMeasurementsEditing='';await loadClient();render();message('Pomiary ciała zapisane.');
 }catch(e){message('Nie udało się zapisać pomiarów: '+e.message,true)}}
async function progressDeleteMeasurements(id){const m=measurements.find(x=>x.id===id&&progressOtherMeasurements(x));if(!m||!window.confirm('Usunąć pomiary obwodów z tego dnia?'))return;
 try{const payload=Object.fromEntries(progressFields.map(([k])=>[k,null]));const q=progressHas(m.weight_kg)?sb.from('body_measurements').update(payload).eq('id',id).eq('client_id',clientId()):sb.from('body_measurements').delete().eq('id',id).eq('client_id',clientId());check(await q);progressMeasurementsEditing='';await loadClient();render();message('Pomiary obwodów usunięte.')}catch(e){message('Nie udało się usunąć pomiarów: '+e.message,true)}}
function progressPhotosPage(){return `${card(`<div class="sectionHeading"><h2>Zdjęcia sylwetki</h2><span class="statusPill">${photos.length} zdjęć</span></div><p class="hint">Dodaj zdjęcia przodem, bokiem lub tyłem, a następnie porównuj sylwetkę z dwóch dat.</p><div class="progressPrivacy">Zdjęcia są prywatne — dostęp ma podopieczna i trenerka. Pliki są przechowywane w prywatnym zasobniku Supabase i wyświetlane przez czasowe odnośniki.</div><div class="progressEntryForm"><h3>Dodaj zdjęcie</h3><form onsubmit="progressUploadPhoto(event)"><div class="formgrid"><div><label for="progressPhotoDate">Data zdjęcia</label><input id="progressPhotoDate" type="date" value="${today()}" required></div><div><label for="progressPhotoType">Ujęcie</label><select id="progressPhotoType"><option value="front">Przód</option><option value="side">Bok</option><option value="back">Tył</option><option value="other">Inne</option></select></div></div><label for="progressPhotoFile">Zdjęcie JPG, PNG lub WebP (do 5 MB)</label><input type="file" id="progressPhotoFile" accept="image/jpeg,image/png,image/webp" required><div class="progressFormButtons"><button type="submit" class="primary" id="progressPhotoUploadButton">Dodaj zdjęcie</button></div></form></div><div id="progressPhotoDisplay"><div class="progressEmpty">${photos.length?'Ładowanie prywatnych zdjęć…':'Nie ma jeszcze zdjęć sylwetki.'}</div></div>`)}`}
async function hydrateProgressPhotos(force=false){const container=$('progressPhotoDisplay');if(!container||tab!=='progress'||progressSection!=='photos')return;
 const cid=clientId(),key=cid+'|'+photos.map(p=>p.id+':'+p.storage_path).join('|');
 if(!photos.length){container.innerHTML=progressPhotoContent();return}
 if(!force&&progressPhotoCacheKey===key&&Date.now()<progressPhotoCacheUntil){container.innerHTML=progressPhotoContent();return}
 const request=++progressPhotoRequest;container.innerHTML='<div class="progressEmpty">Wczytywanie prywatnych zdjęć…</div>';
 const results=await Promise.all(photos.map(p=>sb.storage.from('forma-progress').createSignedUrl(p.storage_path,3600)));
 if(request!==progressPhotoRequest||clientId()!==cid||tab!=='progress'||progressSection!=='photos')return;
 progressPhotoSignedUrls={};let errors=0;results.forEach((r,i)=>{if(r.error||!r.data?.signedUrl)errors++;else progressPhotoSignedUrls[photos[i].id]=r.data.signedUrl});
 progressPhotoCacheKey=key;progressPhotoCacheUntil=Date.now()+45*60*1000;
 if($('progressPhotoDisplay'))$('progressPhotoDisplay').innerHTML=(errors?`<div class="notice error">Nie udało się odczytać ${errors} zdjęć. Sprawdź SQL i dostęp do prywatnego Storage.</div>`:'')+progressPhotoContent();
}
function progressPhotoContent(){if(!photos.length)return '<div class="progressEmpty">Nie ma jeszcze zdjęć sylwetki. Dodaj zdjęcie, aby rozpocząć historię.</div>';
 const availableTypes=['front','side','back','other'];const candidates=photos.filter(p=>p.photo_type===progressCompareType),dates=[...new Set(candidates.map(p=>p.taken_on))].sort();
 if(!dates.includes(progressCompareBefore))progressCompareBefore=dates[0]||'';
 if(!dates.includes(progressCompareAfter))progressCompareAfter=dates[dates.length-1]||'';
 const typeOptions=availableTypes.map(type=>`<option value="${type}" ${progressCompareType===type?'selected':''}>${progressPhotoLabels[type]}</option>`).join('');
 const dateOptions=selected=>dates.map(date=>`<option value="${esc(date)}" ${date===selected?'selected':''}>${progressDateLabel(date)}</option>`).join('');
 const findPhoto=date=>photos.filter(p=>p.taken_on===date&&p.photo_type===progressCompareType).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))[0];
 const compareCard=(p,title,date)=>`<div class="progressCompareCard">${p&&progressPhotoSignedUrls[p.id]?`<img src="${esc(progressPhotoSignedUrls[p.id])}" alt="Zdjęcie sylwetki: ${esc(title)}, ${esc(progressPhotoLabels[progressCompareType])}" loading="lazy">`:'<div class="progressEmptyPhoto">Brak zdjęcia dla wybranej daty i ujęcia</div>'}<div class="progressCompareCaption">${esc(title)} · ${progressDateLabel(date)}</div></div>`;
 const gallery=photos.filter(p=>progressGalleryFilter==='all'||p.photo_type===progressGalleryFilter).slice().sort((a,b)=>String(b.taken_on).localeCompare(String(a.taken_on))||String(b.created_at).localeCompare(String(a.created_at)));
 return `<h3>Porównaj sylwetkę</h3><div class="progressCompareFilters"><div><label for="progressCompareType">Ujęcie</label><select id="progressCompareType" onchange="progressCompareType=this.value;progressCompareBefore='';progressCompareAfter='';progressUpdatePhotoContent()">${typeOptions}</select></div><div><label for="progressCompareBefore">Zdjęcie wcześniejsze</label><select id="progressCompareBefore" onchange="progressCompareBefore=this.value;progressUpdatePhotoContent()" ${dates.length?'':'disabled'}>${dateOptions(progressCompareBefore)}</select></div><div><label for="progressCompareAfter">Zdjęcie późniejsze</label><select id="progressCompareAfter" onchange="progressCompareAfter=this.value;progressUpdatePhotoContent()" ${dates.length?'':'disabled'}>${dateOptions(progressCompareAfter)}</select></div></div>${dates.length?`<div class="progressComparison">${compareCard(findPhoto(progressCompareBefore),'Wcześniej',progressCompareBefore)}${compareCard(findPhoto(progressCompareAfter),'Później',progressCompareAfter)}</div>${dates.length===1?'<p class="hint" style="margin-top:10px">Dodaj zdjęcie tego samego ujęcia z innego dnia, aby zobaczyć porównanie.</p>':''}`:'<div class="progressEmpty">Brak zdjęć dla tego ujęcia. Wybierz inny typ.</div>'}
 <div class="sectionHeading" style="margin-top:28px"><h2>Historia zdjęć</h2><span class="statusPill">${gallery.length} zdjęć</span></div><div class="progressToolbar"><div><label for="progressGalleryFilter">Filtruj ujęcia</label><select id="progressGalleryFilter" onchange="progressGalleryFilter=this.value;progressUpdatePhotoContent()"><option value="all" ${progressGalleryFilter==='all'?'selected':''}>Wszystkie zdjęcia</option>${availableTypes.map(t=>`<option value="${t}" ${progressGalleryFilter===t?'selected':''}>${progressPhotoLabels[t]}</option>`).join('')}</select></div></div>
 ${gallery.length?`<div class="progressGallery">${gallery.map(p=>`<div class="progressPhotoTile">${progressPhotoSignedUrls[p.id]?`<a href="${esc(progressPhotoSignedUrls[p.id])}" target="_blank" rel="noopener noreferrer" aria-label="Powiększ zdjęcie ${esc(progressDateLabel(p.taken_on))}"><img src="${esc(progressPhotoSignedUrls[p.id])}" loading="lazy" alt="${esc(progressPhotoLabels[p.photo_type]||'Sylwetka')} — ${progressDateLabel(p.taken_on)}"></a>`:'<div class="progressEmptyPhoto">Brak podglądu zdjęcia</div>'}<footer><div><strong>${progressPhotoLabels[p.photo_type]||'Inne'}</strong><small>${progressDateLabel(p.taken_on)}</small></div><button type="button" onclick="progressDeletePhoto('${esc(p.id)}')" aria-label="Usuń zdjęcie">Usuń</button></footer></div>`).join('')}</div>`:'<div class="progressEmpty">Brak zdjęć o wybranym typie.</div>'}`;
}
function progressUpdatePhotoContent(){const el=$('progressPhotoDisplay');if(el)el.innerHTML=progressPhotoContent()}
async function progressUploadPhoto(event){event.preventDefault();const button=$('progressPhotoUploadButton');let path='',uploaded=false;try{
 const file=$('progressPhotoFile')?.files?.[0],cid=clientId(),date=v('progressPhotoDate'),type=v('progressPhotoType');
 if(!cid||!file)throw Error('Wybierz plik zdjęcia.');
 const mimeExt={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};
 if(!mimeExt[file.type])throw Error('Dozwolone formaty: JPG, PNG, WebP.');
 if(file.size>5*1024*1024)throw Error('Zdjęcie nie może przekraczać 5 MB.');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!progressPhotoLabels[type])throw Error('Wybierz datę i typ zdjęcia.');
 if(button){button.disabled=true;button.textContent='Zapisywanie…'}
 path=`${cid}/${crypto.randomUUID()}.${mimeExt[file.type]}`;
 const up=await sb.storage.from('forma-progress').upload(path,file,{contentType:file.type,upsert:false,cacheControl:'3600'});if(up.error)throw up.error;uploaded=true;
 check(await sb.from('progress_photos').insert({client_id:cid,storage_path:path,taken_on:date,photo_type:type}));
 progressPhotoCacheKey='';progressCompareAfter=date;await loadClient();render();message('Zdjęcie sylwetki dodane.');
 }catch(e){if(uploaded&&path){await sb.storage.from('forma-progress').remove([path]).catch(()=>{})}message('Nie udało się przesłać zdjęcia: '+e.message,true)}finally{if(button){button.disabled=false;button.textContent='Dodaj zdjęcie'}}}
async function progressDeletePhoto(id){const p=photos.find(p=>p.id===id);if(!p||!window.confirm('Usunąć wybrane zdjęcie sylwetki? Tej operacji nie można cofnąć.'))return;
 try{check(await sb.from('progress_photos').delete().eq('id',id).eq('client_id',clientId()));
 const removed=await sb.storage.from('forma-progress').remove([p.storage_path]);
 progressPhotoCacheKey='';await loadClient();render();message(removed.error?'Wpis usunięty, ale usunięcie pliku ze Storage wymaga sprawdzenia: '+removed.error.message:'Zdjęcie usunięte.');
 }catch(e){message('Nie udało się usunąć zdjęcia: '+e.message,true)}}

(async()=>{try{if(!window.supabase)throw Error('Nie udało się załadować biblioteki Supabase');const r=await fetch('/api/config',{cache:'no-store'});if(!r.ok)throw Error('Brak konfiguracji Supabase. Sprawdź zmienne Vercel i ponowne wdrożenie.');const {url,key}=await r.json();sb=window.supabase.createClient(url,key);let recovering=false;sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recovering=true;setTimeout(showNewPassword,0)}});const hash=new URLSearchParams(window.location.hash.slice(1));const query=new URLSearchParams(window.location.search);if(hash.get('type')==='recovery'||query.get('type')==='recovery'){recovering=true;showNewPassword()}else{await initSession();if(recovering)showNewPassword()}}catch(e){$('title').textContent='Konfiguracja';$('app').innerHTML=card(`<h2>Nie udało się uruchomić FORMA</h2><p class="error">${esc(e.message)}</p><p>Sprawdź wdrożenie pliku <code>api/config.js</code> na Vercel.</p>`)}})();
</script><script>if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('/sw.js').catch(()=>{});</script></body></html>
