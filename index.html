function morePage(){const menu=trainer()?[...mainTrainer.slice(3),['survey','Ankiety','list'],['addclient','Dodaj podopieczną','users']]:[['profile','Profil','user'],['progress','Dziennik progresu','chart'],['nutrition','Plan odżywiania','heart'],['home','Plan domowy','home'],['exercises','Biblioteka ćwiczeń','dumbbell'],['recipes','Biblioteka przepisów','book'],['survey','Preferencje ćwiczeń','list']];return card(`<h2>Pozostałe funkcje</h2>${menu.map(x=>`<div class="flatRow"><button class="navItem" onclick="switchTab('${x[0]}')">${ico(x[2])}<span>${esc(x[1])}</span></button></div>`).join('')}`)}
function picker(){return card(`<label>Wybrana podopieczna</label><select onchange="chooseClient(this.value)">${clients.map(c=>`<option value="${esc(c.id)}" ${c.id===selected?'selected':''}>${esc(c.full_name)} — ${esc(c.goal)}</option>`).join('')}</select>`)}async function chooseClient(id){selected=id;try{await loadClient();render()}catch(e){message(e.message,true)}}function go(t){tab=t;render()}
function addclient(){return card(`<h2>Nowa podopieczna</h2><p class="muted">Utwórz konto w Supabase Authentication → Users → Add user, a następnie profil tutaj, używając UUID utworzonego konta. Nie wpisuj hasła klientki w tym formularzu.</p><div class="formgrid">${input('UUID użytkowniczki z Authentication *','cid')}${input('Imię i nazwisko *','cname')}${input('E-mail *','cemail','email')}${input('Telefon','cphone')}<div><label>Cel treningowy</label><select id="cgoal"><option>Redukcja tkanki tłuszczowej</option><option>Budowa masy mięśniowej</option><option>Zwiększenie siły</option><option>Sprawność i zdrowie</option></select></div><div><label>Treningi tygodniowo</label><select id="cfreq"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></div>${input('Data rozpoczęcia','cstart','date',today())}</div><label>Prywatne notatki trenerki</label><textarea id="cnotes"></textarea><div style="margin-top:14px">${btn('Zapisz profil','createClient()')}</div>`)}async function createClient(){try{if(!/^[0-9a-f-]{36}$/i.test(v('cid'))||!v('cname')||!v('cemail').includes('@'))throw Error('Uzupełnij UUID, imię i poprawny e-mail.');check(await sb.from('profiles').insert({id:v('cid'),full_name:v('cname'),email:v('cemail'),phone:v('cphone')||null,role:'client',goal:v('cgoal'),weekly_sessions:number('cfreq'),start_date:v('cstart')||null,trainer_notes:v('cnotes')||null}));await load();tab='clients';render();message('Profil podopiecznej został zapisany.')}catch(e){message(e.message,true)}}
function survey(){if(trainer())return card(`<h2>Ankiety zgłoszeniowe</h2><p class="muted">Ankiety zebrane w bazie danych. Formularz publiczny przed założeniem konta wymaga osobnego, zabezpieczonego punktu API — nie otwieramy anonimowego zapisu do tabeli.</p>${questionnaires.map(q=>`<div class="row"><div><b>${esc(q.contact_name)}</b><div class="small muted">${esc(q.contact_email)} · ${esc(q.status)}</div><details><summary>Zobacz odpowiedzi</summary><pre style="white-space:pre-wrap;max-width:450px">${esc(JSON.stringify(q.answers,null,2))}</pre></details></div>`).join('')||'<p class="muted">Brak ankiet.</p>'}`);return card(`<h2>Preferencje ćwiczeń</h2><p class="muted">Zaznacz, które ćwiczenia lubisz. Odpowiedzi są zapisywane na Twoim koncie.</p>${Object.entries(groups).map(([group,names])=>`<h3 style="margin-top:20px">${group}</h3>${names.map(name=>{const ex=exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!ex)return `<div class="row"><span>${esc(name)}</span><span class="small muted">Jeszcze nie dodano do biblioteki</span></div>`;const cur=preferences.find(p=>p.exercise_id===ex.id)?.preference;return `<div class="exercise"><b>${esc(name)}</b><div class="choice">${['Lubię','Neutralne','Nie lubię','Nie znam'].map(p=>`<button class="${cur===p?'on':''}" onclick="setPref('${ex.id}','${p}')">${p}</button>`).join('')}</div></div>`}).join('')}`).join('')}`)}async function setPref(id,p){try{check(await sb.from('exercise_preferences').upsert({client_id:me.id,exercise_id:id,preference:p},{onConflict:'client_id,exercise_id'}));await loadClient();render()}catch(e){message(e.message,true)}}

function bookingDate(b){return new Date(b.starts_at).toLocaleString('pl-PL',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function bookingLabel(b){const d1=new Date(b.starts_at),d2=new Date(b.ends_at);return bookingDate(b)+'–'+d2.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}
function futureBookingsForClient(){return bookings.filter(b=>b.client_id===clientId()&&b.status==='approved')}
function unplannedBookings(){return futureBookingsForClient().filter(b=>!plans.some(p=>p.booking_id===b.id))}
function startTraining(){if(!trainer())return;const available=unplannedBookings();if(!available.length){message('Najpierw dodaj zatwierdzony termin w Kalendarzu lub edytuj wcześniej zapisany trening.',true);return}trainingDraft={mode:'new',booking_id:available[0].id,name:'',notes:'',items:[]};render()}
function editTraining(id){if(!trainer())return;const p=plans.find(x=>x.id===id);if(!p||!p.booking_id){message('Ten starszy plan nie jest powiązany z kalendarzem. Można go przeglądać, ale nie edytować w nowym formularzu.',true);return}
trainingDraft={mode:'edit',booking_id:p.booking_id,name:p.name||'',notes:p.description||'',items:planExercises.filter(e=>e.plan_id===p.id).map(e=>({exercise_id:e.exercise_id,sets_target:e.sets_target??3,reps_target:e.reps_target||'',weight_target_kg:e.weight_target_kg??0,notes:e.notes||''}))};render()}
function captureTrainingDraft(){if(!trainingDraft)return;trainingDraft.booking_id=v('trainingBooking')||trainingDraft.booking_id;trainingDraft.name=v('trainingName');trainingDraft.notes=v('trainingNotes');trainingDraft.items.forEach((x,i)=>{x.exercise_id=v('trainingExercise-'+i)||x.exercise_id;x.sets_target=v('trainingSets-'+i);x.reps_target=v('trainingReps-'+i);x.weight_target_kg=v('trainingWeight-'+i);x.notes=v('trainingExNotes-'+i)})}
function addTrainingExercise(){captureTrainingDraft();if(!exercises.length){message('Najpierw dodaj ćwiczenie do Biblioteki ćwiczeń.',true);return}trainingDraft.items.push({exercise_id:exercises[0].id,sets_target:3,reps_target:'10',weight_target_kg:0,notes:''});render()}
function removeTrainingExercise(i){captureTrainingDraft();trainingDraft.items.splice(i,1);render()}
function moveTrainingExercise(i,d){captureTrainingDraft();const j=i+d;if(j<0||j>=trainingDraft.items.length)return;[trainingDraft.items[i],trainingDraft.items[j]]=[trainingDraft.items[j],trainingDraft.items[i]];render()}
function cancelTrainingEdit(){trainingDraft=null;render()}
function trainingExerciseFields(x,i){return `<div class="trainingExc"><div class="trainingExcName"><label for="trainingExercise-${i}">Ćwiczenie ${i+1}</label><select id="trainingExercise-${i}">${exercises.map(e=>`<option value="${esc(e.id)}" ${x.exercise_id===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div><div><label for="trainingSets-${i}">Serie</label><input id="trainingSets-${i}" type="number" min="1" max="30" step="1" value="${esc(x.sets_target)}"></div><div><label for="trainingReps-${i}">Powtórzenia</label><input id="trainingReps-${i}" maxlength="40" value="${esc(x.reps_target)}"></div><div><label for="trainingWeight-${i}">Ciężar (kg)</label><input id="trainingWeight-${i}" type="number" min="0" max="9999" step="0.25" value="${esc(x.weight_target_kg)}"></div><div class="trainingExcButtons"><button type="button" title="Przesuń wyżej" aria-label="Przesuń ćwiczenie wyżej" ${i===0?'disabled':''} onclick="moveTrainingExercise(${i},-1)">↑</button><button type="button" title="Przesuń niżej" aria-label="Przesuń ćwiczenie niżej" ${i===trainingDraft.items.length-1?'disabled':''} onclick="moveTrainingExercise(${i},1)">↓</button><button type="button" title="Usuń ćwiczenie" aria-label="Usuń ćwiczenie" onclick="removeTrainingExercise(${i})">✕</button></div><div class="trainingExcNotes"><label for="trainingExNotes-${i}">Uwagi do ćwiczenia (opcjonalnie)</label><input id="trainingExNotes-${i}" value="${esc(x.notes||'')}" placeholder="Np. tempo, zakres ruchu, wskazówki"></div></div>`}
function trainingEditForm(){if(!trainingDraft)return '';const d=trainingDraft;const available=d.mode==='edit'?futureBookingsForClient().filter(b=>b.id===d.booking_id):unplannedBookings();return `<div class="trainingForm"><div class="trainingHead"><h3 style="margin:0">${d.mode==='edit'?'Edytuj trening':'Nowy trening'}</h3><span class="statusPill">Zapis do Supabase</span></div><p class="hint">Wybierz zatwierdzony termin z kalendarza, uzupełnij plan i zapisz wszystkie ćwiczenia jednym przyciskiem.</p><div class="formgrid"><div><label for="trainingBooking">Wybierz trening z kalendarza *</label><select id="trainingBooking" ${d.mode==='edit'?'disabled':''}>${available.map(b=>`<option value="${esc(b.id)}" ${b.id===d.booking_id?'selected':''}>${esc(bookingLabel(b))}</option>`).join('')}</select></div>${input('Nazwa treningu *','trainingName','text',d.name)}</div><h3>Ćwiczenia</h3>${d.items.length?d.items.map(trainingExerciseFields).join(''):'<div class="emptyState">Nie dodano ćwiczeń. Kliknij „+ Dodaj ćwiczenie”.</div>'}<button type="button" class="ghost" style="margin-top:10px" onclick="addTrainingExercise()">＋ Dodaj ćwiczenie</button><label for="trainingNotes" style="margin-top:18px">Komentarz do treningu (opcjonalnie)</label><textarea id="trainingNotes" placeholder="Opcjonalne uwagi do planu…">${esc(d.notes)}</textarea><div class="trainingActions"><button type="button" class="ghost" onclick="cancelTrainingEdit()">Anuluj</button><button type="button" id="saveTrainingButton" class="primary trainingSave" onclick="saveTrainingDraft()">✓ Zapisz trening</button></div></div>`}
function storedPlanCard(p){const b=bookings.find(x=>x.id===p.booking_id),ex=planExercises.filter(x=>x.plan_id===p.id);const label=b?displayDate(b.starts_at):'Bez przypisanego terminu';return `<details class="trainingSaved" ${p.booking_id===calendarSelectedBookingId?'open':''}><summary><div class="trainingSavedIntro"><strong>${esc(label)} · ${esc(p.name)}</strong><span class="trainingDate">${ex.length} ćwiczeń</span></div>${trainer()&&p.booking_id?`<button type="button" class="ghost trainingSavedEdit" onclick="event.preventDefault();event.stopPropagation();editTraining('${esc(p.id)}')">✎ Edytuj</button>`:''}</summary><div class="trainingSavedContent">${p.description?`<p class="hint">${esc(p.description)}</p>`:''}${ex.map(x=>`<div class="flatRow"><div><b>${esc(exercises.find(e=>e.id===x.exercise_id)?.name||'Ćwiczenie')}</b>${x.notes?`<div class="hint">${esc(x.notes)}</div>`:''}</div><span class="small">${esc(x.sets_target??'—')} serii × ${esc(x.reps_target??'—')} · ${x.weight_target_kg===null||x.weight_target_kg===undefined?'—':esc(x.weight_target_kg)} kg</span></div>`).join('')||'<div class="hint">Brak zaplanowanych ćwiczeń</div>'}</div></details>`}
function currentWeekRange(){const start=new Date();start.setHours(0,0,0,0);const day=(start.getDay()+6)%7;start.setDate(start.getDate()-day);const end=new Date(start);end.setDate(end.getDate()+7);return [start,end]}
function plan(){const isT=trainer();if(!clientId())return card('<h2>Plan treningowy</h2><div class="emptyState">Wybierz podopieczną.</div>');const c=clients.find(x=>x.id===clientId()),all=plans.filter(p=>p.booking_id&&bookings.some(b=>b.id===p.booking_id&&b.status==='approved'));const legacy=plans.filter(p=>!p.booking_id);let visible=all;

async function uploadProfileAvatar(inputEl){if(!trainer()||!inputEl.files?.length)return;const file=inputEl.files[0];
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>3*1024*1024)return message('Wybierz zdjęcie JPG, PNG lub WebP do 3 MB.',true);
 const id=clientId(),c=clients.find(x=>x.id===id);if(!c)return;
 const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'})[file.type];
 const path=`${id}/avatar_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
 try{check(await sb.storage.from('forma-avatars').upload(path,file,{contentType:file.type,upsert:false}));
  try{check(await sb.from('profiles').update({avatar_path:path}).eq('id',id))}
  catch(e){await sb.storage.from('forma-avatars').remove([path]);throw e}
  const old=c.avatar_path;c.avatar_path=path;if(old)await sb.storage.from('forma-avatars').remove([old]);
  const signed=check(await sb.storage.from('forma-avatars').createSignedUrl(path,3600));clientAvatarUrl=signed.signedUrl;
  render();message('Zdjęcie profilowe zapisane.')}
 catch(e){message('Nie udało się dodać zdjęcia: '+e.message,true)}}

/* FORMA 1.4 — analityka z wykonanych treningów, bez nowych tabel. */
let diarySection='history', strengthMetric='weight', strengthRange='3m';
let strengthSearch='', strengthMuscle='all', strengthExerciseId='';
let diaryFocusedBookingId='', diaryFocusedExerciseId='';
const strengthMetricOptions={weight:{title:'Maksymalny ciężar',unit:'kg',explanation:'Najwyższy ciężar zapisany dla ćwiczenia podczas danego treningu.'},reps:{title:'Liczba powtórzeń',unit:'powt.',explanation:'Liczba powtórzeń w serii. Analizujemy wyłącznie wpisy z jednoznaczną liczbą, np. 10.'},volume:{title:'Objętość treningowa',unit:'kg',explanation:'Suma serie × powtórzenia × ciężar. Obliczana tylko przy liczbowej wartości powtórzeń i jednakowych parametrach serii.'}};
function strengthNumber(x){const n=Number(x);return x!==null&&x!==undefined&&String(x).trim()!==''&&Number.isFinite(n)?n:null}
function strengthRepsCount(x){const value=String(x??'').trim();return /^\d+$/.test(value)?Number(value):null}
function strengthHistoryRows(){
 const now=Date.now(),raw=[];
 for(const b of bookings){
  if(b.client_id!==clientId()||b.status!=='approved'||new Date(b.ends_at).getTime()>now)continue;
  const p=plans.find(p=>p.booking_id===b.id);if(!p)continue;
  const diary=diaryEntryFor(b.id);if(diary?.status==='missed')continue;
  for(const x of planExercises.filter(x=>x.plan_id===p.id)){
   const actual=diaryActualFor(diary,x),setsCount=strengthNumber(actual.sets),weight=strengthNumber(actual.weight);
   if(actual.skipped||setsCount===null||setsCount<=0||weight===null||weight<0)continue;
   const reps=strengthRepsCount(actual.reps);
   raw.push({bookingId:b.id,planExerciseId:x.id,exerciseId:x.exercise_id,
    name:exerciseDisplayName(x),muscle:exercises.find(e=>e.id===x.exercise_id)?.muscle_group||'Inne',
    timestamp:new Date(b.starts_at).getTime(),date:fmtShortDate(b.starts_at),sets:setsCount,
    reps,repsText:String(actual.reps??''),weight,
    volume:reps===null?null:setsCount*reps*weight,
    saved:!!diary});
  }
 }
 // Jedno zestawienie na trening i ćwiczenie; powtórzone ćwiczenia sumują serie/objętość.
 const grouped=new Map();
 for(const r of raw){
  const key=r.bookingId+'|'+r.exerciseId;
  if(!grouped.has(key)){grouped.set(key,{...r,repsTexts:[r.repsText],repsDefined:r.reps!==null,volumeDefined:r.volume!==null});continue}
  const g=grouped.get(key);g.sets+=r.sets;g.weight=Math.max(g.weight,r.weight);
  if(r.reps!==null)g.reps=g.reps===null?r.reps:Math.max(g.reps,r.reps);
  else g.repsDefined=false;
  g.repsTexts.push(r.repsText);
  if(r.volume===null)g.volumeDefined=false;
  else if(g.volumeDefined)g.volume+=r.volume;
 }
 return [...grouped.values()].map(r=>({...r,reps:r.repsDefined?r.reps:null,
  volume:r.volumeDefined?r.volume:null,repsText:[...new Set(r.repsTexts)].join(' / ')})).sort((a,b)=>a.timestamp-b.timestamp);
}
function strengthExerciseOptions(rows){const map=new Map();for(const r of rows)if(!map.has(r.exerciseId))map.set(r.exerciseId,{id:r.exerciseId,name:r.name,muscle:r.muscle});return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'pl'))}
function filteredStrengthExercises(){const query=strengthSearch.trim().toLocaleLowerCase('pl');return strengthExerciseOptions(strengthHistoryRows()).filter(e=>(strengthMuscle==='all'||e.muscle===strengthMuscle)&&e.name.toLocaleLowerCase('pl').includes(query))}
function strengthRangeDate(){if(strengthRange==='all')return -Infinity;const d=new Date();d.setHours(0,0,0,0);const months={'1m':1,'3m':3,'6m':6}[strengthRange]||3;d.setMonth(d.getMonth()-months);return d.getTime()}
function formatStrength(v,max=2){if(v===null||!Number.isFinite(v))return '—';return new Intl.NumberFormat('pl-PL',{maximumFractionDigits:max}).format(v)}
function strengthMetricValue(r){return r[strengthMetric]}
function strengthChartSvg(rows){
 const pts=rows.filter(r=>strengthMetricValue(r)!==null);if(!pts.length)return '<div class="emptyState">Brak liczbowych danych do tego wykresu w wybranym okresie. Sprawdź wpisane powtórzenia lub wybierz inny zakres.</div>';
 const width=860,height=284,left=74,right=22,top=23,bottom=55,plotW=width-left-right,plotH=height-top-bottom;
 const max=Math.max(1,...pts.map(strengthMetricValue)),maxY=max*1.12;
 const minT=pts[0].timestamp,maxT=pts[pts.length-1].timestamp;
 const x=(r,i)=>minT===maxT?left+plotW/2:left+(r.timestamp-minT)/(maxT-minT)*plotW;
 const y=r=>top+plotH-(strengthMetricValue(r)/maxY)*plotH;
 const grid=[0,1,2,3,4].map(i=>{const yy=top+i*plotH/4;return `<line x1="${left}" y1="${yy}" x2="${width-right}" y2="${yy}" stroke="#e9e3db" stroke-dasharray="4 4"/><text x="${left-12}" y="${yy+4}" text-anchor="end" font-size="12" fill="#847b70">${esc(formatStrength(maxY*(1-i/4),1))}</text>`}).join('');
 const line=pts.map((r,i)=>`${x(r,i).toFixed(1)},${y(r).toFixed(1)}`).join(' ');
 const labels=pts.filter((r,i)=>i===0||i===pts.length-1||i%Math.max(1,Math.ceil(pts.length/6))===0).map(r=>`<text x="${x(r).toFixed(1)}" y="${height-24}" font-size="11" text-anchor="middle" fill="#847b70">${esc(new Date(r.timestamp).toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'}))}</text>`).join('');
 const dots=pts.map((r,i)=>`<circle cx="${x(r,i).toFixed(1)}" cy="${y(r).toFixed(1)}" r="6" fill="#a69076" stroke="white" stroke-width="2" tabindex="0" role="button" style="cursor:pointer" aria-label="${esc(r.date+' — '+formatStrength(strengthMetricValue(r))+' '+strengthMetricOptions[strengthMetric].unit+'; otwórz trening')}" onclick="openStrengthDiaryBooking('${esc(r.bookingId)}','${esc(r.planExerciseId)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openStrengthDiaryBooking('${esc(r.bookingId)}','${esc(r.planExerciseId)}')}"><title>${esc(r.date+' · '+formatStrength(strengthMetricValue(r))+' '+strengthMetricOptions[strengthMetric].unit)}</title></circle>`).join('');
 return `<div class="strengthChartWrap"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Wykres: ${esc(strengthMetricOptions[strengthMetric].title)}"><g>${grid}</g><polyline points="${line}" fill="none" stroke="#a69076" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}</svg></div>`;
}
function strengthAnalysisHTML(){
 const options=filteredStrengthExercises();if(!options.length)return '<div class="emptyState">Brak ćwiczeń pasujących do wyszukiwania i filtra.</div>';
 if(!options.some(x=>x.id===strengthExerciseId))strengthExerciseId=options[0].id;
 const ex=options.find(x=>x.id===strengthExerciseId),all=strengthHistoryRows().filter(r=>r.exerciseId===strengthExerciseId),rows=all.filter(r=>r.timestamp>=strengthRangeDate());
 const meta=strengthMetricOptions[strengthMetric],valid=rows.filter(r=>strengthMetricValue(r)!==null);
 const topStat=(label,value)=>`<div class="strengthStat"><div class="miniLabel">${label}</div><strong>${esc(value)}</strong></div>`;
 const stat=v=>v===null?'—':formatStrength(v)+(meta.unit?' '+meta.unit:'');
 const stats=valid.length?[topStat('Pierwszy wynik',stat(strengthMetricValue(valid[0]))),topStat('Ostatni wynik',stat(strengthMetricValue(valid[valid.length-1]))),topStat('Najlepszy wynik',stat(Math.max(...valid.map(strengthMetricValue))))].join(''):[topStat('Pierwszy wynik','—'),topStat('Ostatni wynik','—'),topStat('Najlepszy wynik','—')].join('');
 const tabs=(items,active,handler,extra='')=>`<div class="strengthTabs ${extra}">${items.map(([id,label])=>`<button type="button" class="${active===id?'active':''} ${extra==='strengthRangeTabs'?'rangeBtn':''}" aria-pressed="${active===id}" onclick="${handler}('${id}')">${label}</button>`).join('')}</div>`;
 const history=rows.slice().reverse().map(r=>`<tr data-booking="${esc(r.bookingId)}" tabindex="0" role="button" aria-label="Otwórz trening ${esc(r.date)}" onclick="openStrengthDiaryBooking('${esc(r.bookingId)}','${esc(r.planExerciseId)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openStrengthDiaryBooking('${esc(r.bookingId)}','${esc(r.planExerciseId)}')}"><td><span class="resultLink">${esc(r.date)} ↗</span></td><td>${esc(formatStrength(r.sets,0))}</td><td>${esc(r.repsText||'—')}</td><td>${esc(formatStrength(r.weight))} kg</td><td>${r.volume===null?'—':esc(formatStrength(r.volume))+' kg'}</td><td>${r.saved?'Zapis dziennika':'Według planu'}</td></tr>`).join('');
 return `<div class="strengthAnalysis"><div class="sectionHeading" style="margin-top:18px"><div><h3 style="margin:0">${esc(ex.name)} — analiza wyników</h3><p class="hint" style="margin:4px 0 0">${esc(ex.muscle)} · ${all.length} treningów w historii</p></div></div>
 <div class="miniLabel">Rodzaj wykresu</div>${tabs([['weight','Ciężar'],['reps','Powtórzenia'],['volume','Objętość']],strengthMetric,'strengthMetricChanged')}
 <div class="miniLabel">Zakres czasu</div>${tabs([['1m','1 mies.'],['3m','3 mies.'],['6m','6 mies.'],['all','Całość']],strengthRange,'strengthRangeChanged','strengthRangeTabs')}
 <h3 style="margin:19px 0 4px">${meta.title}</h3><p class="strengthSummaryNote">${meta.explanation}</p>
 <div class="strengthStats">${stats}</div>${strengthChartSvg(rows)}
 <h3 style="margin-top:23px">Historia wyników</h3><p class="hint">Kliknij datę lub wiersz, aby otworzyć trening. Korekty wykonania może zapisać wyłącznie Zuzia.</p>
 <div class="strengthTableWrap"><table class="strengthTable"><thead><tr><th>Data</th><th>Serie</th><th>Powtórzenia</th><th>Ciężar</th><th>Objętość</th><th>Źródło</th></tr></thead><tbody>${history||'<tr><td colspan="6">Brak wyników w tym okresie.</td></tr>'}</tbody></table></div>
 <p class="strengthSummaryNote">Wyniki oznaczone „Według planu” są uznane za wykonane do czasu korekty Zuzi w Dzienniku treningowym. Dla zakresów typu „8–12” nie wyliczamy powtórzeń ani objętości, aby nie zgadywać.</p></div>`;
}
function strengthPickerOptions(){const opts=filteredStrengthExercises();return opts.map(x=>`<option value="${esc(x.id)}" ${x.id===strengthExerciseId?'selected':''}>${esc(x.name)}</option>`).join('')}
function strengthFilterChanged(){strengthSearch=$('strengthSearch')?.value||'';strengthMuscle=v('strengthMuscle')||'all';strengthExerciseId=filteredStrengthExercises().some(e=>e.id===strengthExerciseId)?strengthExerciseId:(filteredStrengthExercises()[0]?.id||'');const sel=$('strengthExerciseSelect');if(sel){sel.innerHTML=strengthPickerOptions();sel.disabled=!filteredStrengthExercises().length}renderStrengthAnalysis()}

function strengthExerciseChanged(){strengthExerciseId=v('strengthExerciseSelect');renderStrengthAnalysis()}
function strengthMetricChanged(value){strengthMetric=value;renderStrengthAnalysis()}

 const list=strengthExerciseOptions(strengthHistoryRows());if(!list.length)return card('<h2>Progres siłowy</h2><div class="emptyState">Nie ma jeszcze zakończonych treningów z zapisanymi ćwiczeniami. Wyniki pojawią się automatycznie po zakończeniu pierwszego treningu.</div>');
 const muscles=[...new Set(list.map(e=>e.muscle))].sort((a,b)=>a.localeCompare(b,'pl'));const filtered=filteredStrengthExercises();
 if(!filtered.some(e=>e.id===strengthExerciseId))strengthExerciseId=filtered[0]?.id||'';
 return card(`<div class="sectionHeading"><h2>Progres siłowy</h2><span class="statusPill">${list.length} ćwiczeń</span></div><p class="hint">Analizuj wyniki zakończonych treningów — zgodnie z planem lub korektami Zuzi.</p>

 </div>

 const el=$('diaryExercise-'+bookingId+'-'+exerciseId)||$('diaryWorkout-'+bookingId);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});const details=$('diaryWorkout-'+bookingId);if(details)details.open=true}else window.scrollTo({top:0,behavior:'smooth'});

 const finished=bookings.filter(b=>b.client_id===clientId()&&b.status==='approved'&&new Date(b.ends_at).getTime()<=Date.now()).sort((a,b)=>new Date(b.starts_at)-new Date(a.starts_at));
 const header=card(`<div class="sectionHeading"><h2>Dziennik treningowy</h2><span class="statusPill">${finished.length} zakończonych treningów</span></div>

 return diarySection==='strength'?`${header}${strengthOverview()}`:`${header}${card(`${finished.length?finished.map(diaryBookingCard).join(''):'<div class="emptyState">Nie ma jeszcze zakończonych terminów treningowych.</div>'}`)}`;

function diaryBookingCard(b){const p=plans.find(x=>x.booking_id===b.id),ex=p?planExercises.filter(x=>x.plan_id===p.id):[],entry=diaryEntryFor(b.id),key=b.id;
 return `<details id="diaryWorkout-${esc(key)}" class="diaryWorkout ${key===diaryFocusedBookingId?'highlightTarget':''}" ${b.id===calendarSelectedBookingId||key===diaryFocusedBookingId?'open':''}><summary><div><strong>${esc(fmtShortDate(b.starts_at))} · ${esc(p?.name||'Trening bez planu')}</strong><div class="hint">${esc(fmtTime(b.starts_at))}–${esc(fmtTime(b.ends_at))} · ${entry?.status==='missed'?'Nieodbyty':'Domyślnie odbyty'}</div></div><span class="statusPill">${ex.length} ćwiczeń</span></summary>
 <div class="diaryInside"><label for="diaryStatus-${key}">Status treningu</label><select id="diaryStatus-${key}" onchange="toggleDiaryExercises('${key}')"><option value="completed" ${entry?.status!=='missed'?'selected':''}>Odbyty</option><option value="missed" ${entry?.status==='missed'?'selected':''}>Nieodbyty</option></select>

function toggleDiaryExercises(id){const el=$('diaryExercises-'+id);if(el)el.hidden=v('diaryStatus-'+id)==='missed'}
async function saveDiaryBooking(id){if(!trainer())return message('Tylko trenerka może poprawiać wykonane treningi.',true);const b=bookings.find(x=>x.id===id&&x.client_id===clientId()&&new Date(x.ends_at).getTime()<=Date.now());if(!b)return message('Trening nie jest jeszcze zakończony.',true);
 const p=plans.find(x=>x.booking_id===id),ex=p?planExercises.filter(x=>x.plan_id===p.id):[],actual={};

  if(status==='completed')for(const x of ex){const k=id+'-'+x.id,setsNum=Number(v('diarySets-'+k)),weight=Number(v('diaryWeight-'+k)),reps=v('diaryReps-'+k);
   if(!Number.isInteger(setsNum)||setsNum<0||setsNum>30||!Number.isFinite(weight)||weight<0||weight>9999||reps.length>40)throw Error('Sprawdź serie, powtórzenia i ciężar ćwiczeń.');
   actual[x.id]={exercise_id:x.exercise_id,sets:setsNum,reps,weight,skipped:!!$('diarySkip-'+k)?.checked,comment:v('diaryNote-'+k)};
  }

  check(await sb.from('forma_diary_entries').upsert(payload,{onConflict:'booking_id'}));
  diaryEntries=diaryEntries.filter(x=>x.booking_id!==id).concat([payload]);calendarSelectedBookingId=id;render();message('Wyniki treningu zapisane.')
 }catch(e){message('Nie udało się zapisać dziennika: '+e.message,true)}}

function progressChartSvg(rows,key,unit){if(!rows.length)return '<div class="progressEmpty">Brak pomiarów w wybranym okresie. Wybierz „Całość” lub dodaj wpis.</div>';
 const filtered=rows.slice().sort(progressSort),values=filtered.map(r=>Number(r[key])),min=Math.min(...values),max=Math.max(...values),pad=Math.max((max-min)*0.16,unit==='kg'?0.5:0.3),low=Math.max(0,min-pad),high=max+pad,lo=Number.isFinite(low)?low:0,hi=high>lo?high:lo+1;
 const w=760,h=252,plotLeft=61,plotRight=737,plotTop=23,plotBottom=204;

 const count=Math.min(5,filtered.length),axis=Array.from({length:count},(_,i)=>{const idx=count===1?0:Math.round(i*(filtered.length-1)/(count-1)),r=filtered[idx],px=xAt(dates[idx],idx);return `<text x="${px}" y="228" font-size="10.5" text-anchor="middle" fill="#857b70">${esc(progressDateLabel(r.measured_on).slice(0,5))}</text>`}).join('');

}

async function hydrateProgressPhotos(force=false){const container=$('progressPhotoDisplay');if(!container||tab!=='progress'||progressSection!=='photos')return;

 ${gallery.length?`<div class="progressGallery">${gallery.map(p=>`<div class="progressPhotoTile">${progressPhotoSignedUrls[p.id]?`<a href="${esc(progressPhotoSignedUrls[p.id])}" target="_blank" rel="noopener noreferrer" aria-label="Powiększ zdjęcie ${esc(progressDateLabel(p.taken_on))}"><img src="${esc(progressPhotoSignedUrls[p.id])}" loading="lazy" alt="${esc(progressPhotoLabels[p.photo_type]||'Sylwetka')} — ${progressDateLabel(p.taken_on)}"></a>`:'<div class="progressEmptyPhoto">Brak podglądu zdjęcia</div>'}<footer><div><strong>${progressPhotoLabels[p.photo_type]||'Inne'}</strong><small>${progressDateLabel(p.taken_on)}</small></div><button type="button" onclick="progressDeletePhoto('${esc(p.id)}')" aria-label="Usuń zdjęcie">Usuń</button></footer></div>`).join('')}</div>`:'<div class="progressEmpty">Brak zdjęć o wybranym typie.</div>'}`;

async function progressUploadPhoto(event){event.preventDefault();const button=$('progressPhotoUploadButton');let path='',uploaded=false;try{
 const file=$('progressPhotoFile')?.files?.[0],cid=clientId(),date=v('progressPhotoDate'),type=v('progressPhotoType');

 if(button){button.disabled=true;button.textContent='Zapisywanie…'}

 check(await sb.from('progress_photos').insert({client_id:cid,storage_path:path,taken_on:date,photo_type:type}));
 progressPhotoCacheKey='';progressCompareAfter=date;await loadClient();render();message('Zdjęcie sylwetki dodane.');
 }catch(e){if(uploaded&&path){await sb.storage.from('forma-progress').remove([path]).catch(()=>{})}message('Nie udało się przesłać zdjęcia: '+e.message,true)}finally{if(button){button.disabled=false;button.textContent='Dodaj zdjęcie'}}}
async function progressDeletePhoto(id){const p=photos.find(p=>p.id===id);if(!p||!window.confirm('Usunąć wybrane zdjęcie sylwetki? Tej operacji nie można cofnąć.'))return;

async function loadClient(){
 measurements=[];plans=[];planExercises=[];sets=[];sessions=[];preferences=[];photos=[];diaryEntries=[];
 f16WorkoutFeedback=[];f16ExerciseFeedback=[];f16FeedbackReady=true;
 clientPrivateNote='';clientAvatarUrl='';if(!clientId())return;
 const id=clientId();const res=await Promise.all([
  sb.from('body_measurements').select('*').eq('client_id',id).order('measured_on'),
  sb.from('training_plans').select('*').eq('client_id',id).order('created_at',{ascending:false}),
  sb.from('workout_sessions').select('*').eq('client_id',id).order('started_at',{ascending:false}),
  sb.from('exercise_preferences').select('*').eq('client_id',id),
  sb.from('progress_photos').select('*').eq('client_id',id).order('taken_on',{ascending:false}),
  sb.from('forma_diary_entries').select('*').eq('client_id',id)
 ]);
 [measurements,plans,sessions,preferences,photos,diaryEntries]=res.map(check);
 if(plans.length)planExercises=check(await sb.from('plan_exercises').select('*').in('plan_id',plans.map(x=>x.id)).order('sort_order'));
 if(sessions.length)sets=check(await sb.from('workout_sets').select('*').in('session_id',sessions.map(x=>x.id)));
 if(trainer()){
  const r=await sb.from('forma_trainer_notes').select('notes').eq('client_id',id).maybeSingle();
  clientPrivateNote=check(r)?.notes||'';
 }
 const reviews=await Promise.all([
  sb.from('forma_workout_feedback').select('*').eq('client_id',id),
  sb.from('forma_exercise_feedback').select('*').eq('client_id',id)
 ]);
 if(reviews.every(r=>!r.error)){
  f16WorkoutFeedback=reviews[0].data||[];
  f16ExerciseFeedback=reviews[1].data||[];
 }else f16FeedbackReady=false;
 const c=trainer()?clients.find(x=>x.id===id):me;
 if(c?.avatar_path){const r=await sb.storage.from('forma-avatars').createSignedUrl(c.avatar_path,3600);
  if(!r.error)clientAvatarUrl=r.data.signedUrl;
 }
 await f18LoadClientData();
}

function f16CopyIntoDraft(all){
 if(!trainingDraft||!trainer())return;const source=bookings.find(b=>b.id===f16CopyBookingId),plan=source&&f16PlanForBooking(source);if(!plan)return;
 if(!all&&!Object.values(f16CopySelected).some(Boolean))return message('Zaznacz ćwiczenia do skopiowania.',true);

 const copied=f16PlanExercises(plan).filter(x=>all||f16CopySelected[x.id]).map(x=>{
  const a=useActual?diaryActualFor(entry,x):null;const use=a&&!a.skipped;
  return {exercise_id:x.exercise_id,sets_target:use?a.sets:x.sets_target,reps_target:use?String(a.reps):String(x.reps_target||''),weight_target_kg:use?a.weight:x.weight_target_kg,notes:x.notes||''};
 }).filter(x=>{const e=exercises.find(e=>e.id===x.exercise_id);return !!e&&!e.archived_at});
 if(!copied.length)return message('Nie ma aktywnych ćwiczeń do skopiowania.',true);

}

 catch(e){message('Nie udało się zapisać opinii: '+e.message,true)}
}

let f17Expanded=0, f17HistoryCount=5, f17Selected={}, f17CopyMode='actual', f17MobilePane='editor', f17DraftRef=null;

function f17CurrentDraft(){
 if(!trainingDraft)return;

// wyłącznie otwartą kartę: zwinięte ćwiczenia zachowują wartości w pamięci.
function captureTrainingDraft(){
 if(!trainingDraft)return;
 if($('trainingName'))trainingDraft.name=$('trainingName').value;
 if($('trainingNotes'))trainingDraft.notes=$('trainingNotes').value;
 trainingDraft.items.forEach((x,i)=>{
  if($('trainingExercise-'+i))x.exercise_id=$('trainingExercise-'+i).value;
  if($('trainingSets-'+i))x.sets_target=$('trainingSets-'+i).value;
  if($('trainingReps-'+i))x.reps_target=$('trainingReps-'+i).value;
  if($('trainingWeight-'+i))x.weight_target_kg=$('trainingWeight-'+i).value;
  if($('trainingExNotes-'+i))x.notes=$('trainingExNotes-'+i).value;
 });
}
function f17Flip(index){captureTrainingDraft();f17Expanded=f17Expanded===index?-1:index;render()}
function f17ChangeExercise(index,id){captureTrainingDraft();trainingDraft.items[index].exercise_id=id;render()}
function f17AddExercise(){captureTrainingDraft();const live=f20SelectableExercises('personal');if(!live.length)return message('Dodaj najpierw ćwiczenie do biblioteki.',true);
 trainingDraft.items.push({exercise_id:live[0].id,sets_target:3,reps_target:'10',weight_target_kg:0,notes:''});f17Expanded=trainingDraft.items.length-1;f17MobilePane='editor';render();}
function f17MoveExercise(index,direction){captureTrainingDraft();const to=index+direction;if(to<0||to>=trainingDraft.items.length)return;
 const a=trainingDraft.items;[a[index],a[to]]=[a[to],a[index]];f17Expanded=to;render()}
function f17RemoveExercise(index){captureTrainingDraft();trainingDraft.items.splice(index,1);f17Expanded=trainingDraft.items.length?Math.min(index,trainingDraft.items.length-1):-1;render()}

function f17SelectedCount(){return Object.values(f17Selected).filter(Boolean).length}
function f17SetSelected(key,checked){f17Selected[key]=checked;const el=$('f17SelectionCount');if(el)el.textContent=f17SelectedCount();}
function f17CopyData(x,b){
 const e=diaryEntryFor(b.id),a=f17CopyMode==='actual'?diaryActualFor(e,x):null;
 if(a?.skipped)return null;
 return {exercise_id:x.exercise_id,sets_target:a?Number(a.sets):Number(x.sets_target),reps_target:a?String(a.reps):String(x.reps_target||''),weight_target_kg:a?Number(a.weight):Number(x.weight_target_kg??0),notes:x.notes||''};
}
function f17CopyWhole(bookingId){if(!trainer()||!trainingDraft)return;const b=f17HistoryCandidates().find(b=>b.id===bookingId);if(!b)return;
 const p=f16PlanForBooking(b);if(!p)return;
 const ex=f16PlanExercises(p);let archived=0,skipped=0;
 const copy=ex.map(x=>{if(!validExerciseRows().some(e=>e.id===x.exercise_id)){archived++;return null}const d=f17CopyData(x,b);if(!d)skipped++;return d}).filter(Boolean);
 if(!copy.length)return message('Ten trening nie zawiera ćwiczeń możliwych do skopiowania.',true);
 if(trainingDraft.items.length&&!window.confirm('Zastąpić ćwiczenia aktualnego planu wybranym wcześniejszym treningiem?'))return;
 captureTrainingDraft();trainingDraft.items=copy;trainingDraft.name=p.name||trainingDraft.name;trainingDraft.notes=p.description||'';f17Expanded=0;f17Selected={};f17MobilePane='editor';render();
 message('Skopiowano cały trening ('+copy.length+' ćwiczeń).'+(archived?' Pominięto archiwalne: '+archived+'.':'')+(skipped?' Pominięto niewykonane: '+skipped+'.':'')+' Sprawdź parametry i zapisz plan.');
}
function f17CopySelected(){if(!trainer()||!trainingDraft)return;captureTrainingDraft();const selectedKeys=Object.entries(f17Selected).filter(([,flag])=>flag).map(([key])=>key);
 if(!selectedKeys.length)return message('Zaznacz ćwiczenia w historii.',true);
 let archived=0,skipped=0;const copy=[];
 for(const b of f17HistoryCandidates().slice(0,f17HistoryCount)){
  const p=f16PlanForBooking(b);if(!p)continue;
  for(const x of f16PlanExercises(p)){
   if(!selectedKeys.includes(b.id+':'+x.id))continue;
   if(!validExerciseRows().some(e=>e.id===x.exercise_id)){archived++;continue}
   const d=f17CopyData(x,b);if(!d){skipped++;continue}copy.push(d);
  }
 }
 if(!copy.length)return message('Zaznaczone ćwiczenia nie mogą zostać skopiowane.',true);
 trainingDraft.items.push(...copy);f17Expanded=trainingDraft.items.length-copy.length;f17Selected={};f17MobilePane='editor';render();
 message('Dodano '+copy.length+' ćwiczeń z historii.'+(archived?' Pominięto archiwalne: '+archived+'.':'')+(skipped?' Pominięto niewykonane: '+skipped+'.':''));
}

 <div class="f17Fields3"><div class="f17LabelGroup"><label for="trainingSets-${i}">Serie</label><input id="trainingSets-${i}" type="number" min="1" max="30" step="1" value="${esc(x.sets_target)}"></div><div class="f17LabelGroup"><label for="trainingReps-${i}">Powtórzenia</label><input id="trainingReps-${i}" maxlength="40" value="${esc(x.reps_target)}"></div><div class="f17LabelGroup"><label for="trainingWeight-${i}">Ciężar (kg)</label><input id="trainingWeight-${i}" type="number" min="0" max="9999" step="0.25" value="${esc(x.weight_target_kg)}"></div></div>

async function f18LoadClientData(){
 f18HomePlan=null;f18HomeExercises=[];f18HomeSessions=[];f18Opinions=[];f18Discomfort=[];
 f18WorkoutComments=[];f18ExerciseComments=[];f18DataReady=true;f18DataError='';
 const id=clientId();if(!id)return;
 const queries=[
   sb.from('forma_home_plans').select('*').eq('client_id',id).maybeSingle(),
   sb.from('forma_home_plan_exercises').select('*').eq('client_id',id).order('sort_order'),
   sb.from('forma_exercise_opinions').select('*').eq('client_id',id),
   sb.from('forma_exercise_discomfort_events').select('*').eq('client_id',id).order('reported_at',{ascending:false}),
   sb.from('forma_training_comments').select('*').eq('client_id',id),
   sb.from('forma_training_exercise_comments').select('*').eq('client_id',id)
 ];
 queries.push(sb.from('forma_home_sessions').select('*').eq('client_id',id).order('starts_at'));
 const res=await Promise.all(queries);
 const failed=res.find(x=>x.error);
 if(failed){f18DataReady=false;f18DataError=failed.error.message||'Brak tabel FORMA 1.8';return}
 f18HomePlan=res[0].data||null;f18HomeExercises=res[1].data||[];
 f18Opinions=res[2].data||[];f18Discomfort=res[3].data||[];
 f18WorkoutComments=res[4].data||[];f18ExerciseComments=res[5].data||[];
 f18HomeSessions=res[6].data||[];
}

function f19ShowCalendarHover(id,anchor){
 if(trainer()||isPhoneCalendar())return;
 const d=f19CalendarSummary(id);if(!d||!anchor)return;
 f19CloseCalendarPopup();
 const popup=document.createElement('div');popup.className='f19CalPopover';popup.setAttribute('role','tooltip');popup.innerHTML=f19PopupContents(d,false);
 document.body.appendChild(popup);f19CalendarPopup=popup;
 popup.addEventListener('mouseenter',()=>{if(f19HoverCloseTimer){clearTimeout(f19HoverCloseTimer);f19HoverCloseTimer=null}});
 popup.addEventListener('mouseleave',()=>f19ScheduleHoverClose());
 const r=anchor.getBoundingClientRect(),w=popup.offsetWidth,h=popup.offsetHeight,margin=10;
 const right=r.right+margin,left=r.left-w-margin;
 const side=right+w+margin<=innerWidth?'right':left>=margin?'left':'below';
 const x=side==='right'?right:side==='left'?left:Math.min(innerWidth-w-margin,Math.max(margin,r.left));
 const baseY=side==='below'?r.bottom+margin:r.top;
 const y=Math.max(margin,Math.min(baseY,innerHeight-h-margin));popup.style.left=x+'px';popup.style.top=y+'px';
}

function f18ClientHistory(){

 const home=f18HomeSessions.filter(h=>upcoming?new Date(h.ends_at).getTime()>now:new Date(h.ends_at).getTime()<=now)

 const all=[...personal,...home].sort((a,b)=>upcoming?a.time-b.time:b.time-a.time);

 ${f18HistoryFilter==='home'?f18HistoryHomePlan():''}
 ${visible.length?visible.map(x=>x.kind==='personal'?(upcoming?f19UpcomingPersonalCard(x.b):f18PersonalHistoryCard(x.b)):(upcoming?f19UpcomingHomeCard(x.h):f18HomeHistoryCard(x.h))).join(''):`<div class="emptyState">${upcoming?'Brak nadchodzących treningów':'Brak zakończonych treningów'} dla wybranego filtra.</div>`}`);

function f18MyItems(){
 const found=new Map();
 for(const p of plans){const b=bookings.find(b=>b.id===p.booking_id&&b.status==='approved'&&b.client_id===clientId());if(!b)continue;
  for(const x of f16PlanExercises(p)){if(!x.exercise_id)continue;
   let item=found.get(x.exercise_id);if(!item){item={id:x.exercise_id,name:exerciseDisplayName(x),group:exercises.find(e=>e.id===x.exercise_id)?.muscle_group||'',done:false,planned:false,home:false};found.set(x.exercise_id,item)}
   if(new Date(b.ends_at)<=new Date())item.done=true;else item.planned=true;
  }
 }
 for(const x of f18HomeExercises){if(!x.exercise_id)continue;
  if(!found.has(x.exercise_id))found.set(x.exercise_id,{id:x.exercise_id,name:x.exercise_name_snapshot,group:exercises.find(e=>e.id===x.exercise_id)?.muscle_group||'',done:false,planned:false,home:true});
  else found.get(x.exercise_id).home=true;
 }
 for(const h of f18HomeSessions){for(const x of f20HomeItems(h)){
  if(!x.exercise_id)continue;
  if(!found.has(x.exercise_id))found.set(x.exercise_id,{id:x.exercise_id,name:x.exercise_name_snapshot||exercises.find(e=>e.id===x.exercise_id)?.name||'Ćwiczenie',group:exercises.find(e=>e.id===x.exercise_id)?.muscle_group||'',done:false,planned:false,home:true});
  const e=found.get(x.exercise_id);e.home=true;if(new Date(h.ends_at)<=new Date())e.done=true;else e.planned=true;
 }}
 return [...found.values()].sort((a,b)=>a.name.localeCompare(b.name,'pl'));
}

function f18Events(id){return f18Discomfort.filter(x=>x.exercise_id===id)}
function f18ActiveEvent(id){return f18Events(id).find(x=>!x.discussed_at&&!x.resolved_at)}
/* FORMA 1.9.1 — niezależne filtry w „Moje ćwiczenia”.
   „Najbliższy trening” oznacza JEDEN najwcześniejszy przyszły termin
   (z Zuzią lub domowy), nie wszystkie przyszłe plany. */
function f19MyNextExerciseIds(){
 const uid=clientId(),now=Date.now();
 const futurePersonal=bookings.filter(b=>b.client_id===uid&&b.status==='approved'&&new Date(b.starts_at).getTime()>now)
  .map(b=>({kind:'personal',time:new Date(b.starts_at).getTime(),booking:b}));
 const futureHome=f18HomeSessions.filter(h=>h.client_id===uid&&new Date(h.starts_at).getTime()>now)
  .map(h=>({kind:'home',time:new Date(h.starts_at).getTime(),home:h}));
 const next=[...futurePersonal,...futureHome].sort((a,b)=>a.time-b.time)[0];
 if(!next)return new Set();
 const rows=next.kind==='home'?f20HomeItems(next.home):
  (f16PlanForBooking(next.booking)?f16PlanExercises(f16PlanForBooking(next.booking)):[]);
 return new Set(rows.map(e=>e.exercise_id).filter(Boolean));
}
function f19MyFilteredItems(allItems){
 const q=f18MySearch.trim().toLocaleLowerCase('pl');
 const upcoming=f18MyUpcomingOnly?f19MyNextExerciseIds():null;
 return allItems.filter(ex=>{
  const rating=f18Opinion(ex.id)?.rating;
  return (!q||ex.name.toLocaleLowerCase('pl').includes(q))
   &&(f18MyMuscle==='all'||(ex.group||'Bez kategorii')===f18MyMuscle)
   &&(f18MyRatingFilter==='all'||(f18MyRatingFilter==='rated'?(rating!==null&&rating!==undefined):(rating===null||rating===undefined)))
   &&(!f18MyDiscomfortOnly||!!f18Opinion(ex.id)?.discomfort)
   &&(!upcoming||upcoming.has(ex.id));
 });
}

   istniejące terminy i ich własne ćwiczenia. Każda sesja ma osobny snapshot. */
let f20ClientHomeDraft=null;

function f20HomeInputItems(rows){return (rows||[]).map(x=>({
 exercise_id:x.exercise_id||'',sets_target:Number(x.sets_target??3),
 reps_target:String(x.reps_target??'10'),weight_target_kg:Number(x.weight_target_kg??0),
 notes:String(x.notes||'')
}))}
function f20HomeDateFields(prefix,d){return `<div class="formgrid f20HomeDateFields"><div><label for="${prefix}Date">Data *</label><input id="${prefix}Date" type="date" required value="${esc(d.date)}"></div><div><label for="${prefix}From">Od *</label><input id="${prefix}From" type="time" required value="${esc(d.from)}"></div><div><label for="${prefix}To">Do *</label><input id="${prefix}To" type="time" required value="${esc(d.to)}"></div></div>`}
function f20HomeDateDraft(h){const now=new Date(),base=h?new Date(h.starts_at):new Date(now.getTime()+86400000);
 if(!h)base.setHours(18,0,0,0);
 const end=h?new Date(h.ends_at):new Date(base.getTime()+3600000);
 return {date:localDateTime(base).slice(0,10),from:localDateTime(base).slice(11,16),to:localDateTime(end).slice(11,16)};
}
function f20ValidHomeDraft(d){
 if(!d||d.name.trim().length<2||d.name.length>120||d.notes.length>3000||!d.items.length||d.items.length>50)return 'Wpisz nazwę i dodaj 1–50 ćwiczeń.';
 if(d.items.some(x=>!x.exercise_id||!Number.isInteger(Number(x.sets_target))||Number(x.sets_target)<1||Number(x.sets_target)>30||!String(x.reps_target).trim()||String(x.reps_target).length>40||!Number.isFinite(Number(x.weight_target_kg))||Number(x.weight_target_kg)<0||Number(x.weight_target_kg)>9999))return 'Sprawdź serie, powtórzenia i ciężary.';
 const start=new Date(d.date+'T'+d.from+':00'),end=new Date(d.date+'T'+d.to+':00');
 if(!d.date||!d.from||!d.to||!Number.isFinite(start.getTime())||!Number.isFinite(end.getTime())||start<=new Date()||end<=start||end-start>21600000)return 'Wybierz przyszły termin oraz poprawne godziny (maksymalnie 6 godzin).';
 return '';
}
function f20TrainerHomeStart(id=''){
 if(!trainer()||!clientId())return;
 const h=id?f18HomeSessions.find(x=>x.id===id&&x.client_id===clientId()):null;
 if(id&&!h)return message('Nie znaleziono treningu domowego.',true);
 if(h&&new Date(h.starts_at)<=new Date())return message('Zakończonego terminu domowego nie edytujemy.',true);
 const date=f20HomeDateDraft(h);
 const seed=h?(f20HomeItems(h).length?f20HomeItems(h):f18HomeExercises):f18HomeExercises;
 const defaultEx=f20SelectableExercises('home')[0];
 f18HomeDraft={sessionId:h?.id||null,name:h?.title||f18HomePlan?.name||'Trening domowy',notes:h?.notes_snapshot||(!h?f18HomePlan?.notes:'')||'',...date,
   items:f20HomeInputItems(seed.length?seed:defaultEx?[{exercise_id:defaultEx.id,sets_target:3,reps_target:'10',weight_target_kg:0,notes:''}]:[])};
 f18HomeEditing=true;f18HomeExpanded=0;render();window.scrollTo({top:0,behavior:'smooth'});
}

  item.exercise_id=v('f18HomeEx-'+i);item.sets_target=Number(v('f18HomeSets-'+i));item.reps_target=v('f18HomeReps-'+i);
  item.weight_target_kg=Number(v('f18HomeWeight-'+i));item.notes=v('f18HomeItemNote-'+i);
 }});

 <div class="f17Fields3"><div><label>Serie</label><input id="f18HomeSets-${i}" type="number" min="1" max="30" value="${esc(x.sets_target)}"></div><div><label>Powtórzenia</label><input id="f18HomeReps-${i}" maxlength="40" value="${esc(x.reps_target)}"></div><div><label>Ciężar (kg)</label><input id="f18HomeWeight-${i}" type="number" min="0" max="9999" step="0.25" value="${esc(x.weight_target_kg)}"></div></div>

 d.items.forEach((x,i)=>{if($('f20ClientEx-'+i)){
  x.exercise_id=v('f20ClientEx-'+i);x.sets_target=Number(v('f20ClientSets-'+i));x.reps_target=v('f20ClientReps-'+i);x.weight_target_kg=Number(v('f20ClientWeight-'+i));x.notes=v('f20ClientNote-'+i);
 }});
}
function f20ClientHomeAdd(){f20ClientHomeCapture();const e=validExerciseRows()[0];if(!e)return message('Brak dostępnych ćwiczeń.',true);
 f20ClientHomeDraft.items.push({exercise_id:e.id,sets_target:3,reps_target:'10',weight_target_kg:0,notes:''});f20RenderClientHomeModal();}
function f20ClientHomeRemove(i){f20ClientHomeCapture();if(f20ClientHomeDraft.items.length<2)return;
 f20ClientHomeDraft.items.splice(i,1);f20RenderClientHomeModal();}
function f20ClientHomeMove(i,delta){f20ClientHomeCapture();const j=i+delta,a=f20ClientHomeDraft.items;if(j<0||j>=a.length)return;
 [a[i],a[j]]=[a[j],a[i]];f20RenderClientHomeModal();}
function f20ClientHomeClose(){document.getElementById('f20HomeModal')?.remove();f20ClientHomeDraft=null;document.removeEventListener('keydown',f20ClientHomeEscape)}
function f20ClientHomeEscape(e){if(e.key==='Escape')f20ClientHomeClose()}
function f20RenderClientHomeModal(){const d=f20ClientHomeDraft;if(!d)return;
 document.getElementById('f20HomeModal')?.remove();
 const modal=document.createElement('div');modal.id='f20HomeModal';modal.className='f20HomeBackdrop';
 modal.innerHTML=`<div class="f20HomeDialog" role="dialog" aria-modal="true" aria-label="Edycja treningu domowego"><div class="f20HomeDialogHead"><div><span class="miniLabel">TWÓJ TRENING W DOMU</span><h2>Edytuj trening i termin</h2><p class="hint">Zuzia dodała trening. Możesz dopasować jego termin i ćwiczenia.</p></div><button type="button" class="f19Close" onclick="f20ClientHomeClose()" aria-label="Zamknij">×</button></div>
 <div class="f20HomeDialogBody"><label for="f20ClientTitle">Nazwa treningu</label><input id="f20ClientTitle" maxlength="120" value="${esc(d.name)}">${f20HomeDateFields('f20Client',d)}
 <div class="f20HomeDialogHeading"><h3>Ćwiczenia (${d.items.length})</h3><button class="ghost" type="button" onclick="f20ClientHomeAdd()">＋ Dodaj ćwiczenie</button></div>
 ${d.items.map((x,i)=>`<div class="f20ClientEx"><div class="f20ClientExHead"><strong>${i+1}. Ćwiczenie</strong><div><button type="button" class="ghost" ${i===0?'disabled':''} onclick="f20ClientHomeMove(${i},-1)" aria-label="Przesuń wyżej">↑</button><button type="button" class="ghost" ${i===d.items.length-1?'disabled':''} onclick="f20ClientHomeMove(${i},1)" aria-label="Przesuń niżej">↓</button><button type="button" class="ghost" ${d.items.length===1?'disabled':''} onclick="f20ClientHomeRemove(${i})" aria-label="Usuń ćwiczenie">×</button></div></div>
 <label for="f20ClientEx-${i}">Nazwa ćwiczenia</label><select id="f20ClientEx-${i}">${validExerciseRows().map(e=>`<option value="${esc(e.id)}" ${e.id===x.exercise_id?'selected':''}>${esc(e.name)}</option>`).join('')}</select>
 <div class="f20ClientExGrid"><div><label for="f20ClientSets-${i}">Serie</label><input id="f20ClientSets-${i}" type="number" min="1" max="30" value="${esc(x.sets_target)}"></div><div><label for="f20ClientReps-${i}">Powtórzenia</label><input id="f20ClientReps-${i}" maxlength="40" value="${esc(x.reps_target)}"></div><div><label for="f20ClientWeight-${i}">Ciężar (kg)</label><input id="f20ClientWeight-${i}" type="number" step="0.25" min="0" max="9999" value="${esc(x.weight_target_kg)}"></div></div><label for="f20ClientNote-${i}">Wskazówki</label><input id="f20ClientNote-${i}" maxlength="1000" value="${esc(x.notes)}"></div>`).join('')}
 <label for="f20ClientNotes">Wskazówki do treningu</label><textarea id="f20ClientNotes" maxlength="3000" rows="2">${valTextarea(d.notes)}</textarea></div>
 <div class="f20HomeDialogFooter"><button class="ghost" type="button" onclick="f20ClientHomeClose()">Anuluj</button><button class="primary" type="button" id="f20ClientSaveButton" onclick="f20SaveClientHome()">Zapisz zmiany</button></div></div>`;
 modal.addEventListener('click',e=>{if(e.target===modal)f20ClientHomeClose()});
 document.body.appendChild(modal);document.removeEventListener('keydown',f20ClientHomeEscape);document.addEventListener('keydown',f20ClientHomeEscape);
 modal.querySelector('.f19Close')?.focus();
}
async function f20SaveClientHome(){if(trainer()||!f20ClientHomeDraft)return;f20ClientHomeCapture();const d=f20ClientHomeDraft;
 const error=f20ValidHomeDraft(d);if(error){window.alert(error);return}
 const btn=$('f20ClientSaveButton');if(btn)btn.disabled=true;
 try{check(await sb.rpc('forma19_edit_my_home_workout',{
  p_session_id:d.sessionId,p_title:d.name.trim(),p_notes:d.notes,
  p_starts_at:new Date(d.date+'T'+d.from+':00').toISOString(),p_ends_at:new Date(d.date+'T'+d.to+':00').toISOString(),p_exercises:d.items
 }));f20ClientHomeClose();await f18LoadClientData();render();message('Zaktualizowano trening domowy i jego termin.');
 }catch(e){if(btn)btn.disabled=false;window.alert('Nie udało się zapisać: '+e.message)}
}

/* FORMA 2.0 — panel trenerki; zgodnie z zatwierdzonymi zasadami.
 * Te nadpisania korzystają z istniejącego modelu kalendarza i treningów 1.9.
 */
let f20LibraryTab='list',f20LibrarySearch='',f20LibraryGroup='all',f20LibraryUsage='all',f20LibraryOpinionClient='all';
let f20AllOpinions=[],f20AllDiscomfort=[],f20AllComments=[],f20AllExerciseComments=[];
let f20CalendarType='personal',f20TrainerDiaryPeriod='upcoming';

async function f20LoadAllOpinions(){
 if(!trainer())return;
 const res=await Promise.all([
  sb.from('forma_exercise_opinions').select('*'),
  sb.from('forma_exercise_discomfort_events').select('*').order('reported_at',{ascending:false}),
  sb.from('forma_training_comments').select('*').order('updated_at',{ascending:false}),
  sb.from('forma_training_exercise_comments').select('*').order('updated_at',{ascending:false})
 ]);
 if(res.some(r=>r.error)){
  // Działanie innych modułów nie jest uzależnione od agregacji opinii.
  console.warn('FORMA 2.0: Nie udało się odczytać zbiorczych opinii.',res.find(r=>r.error)?.error?.message);
  return;
 }
 [f20AllOpinions,f20AllDiscomfort,f20AllComments,f20AllExerciseComments]=res.map(r=>r.data||[]);
}

  render();}

}

function f20TrainerNotifications(){
 const alerts=f20AllDiscomfort.filter(x=>!x.discussed_at&&!x.resolved_at).map(x=>({
  at:x.reported_at||'',client_id:x.client_id,
  text:`Dyskomfort · ${exercises.find(e=>e.id===x.exercise_id)?.name||'Ćwiczenie'}`,
  kind:'exercise'
 }));
 const comments=[...f20AllComments.map(x=>({...x,_at:x.updated_at,_text:'Nowa notatka do treningu'})),...f20AllExerciseComments.map(x=>({...x,_at:x.updated_at,_text:'Komentarz do ćwiczenia'}))].map(x=>({at:x._at||'',client_id:x.client_id,text:x._text,kind:'diary'}));
 return [...alerts,...comments].sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,50);

async function f20OpenNotification(id,section){if(!clients.some(c=>c.id===id))return;selected=id;await loadClient();tab=section==='exercise'?'exercises':'diary';if(section==='exercise')f20LibraryOpinionClient=id;else f20TrainerDiaryPeriod='past';render()}
function start(){
 if(!trainer())return f18ClientStart();
 const d=new Date().toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});
 const todaySessions=bookings.filter(b=>b.status==='approved'&&new Date(b.starts_at).toDateString()===new Date().toDateString()).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
 const pending=bookings.filter(b=>b.status==='pending'||b.status==='requested').sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
 const notices=f20TrainerNotifications();
 const todayHtml=todaySessions.length?todaySessions.map(b=>`<div class="f20DashboardItem"><strong>${esc(fmtTime(b.starts_at))}–${esc(fmtTime(b.ends_at))}</strong><span>${esc(clients.find(c=>c.id===b.client_id)?.full_name||'Podopieczna')}</span></div>`).join(''):'<p class="hint">Brak treningów na dzisiaj.</p>';
 const pendingHtml=pending.length?pending.map(b=>`<div class="f20DashboardItem"><strong>${esc(clients.find(c=>c.id===b.client_id)?.full_name||'Podopieczna')}</strong><span>${esc(f18ShortDate(b.starts_at))} · ${esc(fmtTime(b.starts_at))}</span></div>`).join(''):'<p class="hint">Brak oczekujących próśb.</p>';
 const noticeHtml=notices.length?notices.map(n=>`<button type="button" class="f20Notification" onclick="f20OpenNotification('${esc(n.client_id)}','${n.kind}')"><strong>${esc(clients.find(c=>c.id===n.client_id)?.full_name||'Podopieczna')}</strong><span>${esc(n.text)}</span><small>${esc(f18ShortDate(n.at))}</small></button>`).join(''):'<p class="hint">Na razie brak nowych uwag i zgłoszeń.</p>';
 return `<div class="f20DashboardIntro"><div class="eyebrow">${esc(d)}</div><h2>Dzień dobry, ${esc(me.full_name?.split(' ')[0]||'Zuzia')}.</h2></div><div class="f20DashboardGrid">
  <section class="card f20DashboardCard"><div class="sectionHeading"><h2>Dzisiejsze treningi</h2><button class="ghost" onclick="switchTab('calendar')">Kalendarz →</button></div><div class="f20DashboardScroll">${todayHtml}</div></section>
  <section class="card f20DashboardCard"><div class="sectionHeading"><h2>Oczekujące prośby</h2><span class="statusPill">${pending.length}</span></div><div class="f20DashboardScroll">${pendingHtml}</div></section>
  <section class="card f20DashboardCard"><div class="sectionHeading"><h2>Powiadomienia</h2><span class="statusPill">${notices.length}</span></div><div class="f20DashboardScroll">${noticeHtml}</div></section>
 </div>`;
}
function f20Age(birth){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(birth||'')))return null;
 const now=new Date(),[year,month,day]=birth.split('-').map(Number);
 let years=now.getFullYear()-year;if(now.getMonth()+1<month||(now.getMonth()+1===month&&now.getDate()<day))years--;
 return years>=0&&years<=120?years:null;
}

async function f20SaveProfile(event){event.preventDefault();if(!trainer()||!selected)return;
 const save=$('f20ProfileSave');if(save)save.disabled=true;

  p_training_location:v('f20Location')||null,p_phone:v('f20Phone').trim(),p_contact_email:v('f20ContactEmail').trim(),p_messenger:v('f20Messenger').trim()};

function f20LibraryRow(e){
 const allRatings=f20AllOpinions.filter(o=>o.exercise_id===e.id&&o.rating!==null&&o.rating!==undefined);
 const average=allRatings.length?allRatings.reduce((s,o)=>s+Number(o.rating),0)/allRatings.length:null;
 const selectedOpinion=f20LibraryOpinionClient==='all'?null:f20AllOpinions.find(o=>o.exercise_id===e.id&&o.client_id===f20LibraryOpinionClient);
 const score=f20LibraryOpinionClient==='all'?(average===null?'Bez ocen':`★ ${average.toLocaleString('pl-PL',{maximumFractionDigits:1})}/5 · ${allRatings.length} ocen`):(selectedOpinion?.rating?`★ ${selectedOpinion.rating}/5`:'Bez oceny');
 const tags=f20Usage(e).map(x=>x==='home'?'W domu':'Z Zuzią').join(' · ');
 return `<div class="f20LibraryItem"><div class="f20LibraryItemHead"><div><strong>${esc(e.name)}</strong><p class="hint">${esc(e.muscle_group||'Bez kategorii')} · ${esc(tags)}${e.equipment?' · '+esc(e.equipment):''}</p></div><span class="f20LibraryRating">${esc(score)}</span></div>
 ${f20LibraryOpinionClient!=='all'?f18TrainerExerciseOpinion(e.id):''}
 <div class="exerciseRowActions"><button type="button" class="ghost" onclick="editLibraryExercise('${esc(e.id)}')">✎ Edytuj</button><button type="button" class="ghost dangerButton" onclick="archiveLibraryExercise('${esc(e.id)}')">Usuń</button></div></div>`;
}

async function saveLibraryExercise(){if(!trainer())return;
 const name=v('ename').trim(),usage=[...($('f20UsePersonal')?.checked?['personal']:[]),...($('f20UseHome')?.checked?['home']:[])];
 if(name.length<2||name.length>150)return message('Nazwa ćwiczenia musi mieć 2–150 znaków.',true);
 if(!usage.length)return message('Wybierz co najmniej jeden typ treningu.',true);
 const video=v('evideo');if(video&&!/^https:\/\//i.test(video))return message('Link do filmu musi zaczynać się od https://',true);
 const data={name,muscle_group:v('egroup'),equipment:v('eequipment')||null,instructions:v('einstructions')||null,video_url:video||null,usage_contexts:usage};
 try{if(exerciseEditingId)check(await sb.from('exercises').update(data).eq('id',exerciseEditingId));else check(await sb.from('exercises').insert(data));exerciseEditingId='';f20LibraryTab='list';await load();message('Ćwiczenie zapisane.');}
 catch(e){message('Nie udało się zapisać ćwiczenia: '+e.message,true)}
}
function f20EditorOpinion(id){
 if(!trainer()||!id)return '';
 const opinion=f18Opinions.find(x=>x.exercise_id===id);
 if(!opinion)return '<div class="f20EditorOpinion">☆ Podopieczna jeszcze nie oceniła tego ćwiczenia.</div>';
 const score=opinion.rating?`★ ${opinion.rating}/5`:'Bez oceny';
 return `<div class="f20EditorOpinion"><strong>${esc(score)}</strong> · Ocena wybranej podopiecznej (jak bardzo lubi ćwiczenie)</div>`;
}

function f21HourOptions(prefTime){
 const hh=Number(String(prefTime||'').slice(0,2)),mm=Number(String(prefTime||'').slice(3,5));
 const prefHour=Number.isFinite(hh)?Math.min(22,Math.max(0,hh+(Number.isFinite(mm)&&mm>0?1:0))):10;
 return Array.from({length:23},(_,h)=>{
  const start=String(h).padStart(2,'0')+':00',end=String(h+1).padStart(2,'0')+':00';
  return `<option value="${start}" ${h===prefHour?'selected':''}>${start} – ${end}</option>`;
 }).join('');
}

 const t=trainer(),pref=calendarDatePrefill||localDateTime(new Date(Date.now()+86400000)),prefDate=pref.slice(0,10),prefTime=pref.slice(11,16);
 const main=card(`<div class="calendarIntro"><div><h2>Kalendarz treningów</h2><p class="hint">${t?'Wybierz termin i rodzaj treningu. Terminy domowe nie zajmują kalendarza Zuzi.':'Najedź na termin na komputerze lub dotknij go na telefonie, aby zobaczyć opis.'}</p></div>${t?`<button type="button" class="primary" onclick="calendarAddAt()">＋ Dodaj trening</button>`:''}</div>

async function saveCalendarBooking(event){
 event.preventDefault();if(!trainer())return;
 const day=v('calendarDate'),from=v('calendarHourRange'),id=v('calendarClient'),type=v('f20CalendarType');
 const start=new Date(`${day}T${from}:00`),end=new Date(start.getTime()+60*60000);
 if(!day||!from||!id||!['home','personal'].includes(type)||!Number.isFinite(start.getTime())||!Number.isFinite(end.getTime()))return message('Wybierz podopieczną, rodzaj, datę i godzinę.',true);
 if(start<=new Date())return message('Wybierz przyszły termin treningu.',true);
 const to=localDateTime(end).slice(11,16);
 if(type==='home'){
  try{
   if(selected!==id){selected=id;f21ProfileEditing=false;await loadClient()}
   calendarFormOpen=false;calendarDatePrefill='';
   tab='plan';f20TrainerHomeStart();
   if(f18HomeDraft){Object.assign(f18HomeDraft,{date:day,from,to});render()}
  }catch(e){message('Nie udało się otworzyć edytora domowego: '+e.message,true)}
  return;
 }
 try{
  check(await sb.from('forma_bookings').insert({client_id:id,starts_at:start.toISOString(),ends_at:end.toISOString(),status:'approved'}));
  calendarFormOpen=false;calendarDatePrefill='';await loadBookings();render();message('Termin z Zuzią zapisany w kalendarzu.');
 }catch(err){message(err.code==='23P01'?'Ten termin zajmuje inna rezerwacja.':'Nie udało się zapisać terminu: '+err.message,true)}
}

function f16BookingWithoutPlanCard(b){return `<div class="f16WorkoutCard"><div class="f16WorkoutTop"><div><div class="hint">${esc(fmtShortDate(b.starts_at))} · ${esc(fmtTime(b.starts_at))}</div><h3>Trening z Zuzią</h3></div><span class="statusPill">Z Zuzią · Brak planu</span></div><p class="hint">Termin jest w kalendarzu, ale nie ma jeszcze przypisanych ćwiczeń.</p><button type="button" class="primary" onclick="startTrainingForBooking('${esc(b.id)}')">Utwórz trening</button></div>`}
function plan(){
 if(!trainer())return card('<p>Plan oglądasz w segmencie Treningi.</p>');
 if(f18HomeEditing)return f18HomeEditor();
 if(trainingDraft)return f17FullEditor();
 if(!clientId())return card('<div class="emptyState">Wybierz podopieczną.</div>');
 const weekPersonal=bookings.filter(b=>b.client_id===clientId()&&b.status==='approved'&&inWeek(b.starts_at)).map(b=>({kind:'personal',date:new Date(b.starts_at),row:b}));
 const weekHome=f18HomeSessions.filter(h=>h.client_id===clientId()&&inWeek(h.starts_at)).map(h=>({kind:'home',date:new Date(h.starts_at),row:h}));
 const week=[...weekPersonal,...weekHome].sort((a,b)=>a.date-b.date);
 const items=week.map(item=>{if(item.kind==='home')return f20HomeWeekCard(item.row);const b=item.row,p=f16PlanForBooking(b);
   return p?storedPlanCard(p):(new Date(b.starts_at)>new Date()?f16BookingWithoutPlanCard(b):`<div class="f16WorkoutCard"><strong>${esc(fmtShortDate(b.starts_at))} · Z Zuzią</strong><p class="hint">Miniony termin bez planu</p></div>`)}).join('');
 return `${trainingWeekHeader()}${card(`<div class="sectionHeading"><h2>Treningi w wybranym tygodniu</h2><span class="statusPill">${week.length} terminów</span></div>
 ${week.length?`<div class="f16WeekCards">${items}</div>`:'<div class="emptyState">Brak treningów w tym tygodniu. Terminy z Zuzią dodasz w Kalendarzu, a trening domowy utworzysz dla wybranej podopiecznej.</div>'}
 <div class="f20AddHomeRow"><button type="button" class="ghost" onclick="f18BeginHomeEdit()">＋ Utwórz trening domowy</button><p class="hint">Trening domowy trafi do kalendarza podopiecznej, nie do kalendarza Zuzi.</p></div>`)}`;
}
function f16OpenResults(id){diarySection='history';f20TrainerDiaryPeriod='past';diaryFocusedBookingId=id;diaryFocusedExerciseId='';calendarSelectedBookingId=id;tab='diary';render();$('diaryWorkout-'+id)?.scrollIntoView({behavior:'smooth',block:'center'})}
function diaryPage(){
 if(!trainer())return card('<p>Dziennik treningowy jest dostępny w segmencie Treningi.</p>');
 if(!clientId())return card('<p>Wybierz podopieczną.</p>');
 const finished=bookings.filter(b=>b.client_id===clientId()&&b.status==='approved'&&new Date(b.ends_at)<=new Date()&&!!f16PlanForBooking(b)).sort((a,b)=>new Date(b.starts_at)-new Date(a.starts_at));
 const upcoming=bookings.filter(b=>b.client_id===clientId()&&b.status==='approved'&&new Date(b.ends_at)>new Date()).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
 const home=f18HomeSessions.filter(h=>h.client_id===clientId()&&(f20TrainerDiaryPeriod==='upcoming'?new Date(h.ends_at)>new Date():new Date(h.ends_at)<=new Date()));
 const isStrength=diarySection==='strength',isUpcoming=f20TrainerDiaryPeriod==='upcoming';
 const nav=`<div class="diarySubtabs" role="tablist"><button type="button" class="diarySubtab ${!isStrength?'active':''}" onclick="diarySection='history';render()">Treningi</button><button type="button" class="diarySubtab ${isStrength?'active':''}" onclick="diarySection='strength';render()">Progres siłowy</button></div>`;
 if(isStrength)return `${card(nav)}${strengthOverview()}`;
 const rows=[...(isUpcoming?upcoming:finished).map(b=>({type:'personal',date:new Date(b.starts_at),b})),...home.map(h=>({type:'home',date:new Date(h.starts_at),h}))].sort((a,b)=>isUpcoming?a.date-b.date:b.date-a.date);
 const cards=rows.map(row=>{
  if(row.type==='home')return `<details class="diaryWorkout"><summary><div><strong>${esc(fmtShortDate(row.h.starts_at))} · ${esc(row.h.title||'Trening domowy')}</strong><div class="hint">W domu · ${esc(fmtTime(row.h.starts_at))}</div></div><span class="statusPill">${f20HomeItems(row.h).length} ćwiczeń</span></summary><div class="diaryInside">${f20HomeWorkoutDetails(row.h)}</div></details>`;
  const b=row.b,p=f16PlanForBooking(b);
  if(isUpcoming){return `<details class="diaryWorkout"><summary><div><strong>${esc(fmtShortDate(b.starts_at))} · ${esc(p?.name||b.title||'Trening z Zuzią')}</strong><div class="hint">Z Zuzią · ${esc(fmtTime(b.starts_at))}</div></div><span class="statusPill">${p?'Plan gotowy':'Brak planu'}</span></summary><div class="diaryInside">${p?f16PlanExercises(p).map(x=>f16ReadExercise(x)).join(''):'<p class="hint">Trenerka nie dodała jeszcze ćwiczeń.</p>'}</div></details>`}
  return diaryBookingCard(b);
 }).join('');
 return `${card(`${nav}<div class="f19WhenFilters"><button type="button" class="${isUpcoming?'active':''}" onclick="f20TrainerDiaryPeriod='upcoming';render()">Nadchodzące treningi</button><button type="button" class="${!isUpcoming?'active':''}" onclick="f20TrainerDiaryPeriod='past';render()">Historia treningów</button></div>`)}${card(cards||'<div class="emptyState">Brak treningów w wybranym zakresie.</div>')}`;
}
