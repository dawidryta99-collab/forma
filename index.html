<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMA — by Zuzia Fiks</title><style>
:root{--bg:#f7f7f4;--ink:#242723;--muted:#747a72;--line:#e6e8e1;--accent:#657b65;--pale:#e8eee6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #a4bda1}header{background:white;border-bottom:1px solid var(--line);padding:16px max(20px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:25px;font-weight:800;letter-spacing:.13em}.sub{font-size:11px;letter-spacing:.04em;color:var(--muted)}.shell{max-width:1120px;margin:auto;padding:30px 20px 90px}.top{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}h1{font-size:32px;letter-spacing:-.04em;margin:0}h2{font-size:21px;letter-spacing:-.03em;margin:0 0 14px}h3{font-size:16px;margin:0 0 8px}p{margin:6px 0 14px}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.tabs button,.ghost{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 15px;border-radius:12px}.tabs button.active{background:var(--ink);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 6px 20px #25342506}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.stat{font-size:29px;font-weight:750;letter-spacing:-.05em}.tag{display:inline-block;padding:5px 10px;border-radius:99px;background:var(--pale);color:#49614a;font-size:12px}.primary{border:0;border-radius:12px;background:var(--accent);color:white;padding:11px 17px;font-weight:650}.danger{color:#a34242}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}label{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid #dce0d8;border-radius:11px;padding:11px;background:#fff;color:var(--ink)}textarea{min-height:80px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice button{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:white;font-size:12px}.choice button.on{background:var(--pale);border-color:var(--accent);color:#3d5b3d}.exercise{border-top:1px solid var(--line);padding:12px 0}.small{font-size:12px}.chart{display:flex;align-items:end;gap:9px;height:155px;padding:12px 0 0;border-bottom:1px solid var(--line)}.bar{flex:1;background:#a9bba4;border-radius:7px 7px 0 0;min-height:6px;position:relative}.bar span{position:absolute;bottom:100%;left:0;font-size:11px;white-space:nowrap}.bar em{position:absolute;top:100%;left:0;font-style:normal;font-size:10px;color:var(--muted)}.recipe{background:#f2f4ee;border-radius:14px;padding:20px}.pill{border:1px solid var(--line);padding:8px 12px;border-radius:999px;background:white}.notice{background:#fff7e7;border:1px solid #f0dfbd;padding:12px 16px;border-radius:12px;font-size:13px;margin:15px 0}.hidden{display:none!important}footer{color:var(--muted);font-size:12px;margin-top:30px} @media(max-width:720px){.grid,.two,.formgrid{grid-template-columns:1fr}.shell{padding:20px 14px 90px}.card{padding:17px}h1{font-size:27px}.tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:5px}.tabs button{white-space:nowrap}header{padding:12px 16px}}
</style></head><body><header><div><div class="logo">FORMA<span style="color:#809581">.</span></div><div class="sub">by Zuzia Fiks</div></div><div style="display:flex;align-items:center;gap:10px"><span class="small muted">Widok demonstracyjny</span><select id="role" style="width:auto" onchange="render()"><option value="trainer">Trenerka</option><option value="client">Podopieczna</option></select></div></header><main class="shell"><div class="top"><div><div class="muted small">TWÓJ TRENING. TWOJE TEMPO.</div><h1 id="title">Panel trenerki</h1></div><span class="tag">● Prototyp v0.2</span></div><nav class="tabs" id="tabs"></nav><div id="app"></div><footer>FORMA • Prototyp lokalny. Dane demonstracyjne zapisują się tylko w tej przeglądarce.</footer></main><script>
const KEY='forma_demo_v1';const initial={clients:[{id:1,name:'Anna Kowalska',goal:'Budowa siły',email:'anna@example.com',weight:67.4},{id:2,name:'Julia Nowak',goal:'Poprawa kondycji',email:'julia@example.com',weight:61.8}],applications:[],weights:[{date:'2026-10-01',value:69.2},{date:'2026-10-15',value:68.5},{date:'2026-11-01',value:67.4}],measurements:[{date:'2026-11-01',waist:74,hips:99,arm:29,thigh:56}],strength:[{date:'2026-10-01',exercise:'Hip thrust',kg:60,reps:10},{date:'2026-10-15',exercise:'Hip thrust',kg:70,reps:10},{date:'2026-11-01',exercise:'Hip thrust',kg:80,reps:8}],recipes:[{id:1,title:'Skyr bowl z owocami',type:'Śniadanie',kcal:420,protein:38,ingredients:'Skyr 250 g, płatki owsiane 50 g, maliny 100 g, miód 10 g',steps:'Wymieszaj skyr z płatkami, dodaj owoce i miód.'},{id:2,title:'Kurczak z ryżem i warzywami',type:'Obiad',kcal:610,protein:49,ingredients:'Pierś z kurczaka 170 g, ryż 80 g (suchy), warzywa 200 g, oliwa 10 g',steps:'Ugotuj ryż, podsmaż kurczaka, podaj z warzywami.'}],plan:[{name:'Hip thrust',sets:4,reps:'8–12'},{name:'Ściąganie drążka',sets:3,reps:'10–12'},{name:'Wyciskanie hantli',sets:3,reps:'8–10'}],logs:[],preferences:{}};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch{db=structuredClone(initial)}let tab='start',selectedClient=1;
function ensureProfiles(){if(!db.profiles)db.profiles={};for(const c of db.clients){if(!db.profiles[c.id])db.profiles[c.id]={weights:c.id===1?[...(db.weights||[])]:[],measurements:c.id===1?[...(db.measurements||[])]:[],strength:c.id===1?[...(db.strength||[])]:[],logs:c.id===1?[...(db.logs||[])]:[],plan:c.id===1?[...(db.plan||[])]:[],preferences:{...(c.preferences||{})}};}if(!db.clients.some(c=>c.id===selectedClient))selectedClient=db.clients[0]?.id||null;}
ensureProfiles();const profile=()=>db.profiles[selectedClient];const currentClient=()=>db.clients.find(c=>c.id===selectedClient);
function selectClient(id){selectedClient=Number(id);render();}
function clientPicker(){return `<section class="card"><label>Wybrana podopieczna</label><select onchange="selectClient(this.value)">${db.clients.map(c=>`<option value="${c.id}" ${c.id===selectedClient?'selected':''}>${esc(c.name)} — ${esc(c.goal)}</option>`).join('')}</select><p class="muted small">Plan, wyniki, waga i pomiary poniżej należą wyłącznie do wybranej osoby.</p></section>`;}
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toISOString().slice(0,10);const card=x=>`<section class="card">${x}</section>`;const btn=(t,fn)=>`<button class="primary" onclick="${fn}">${t}</button>`;const fields=(arr)=>arr.map(([label,id,type='text'])=>`<div><label>${label}</label><input id="${id}" type="${type}" ${type==='number'?'step="any"':''}></div>`).join('');const groups={'Pośladki':['Hip thrust','Glute bridge','Kickback na wyciągu','Odwodzenie na maszynie','Bułgarskie przysiady'],'Nogi':['Suwnica','Przysiady','Wykroki','Prostowanie nóg','Uginanie nóg'],'Plecy':['Ściąganie drążka','Wiosłowanie siedząc','Podciąganie'],'Klatka piersiowa':['Wyciskanie hantli','Wyciskanie na maszynie','Rozpiętki'],'Barki':['Wyciskanie nad głowę','Unoszenie bokiem'],'Ramiona':['Uginanie z hantlami','Prostowanie na wyciągu'],'Brzuch':['Plank','Dead bug','Spięcia brzucha']};function render(){let trainer=el('role').value==='trainer';let tabs=trainer?[['start','Pulpit'],['clients','Podopieczne'],['addclient','Dodaj podopieczną'],['survey','Ankieta'],['plan','Plany treningowe'],['progress','Progres'],['recipes','Przepisy']]:[['start','Pulpit'],['plan','Mój trening'],['progress','Mój progres'],['recipes','Przepisy'],['survey','Preferencje']];if(!tabs.some(x=>x[0]===tab))tab='start';el('title').textContent=trainer?'Panel trenerki':'Panel podopiecznej';el('tabs').innerHTML=tabs.map(([id,t])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';render()">${t}</button>`).join('');el('app').innerHTML=(trainer&&['plan','progress'].includes(tab)?clientPicker():'')+({start:()=>start(trainer),clients,addclient, survey:()=>survey(trainer),plan:()=>plan(trainer),progress:()=>progress(trainer),recipes:()=>recipes(trainer)})[tab]();}function start(trainer){return `<div class="grid">${card(`<div class="muted">Aktywne podopieczne</div><div class="stat">${db.clients.length}</div>`)}${card(`<div class="muted">Nowe ankiety</div><div class="stat">${db.applications.length}</div>`)}${card(`<div class="muted">Ćwiczenia w planie</div><div class="stat">${db.plan.length}</div>`)}</div>${card(`<h2>${trainer?'Dzień dobry, Zuzia 👋':'Cześć, Aniu 👋'}</h2><p class="muted">${trainer?'Zarządzaj klientkami, planami i postępami w jednym miejscu.':'Sprawdź plan, zapisz trening i obserwuj swoje postępy.'}</p>${btn('Otwórz trening',"tab='plan';render()")}`)}${card(`<h2>Ostatnie wyniki</h2>${db.strength.slice(-3).reverse().map(x=>`<div class="row"><span>${esc(x.exercise)} <span class="muted small">${esc(x.date)}</span></span><b>${x.kg} kg × ${x.reps}</b></div>`).join('')}`)}`}
function clients(){return card(`<h2>Podopieczne</h2><p class="muted">Wybierz podopieczną, aby otworzyć jej indywidualny progres.</p><div style="margin:14px 0">${btn('＋ Dodaj podopieczną',"tab='addclient';render()")}</div>${db.clients.map(c=>`<div class="row"><div><b>${esc(c.name)}</b><div class="muted small">${esc(c.goal)} · ${esc(c.email)}</div></div><button class="ghost" onclick="selectClient(${c.id});tab='progress';render()">Zobacz profil →</button></div>`).join('')}<h3 style="margin-top:24px">Nowe zgłoszenia (${db.applications.length})</h3>${db.applications.map((a,i)=>`<div class="row"><div><b>${esc(a.name)}</b><div class="muted small">${esc(a.goal)} · ${esc(a.email)}</div><div class="small">${esc(a.notes)}</div></div>${btn('Utwórz konto',`approve(${i})`)}</div>`).join('')||'<p class="muted">Brak nowych ankiet.</p>'}<div class="notice">W tej wersji „Utwórz konto” dodaje klientkę do demonstracyjnej listy. Nie wysyła zaproszenia ani nie tworzy prawdziwego logowania.</div>`)}function addclient(){return card(`<h2>Nowa podopieczna</h2><p class="muted">Utwórz profil po wypełnieniu ankiety. Dane zostaną zapisane tylko lokalnie w tej demonstracji.</p><h3>1. Dane kontaktowe</h3><div class="formgrid">${fields([['Imię i nazwisko *','newname'],['E-mail *','newemail','email'],['Telefon','newphone','tel']])}</div><h3>2. Współpraca</h3><div class="formgrid"><div><label>Cel treningowy</label><select id="newgoal"><option>Redukcja tkanki tłuszczowej</option><option>Budowa masy mięśniowej</option><option>Zwiększenie siły</option><option>Sprawność i zdrowie</option></select></div><div><label>Treningi tygodniowo</label><select id="newfrequency"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></div><div><label>Data rozpoczęcia</label><input type="date" id="newstart" value="${today()}"></div></div><label>Prywatne notatki trenerki</label><textarea id="newnotes" placeholder="Notatki dotyczące współpracy..."></textarea><h3>3. Dostęp do konta</h3><label><input type="checkbox" id="newinvite" style="width:auto" checked> Przygotuj zaproszenie do aplikacji (wysyłka dostępna dopiero w wersji online)</label><div class="notice">W prototypie nie wysyłamy e-maili i nie tworzymy prawdziwego konta logowania. Dane ankiety można powiązać po wdrożeniu bazy.</div><div style="margin-top:18px">${btn('Utwórz profil','createClient()')} <button class="ghost" onclick="tab='clients';render()">Anuluj</button></div><div id="createClientError" class="muted small" style="margin-top:10px"></div>`)}
function createClient(){let name=el('newname').value.trim(),email=el('newemail').value.trim();if(name.length<2||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){el('createClientError').textContent='Podaj imię i nazwisko oraz poprawny e-mail.';return}if(db.clients.some(c=>c.email.toLowerCase()===email.toLowerCase())){el('createClientError').textContent='Podopieczna z tym adresem e-mail już istnieje.';return}let id=Date.now();db.clients.push({id,name,email,phone:el('newphone').value.trim(),goal:el('newgoal').value,frequency:el('newfrequency').value,start:el('newstart').value,notes:el('newnotes').value,invitePending:el('newinvite').checked,weight:0});db.profiles[id]={weights:[],measurements:[],strength:[],logs:[],plan:[],preferences:{}};selectedClient=id;save();tab='clients';render()}
function approve(i){let a=db.applications.splice(i,1)[0];let id=Date.now();db.clients.push({id,name:a.name,email:a.email,goal:a.goal,weight:Number(a.weight)||0,preferences:a.preferences});db.profiles[id]={weights:a.weight?[{date:today(),value:Number(a.weight)}]:[],measurements:[],strength:[],logs:[],plan:[],preferences:a.preferences||{}};selectedClient=id;save();render()}
function survey(trainer){return `${card(`<h2>${trainer?'Ankieta nowej klientki':'Moje preferencje ćwiczeń'}</h2>${trainer?`<p class="muted">Wypełnij przykładową ankietę, aby przetestować proces przyjęcia nowej klientki.</p><div class="formgrid">${fields([['Imię i nazwisko','sname'],['E-mail','semail','email'],['Wiek','sage','number'],['Wzrost (cm)','sheight','number'],['Waga (kg)','sweight','number'],['Cel treningowy','sgoal']])}</div><label>Kontuzje / ograniczenia i informacje zdrowotne (opcjonalnie)</label><textarea id="shealth" placeholder="W wersji demonstracyjnej nie wpisuj prawdziwych danych zdrowotnych"></textarea><label>Styl życia, sen i oczekiwania</label><textarea id="snotes"></textarea>`:'<p class="muted">Zaznacz, które ćwiczenia lubisz. Możesz zmienić odpowiedź w dowolnym momencie.</p>'}`)}${Object.entries(groups).map(([group,items])=>card(`<h3>${group}</h3>${items.map(ex=>`<div class="exercise"><b>${ex}</b><div class="choice" style="margin-top:8px">${['Lubię','Neutralne','Nie lubię','Nie znam'].map(v=>`<button class="${db.preferences[ex]===v?'on':''}" onclick="pref('${ex}','${v}')">${v}</button>`).join('')}</div></div>`).join('')}`)).join('')}${trainer?card(btn('Wyślij ankietę demonstracyjną','submitSurvey()')):''}`}
function pref(ex,v){db.preferences[ex]=v;save();render()}function submitSurvey(){let name=el('sname').value.trim(),email=el('semail').value.trim();if(!name||!email||!email.includes('@'))return alert('Podaj imię, nazwisko i poprawny e-mail.');db.applications.push({name,email,age:el('sage').value,height:el('sheight').value,weight:el('sweight').value,goal:el('sgoal').value,notes:el('snotes').value,health:el('shealth').value,preferences:{...db.preferences}});save();tab='clients';render();alert('Ankieta zapisana lokalnie.');}
function plan(trainer){return `${card(`<h2>${trainer?'Plan treningowy — edycja':'Trening A — góra i dół'}</h2><p class="muted">${trainer?'Dodawaj ćwiczenia do przykładowego planu.':'Wpisz wynik wykonanej serii. Zapis zostanie dodany do historii progresu.'}</p>${profile().plan.map((x,i)=>`<div class="exercise"><div class="row"><div><b>${esc(x.name)}</b><div class="small muted">${x.sets} serie · ${esc(x.reps)} powtórzeń</div></div>${trainer?`<button class="ghost" onclick="removeExercise(${i})">Usuń</button>`:''}</div>${!trainer?`<div class="formgrid"><div><label>Ciężar (kg)</label><input type="number" step="0.5" min="0" id="kg${i}" placeholder="np. 60"></div><div><label>Powtórzenia</label><input type="number" min="1" id="reps${i}" placeholder="np. 10"></div></div><div style="margin-top:10px">${btn('Zapisz serię',`logSet(${i})`)}</div>`:''}</div>`).join('')}${trainer?`<h3>Dodaj ćwiczenie</h3><div class="formgrid">${fields([['Nazwa','exname'],['Liczba serii','exsets','number'],['Zakres powtórzeń','exreps']])}</div><div style="margin-top:14px">${btn('Dodaj do planu','addExercise()')}</div>`:''}`)}${card(`<h2>Historia zapisanych serii</h2>${profile().logs.slice(-8).reverse().map(x=>`<div class="row"><span>${esc(x.exercise)} <span class="muted small">${x.date}</span></span><b>${x.kg} kg × ${x.reps}</b></div>`).join('')||'<p class="muted">Brak zapisanych serii.</p>'}`)}`}
function removeExercise(i){profile().plan.splice(i,1);save();render()}function addExercise(){let name=el('exname').value.trim(),sets=+el('exsets').value,reps=el('exreps').value.trim();if(!name||sets<1||!reps)return alert('Uzupełnij wszystkie pola.');profile().plan.push({name,sets,reps});save();render()}function logSet(i){let kg=+el('kg'+i).value,reps=+el('reps'+i).value;if(kg<0||!Number.isFinite(kg)||reps<1)return alert('Podaj poprawny ciężar i liczbę powtórzeń.');let x={date:today(),exercise:profile().plan[i].name,kg,reps};profile().logs.push(x);profile().strength.push(x);save();render()}
function chart(data,key){let vals=data.map(x=>+x[key]).filter(Number.isFinite);let max=Math.max(...vals,1);return `<div class="chart">${data.slice(-8).map(x=>`<div class="bar" style="height:${Math.max(8,(+x[key]/max)*110)}px"><span>${esc(x[key])}</span><em>${esc(x.date.slice(5))}</em></div>`).join('')}</div>`}function progress(trainer){let ex=[...new Set(profile().strength.map(x=>x.exercise))];return `${card(`<h2>Progres masy ciała</h2>${chart(profile().weights,'value')}<div class="formgrid">${fields([['Data','wdate','date'],['Waga (kg)','wvalue','number']])}</div><div style="margin-top:14px">${btn('Dodaj pomiar wagi','addWeight()')}</div>`)}${card(`<h2>Progres siłowy</h2><label>Ćwiczenie</label><select id="chartExercise" onchange="updateStrengthChart()">${ex.map(x=>`<option>${esc(x)}</option>`).join('')}</select><div id="strengthChart">${chart(profile().strength.filter(x=>x.exercise===ex[0]),'kg')}</div>`)}${card(`<h2>Pomiary obwodów (cm)</h2>${profile().measurements.slice(-3).map(m=>`<div class="row"><span>${esc(m.date)}</span><span class="small">Talia ${m.waist} · Biodra ${m.hips} · Ramię ${m.arm} · Udo ${m.thigh}</span></div>`).join('')}<div class="formgrid">${fields([['Data','mdate','date'],['Talia (cm)','mwaist','number'],['Biodra (cm)','mhips','number'],['Ramię (cm)','marm','number'],['Udo (cm)','mthigh','number']])}</div><div style="margin-top:14px">${btn('Zapisz pomiary','addMeasurements()')}</div>`)}${card(`<h2>Zdjęcia sylwetki</h2><p class="muted">Docelowo: prywatna galeria i porównanie „przed / po”. W prototypie nie zapisujemy zdjęć, aby nie przechowywać wrażliwych materiałów bez bezpiecznego serwera i kontroli dostępu.</p><span class="tag">Planowane w wersji online</span>`)}`}
function updateStrengthChart(){let x=el('chartExercise').value;el('strengthChart').innerHTML=chart(profile().strength.filter(y=>y.exercise===x),'kg')}function addWeight(){let value=+el('wvalue').value,date=el('wdate').value||today();if(value<=0)return alert('Podaj wagę.');profile().weights.push({date,value});profile().weights.sort((a,b)=>a.date.localeCompare(b.date));save();render()}function addMeasurements(){let m={date:el('mdate').value||today(),waist:+el('mwaist').value,hips:+el('mhips').value,arm:+el('marm').value,thigh:+el('mthigh').value};if([m.waist,m.hips,m.arm,m.thigh].some(x=>x<=0))return alert('Uzupełnij pomiary.');profile().measurements.push(m);save();render()}
function recipes(trainer){return `<div class="two">${db.recipes.map(r=>card(`<div class="recipe"><span class="tag">${esc(r.type)}</span><h2 style="margin:12px 0 6px">${esc(r.title)}</h2><b>${r.kcal} kcal · ${r.protein} g białka</b></div><h3 style="margin-top:18px">Składniki</h3><p>${esc(r.ingredients)}</p><h3>Przygotowanie</h3><p>${esc(r.steps)}</p>`)).join('')}</div>${trainer?card(`<h2>Dodaj przepis</h2><div class="formgrid">${fields([['Nazwa','rtitle'],['Kategoria','rtype'],['Kalorie na porcję','rkcal','number'],['Białko (g)','rprotein','number']])}</div><label>Składniki</label><textarea id="ringredients"></textarea><label>Przygotowanie</label><textarea id="rsteps"></textarea>${btn('Zapisz przepis','addRecipe()')}`):''}`}
function addRecipe(){let title=el('rtitle').value.trim(),type=el('rtype').value.trim(),kcal=+el('rkcal').value,protein=+el('rprotein').value,ingredients=el('ringredients').value.trim(),steps=el('rsteps').value.trim();if(!title||!type||!ingredients||!steps||kcal<0||protein<0)return alert('Uzupełnij przepis.');db.recipes.push({id:Date.now(),title,type,kcal,protein,ingredients,steps});save();render()}render();
</script></body></html>
